    let D = null, P = [], I = [], REV = null, CAMBIOS = null, catalogos = null, temarios = null, hojas = null, conf = null;

    const MESES_L = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    // ══════════ UTILIDADES ══════════
    function leer(t, k) { try { return window[t].getItem(k); } catch (e) { return null; } }
    function guardar(t, k, v) { try { v ? window[t].setItem(k, v) : window[t].removeItem(k); } catch (e) {} }
    function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase(); }
    function unicos(a) { return a.filter((x, i) => x && a.indexOf(x) === i).sort((x, y) => String(x).localeCompare(String(y), 'es')); }
    function isoDe(t) { const m = String(t || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
    /** Espera a que se deje de escribir (150 ms) antes de repintar una lista grande. */
    function conEspera(fn) { let t = null; return () => { clearTimeout(t); t = setTimeout(fn, 150); }; }
    function api(nombre, ...args) { return new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[nombre](...args)); }
    function ocupado(si) { $('cubierta').style.display = si ? 'flex' : 'none'; }
    let lecturas = 0;
    function leyendo(si) { lecturas += si ? 1 : -1; $('barra-lectura').classList.toggle('activa', lecturas > 0); if (lecturas <= 0) { lecturas = 0; $('barra-lectura').style.width = '100%'; setTimeout(() => { $('barra-lectura').style.width = ''; }, 300); } }
    function avisar(html, tipo, ms, accion) {
      const el = document.createElement('div');
      el.className = 'alert alert-' + (tipo || 'success') + ' shadow d-flex align-items-start gap-2';
      el.setAttribute('role', tipo === 'danger' ? 'alert' : 'status');
      el.innerHTML = '<div class="flex-grow-1">' + html + '</div>' + (accion ? '<button class="btn btn-sm btn-dark">' + esc(accion.texto) + '</button>' : '') + '<button class="btn-close" aria-label="Cerrar aviso"></button>';
      el.querySelector('.btn-close').onclick = () => el.remove();
      if (accion) el.querySelector('.btn-dark').onclick = () => { el.remove(); accion.fn(); };
      $('avisos').appendChild(el);
      setTimeout(() => el.remove(), ms || 6000);
    }
    function error(e) {
      ocupado(false);
      const msg = e && e.message ? e.message : String(e);
      if (/SESION_REQUERIDA/.test(msg)) { olvidarSesion(); D = null; mostrarIngreso(); return; }
      avisar('<b>No se pudo completar.</b> ' + esc(msg.replace(/^Error:\s*/, '')), 'danger', 30000);
    }
    function revisarSesion(r) {
      if (r && !r.exito && /sesión no es válida/i.test(r.mensaje || '')) { olvidarSesion(); avisar('Tu sesión expiró. Inicia sesión otra vez.', 'warning'); pedirSesion(); return true; }
      return false;
    }
    function descargarCsv(nombre, filas) {
      const csv = filas.map(f => f.map(v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    }
    function chipFecha(iso, texto) {
      if (!iso) return `<div class="fecha-chip gris"><div class="mes">${esc(texto || 'por definir')}</div></div>`;
      const [a, m, d] = iso.split('-');
      return `<div class="fecha-chip"><div class="dia">${+d}</div><div class="mes">${MESES[+m - 1]} ${a.slice(2)}</div></div>`;
    }
    function badgeEstadoCrono(e) {
      if (!e) return '';
      const n = e.toLowerCase();
      return `<span class="badge ${n.includes('programada') ? 'bg-success-subtle text-success-emphasis' : n.includes('pendiente') ? 'bg-warning-subtle text-warning-emphasis' : n.includes('realiz') || n.includes('ejecut') ? 'bg-primary-subtle text-primary-emphasis' : 'bg-secondary-subtle text-secondary-emphasis'}">${esc(e)}</span>`;
    }
    function opciones(lista, actual, todos) { return (todos ? `<option value="">${esc(todos)}</option>` : '') + lista.map(x => `<option value="${esc(x)}" ${x === actual ? 'selected' : ''}>${esc(x)}</option>`).join(''); }

      $('modal-ficha').addEventListener('hide.bs.modal', ev => {

      $('reg-cedula').oninput = avisarCedulaRepetida;

    /** Pestañas del Dashboard (se recuerda la última abierta en este equipo). */
    function elegirPestana(tab, foco) {
      if (!$('tab-' + tab) || (esProveedor() && (tab === 'cobertura' || tab === 'revision'))) tab = 'asistencia';
      document.querySelectorAll('#inicio-tabs .pestana').forEach(b => { const si = b.dataset.tab === tab; b.setAttribute('aria-selected', String(si)); b.tabIndex = si ? 0 : -1; if (si && foco) b.focus(); });
      document.querySelectorAll('.panel-inicio').forEach(p => { p.hidden = p.id !== 'tab-' + tab; });
      guardar('localStorage', 'sigbe_tab_inicio', tab);
    }
    function grupoChips(id, attr, fn) {
      $(id).addEventListener('click', ev => {
        const b = ev.target.closest('.chip'); if (!b) return;
        $(id).querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        fn(b.dataset[attr]);
      });
    }

    /** Mensajes del arranque: se quedan en pantalla (no desaparecen como los avisos). */
    let relojArranque = null;
    function pasoArranque(texto) {
      $('arranque').style.display = 'block'; $('arranque').className = 'tarjeta p-4 mb-3';
      $('arranque-spin').style.display = ''; $('arranque-txt').innerHTML = esc(texto);
      clearTimeout(relojArranque);
      relojArranque = setTimeout(() => { $('arranque-txt').innerHTML = esc(texto) + '<div class="small text-muted mt-2">Está tardando más de lo normal. La primera lectura después de un cambio puede tomar hasta un minuto; si pasan más de dos, recarga la página.</div>'; }, 45000);
    }
    function finArranque() { clearTimeout(relojArranque); $('arranque').style.display = 'none'; }
    function errorArranque(msg) {
      clearTimeout(relojArranque);
      $('arranque').style.display = 'block'; $('arranque').className = 'alert alert-danger mb-3';
      $('arranque-spin').style.display = 'none';
      $('arranque-txt').innerHTML = '<b>La app no pudo cargar los datos.</b><div class="mt-1">' + esc(String(msg).replace(/^Error:\s*/, '')) + '</div>' +
        '<div class="small mt-2">Si el mensaje no es claro: en el editor de Apps Script ejecuta <b>probarApp</b> y revisa el registro de ejecución.</div>' +
        '<button class="btn btn-sm btn-outline-danger mt-2" data-accion="reintentar"><i class="fa-solid fa-rotate me-1"></i>Reintentar</button>';
    }
    window.addEventListener('error', ev => { if (E.arrancando) errorArranque('Error en la pantalla: ' + ev.message); });
    window.addEventListener('unhandledrejection', ev => { if (E.arrancando) errorArranque('Error en la pantalla: ' + (ev.reason && ev.reason.message || ev.reason)); });

    async function arrancar() {
      E.arrancando = true;
      leyendo(true);
      pasoArranque('Conectando con el servidor…');
      try {
        const ctx = await api('getContexto', E.token, true); // con sesión, trae también los datos
        E.usuario = ctx.usuario; E.perfil = ctx.perfil || null; E.listo = !!(ctx.setup && ctx.setup.listo); E.setup = ctx.setup;
        $('txt-version').textContent = 'SIGBE v' + (ctx.version || '?');
        $('ayuda-version').textContent = 'v' + (ctx.version || '?');
        const vIndex = $('version-index') ? $('version-index').textContent.trim() : '(anterior a 4.10.2)';
        if (vIndex !== VERSION_HTML) banner('Los archivos de la app tienen versiones distintas: <b>Index.html</b> es de otra versión (' + esc(vIndex) + ') que <b>App.html</b> (' + esc(VERSION_HTML) + '): vuelve a pegar <b>Index.html</b> y publica una nueva versión. Mientras tanto algunas pantallas pueden no aparecer.');
        else if (ctx.version && ctx.version !== VERSION_HTML) banner('Los archivos de la app tienen versiones distintas (pantallas ' + esc(VERSION_HTML) + ', servidor ' + esc(ctx.version) + '). Vuelve a pegar <b>SIGBE.gs</b>, <b>Index.html</b> y <b>App.html</b> y publica una nueva versión.');
        if (!E.usuario) olvidarSesion(true);
        pintarSesion();
        if (!E.listo) { finArranque(); pintarSetup(ctx.setup); mostrar('setup'); return; }
        if (!E.usuario) { finArranque(); mostrarIngreso(); return; }
        document.body.classList.remove('modo-ingreso');
        if (E.vista === 'ingreso') E.vista = 'inicio';
        pasoArranque('Leyendo las hojas de cálculo… (la primera vez puede tardar hasta un minuto)');
        D = ctx.datos || await api('getDatos', E.token, false);
        preparar();
        window.__sigbeDatos = true;
        finArranque();
        ir(E.vista === 'setup' ? 'inicio' : E.vista);
        bienvenida();
      } catch (e) {
        if (/SESION_REQUERIDA/.test(e && e.message || '')) { finArranque(); olvidarSesion(true); mostrarIngreso(); } else errorArranque(e && e.message ? e.message : e);
      } finally { leyendo(false); E.arrancando = false; }
    }

    /** Tras un guardado que devuelve los datos ya actualizados (guardarYLeer): se usan esos; si no vinieron, se piden. */
    async function datosNuevos(r) {
      if (r && r.datos) { D = r.datos; preparar(); return; }
      await cargarDatos(false);
    }
    async function cargarDatos(forzar) {
      leyendo(true);
      try {
        D = await api('getDatos', E.token, !!forzar);
        preparar();
        if (forzar) avisar('Datos leídos de nuevo de las hojas.', 'info', 3000);
      } catch (e) { error(e); } finally { leyendo(false); }
    }

    /** Prepara los datos para filtrar rápido en el navegador. */
    function preparar() {
      // Los cambios sin guardar se guardan por posición (j). Al releer, las filas pueden moverse (alguien registró a otra
      // persona en medio): se pasan a la nueva posición de la misma persona para no guardarlos en otra.
      const quien = p => p.tipo + '|' + p.c + '|' + p.n + '|' + p.p;
      const viejos = { HOLCIM: P, INHOUSE: I }, idAsis = {}, idBrig = {};
      Object.keys(asis.cambios).forEach(j => { if (P[j]) idAsis[quien(P[j])] = asis.cambios[j]; });
      Object.keys(brig.cambios).forEach(k => { const [t, j] = k.split(':'); const x = (viejos[t] || [])[j]; if (x) idBrig[quien(x)] = brig.cambios[k]; });
      const fichaId = ficha ? quien(ficha) : '';
      D.sesiones.forEach((s, i) => { s.i = i; });
      // Las sesiones "no aplica" solo se ven (y se habilitan) en el Cronograma; el resto de pantallas usa D.crono
      D.cronoTodo = D.cronoTodo || D.crono;
      D.cronoTodo.forEach((c, k) => { c.k = k; });
      D.crono = D.cronoTodo.filter(c => !c.na);
      D.cronoFilas = D.cronoFilas || [];
      D.unidades = [];
      D.sesiones.forEach(s => { let u = D.unidades.find(x => x.clave === s.clave); if (!u) D.unidades.push(u = { clave: s.clave, modulo: s.modulo, parte: s.parte, titulo: s.titulo, ses: [] }); u.ses.push(s.i); });
      P = D.holcim.map((p, j) => { const o = Object.assign({}, p, { j: j, tipo: 'HOLCIM', sede: (D.plantas[p.p] || {}).sede || p.p, activo: !/desvinculado/i.test(p.e), emp: 'Holcim' }); o.cump = cumplimiento(o); return o; });
      I = D.inhouse.map((p, j) => Object.assign({}, p, { j: j, tipo: 'INHOUSE', activo: !/desvinculado/i.test(p.e), emp: p.k || 'Contratista', cump: { c: 0, t: 0, pct: null } }));
      P.concat(I).forEach(ponerOtrasPlantas);

        `<p class="small text-muted mb-0">Se guarda en "${esc(D.fuentes.asistencia.nombre)}" y queda en el historial. Podrás deshacerlo justo después.</p>`;
      $('conf-ok').innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i>Guardar';
      $('conf-ok').onclick = () => { modal('modal-confirmar').hide(); guardarAsistencia(); };
      modal('modal-confirmar').show();
    }
    async function guardarAsistencia() {
      const s = sesionActual();
      const cambios = Object.keys(asis.cambios).map(Number).map(j => ({ cedula: P[j].c, nombre: P[j].n, fila: P[j].r, valor: asis.cambios[j], anterior: P[j].m.charAt(s.i) === '1' }));
      ocupado(true);
      try {
        const r = await api('guardarAsistenciaLote', E.token, s.key, cambios);
        ocupado(false);
        if (revisarSesion(r)) return;
        if (!r.exito) return avisar(esc(r.mensaje), 'danger', 10000);
        aplicarLocal(s, r.aplicados || []); contarRevision();
        asis.cambios = {};
        pintarLista();
        avisar('<b>' + esc(r.mensaje) + '</b>' + (r.conflictos.length ? '<ul class="small mb-0 mt-1">' + r.conflictos.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : ''),
          r.conflictos.length ? 'warning' : 'success', 15000, (r.aplicados || []).length ? { texto: 'Deshacer', fn: () => deshacer(s, r.aplicados) } : null);
      } catch (e) { error(e); }
    }
    /** Refleja lo guardado sin volver a leer todo. */
    function aplicarLocal(s, aplicados) {
      aplicados.forEach(a => {
        const p = P.find(x => x.r === a.fila && x.n === a.nombre) || P.find(x => x.c === a.cedula && x.n === a.nombre) || (a.cedula ? P.find(x => x.c === a.cedula) : null);
        if (!p) return;
        p.m = p.m.slice(0, s.i) + (a.valor ? '1' : '0') + p.m.slice(s.i + 1);
        D.holcim[p.j].m = p.m;
        p.cump = cumplimiento(p);
      });
    }
    async function deshacer(s, aplicados) {
      ocupado(true);
      try {
        const r = await api('guardarAsistenciaLote', E.token, s.key, aplicados.map(a => ({ cedula: a.cedula, nombre: a.nombre, fila: a.fila, valor: a.anterior, anterior: a.valor })));
        ocupado(false);
        if (revisarSesion(r)) return;
        if (r.exito) { aplicarLocal(s, r.aplicados || []); contarRevision(); }
        avisar(r.exito ? 'Cambios deshechos.' : esc(r.mensaje), r.exito ? 'info' : 'danger');
        if (E.vista === 'asistencia' && asis.paso === 'lista') pintarLista(); else cargarVista(); // la pantalla de atrás también
      } catch (e) { error(e); }
    }
    function imprimirLista() {

      $('print-area').innerHTML = `<h2 style="margin:0 0 4px">Lista de asistencia · ${esc(E.sede)}</h2><div><b>${esc(nombreSesion(s))}</b> — ${esc(s.titulo)}</div>
        <div style="margin-bottom:10px">Fecha programada: ${esc(fechas.join(' / ') || '____/____/______')} &nbsp; Fecha real: ____/____/______ &nbsp; Instructor: ______________________</div>
        <table><thead><tr><th>#</th><th>Nombre y apellido</th><th>Cédula</th><th>Planta</th><th>Asistió</th><th>Firma</th></tr></thead><tbody>` +
        pers.map((p, k) => `<tr><td>${k + 1}</td><td>${esc(p.n)}</td><td>${esc(p.c)}</td><td>${esc(p.p)}</td><td style="text-align:center">${p.m.charAt(s.i) === '1' ? '✔' : '☐'}</td><td class="firma"></td></tr>`).join('') +
        `</tbody></table><div style="margin-top:12px;font-size:9pt">Generado por SIGBE el ${new Date().toLocaleDateString('es-CO')} · ${pers.length} brigadistas</div>`;

    function csvAsistencia() {

        .concat(personasSede(E.sede).map(p => { const x = ses(p, s.i); return [p.n, p.c, p.p, p.e, nombreSesion(s) + ' ' + s.titulo, x.f, x.aplica ? 'SÍ' : 'NO', x.marcada ? 'SÍ' : 'NO']; })));
    }

    // ══════════ AVANCE POR PLANTA ══════════
    // Planta × módulo: % de brigadistas Holcim activos que asistieron, entre los que ya debían tomarlo (sesión que aplica
    // y cuya fecha pasó). "·" = todavía no le toca (con la próxima fecha); "—" = no aplica en esa planta.
    let AVANCE = null;
    function avancePlantas() {
      const k = E.sedes.join('|');
      if (AVANCE && AVANCE.k === k) return AVANCE.v;
      AVANCE = { k: k, v: calcularAvancePlantas() };
      return AVANCE.v;
    }
    function calcularAvancePlantas() {
      return unicos(P.filter(p => p.activo && enSede(p)).map(p => p.p)).map(pl => {
        const pers = P.filter(p => p.activo && p.p === pl), info = D.plantas[pl] || { s: [] };
        let c = 0, t = 0;
        const celdas = D.unidades.map(u => {
          const n = { si: 0, no: 0, pend: 0, na: 0, sina: 0 };
          pers.forEach(p => { n[estadoUnidad(p, u).est]++; });
          const debido = n.si + n.no; c += n.si; t += debido;
          const ses = u.ses.map(k => Object.assign({}, info.s[k] || {}, { idx: k })).filter(x => x.a); // x.i = fecha yyyy-MM-dd
          const prox = ses.filter(x => x.i && x.i >= D.hoy).sort((a, b) => a.i < b.i ? -1 : 1)[0];
          const clave = (ses.find(x => x.f) || ses[0] || {}).idx;
          return { u: u, n: n, debido: debido, pct: debido ? Math.round(n.si / debido * 100) : null, prox: prox, key: clave !== undefined ? D.sesiones[clave].key : '' };
        });
        return { p: pl, sede: (D.plantas[pl] || {}).sede || pl, personas: pers.length, celdas: celdas, c: c, t: t, pct: t ? Math.round(c / t * 100) : null };
      });
    }
    function prepararMatriz() { pintarMultiSel('mat-planta', avancePlantas().map(x => x.p).sort((a, b) => a.localeCompare(b, 'es')), mat.plantas, 'Todas las plantas', 'plantas'); pintarMatriz(); }
    function filasMatriz() {
      const q = norm($('mat-buscar').value), ver = $('mat-ver').value;
      return avancePlantas().filter(x => (!q || norm(x.p + ' ' + x.sede).includes(q)) && (!mat.plantas.length || mat.plantas.indexOf(x.p) !== -1) &&
        (!ver || (ver === 'atrasadas' && x.celdas.some(c => c.pct !== null && c.pct < 100)) || (ver === 'aldia' && x.t > 0 && x.c === x.t)))
        .sort((a, b) => a.sede.localeCompare(b.sede, 'es') || a.p.localeCompare(b.p, 'es'));
    }
    function pintarMatriz() {
      const filas = filasMatriz();
      $('mat-conteo').textContent = filas.length + ' planta(s) · ' + filas.reduce((n, x) => n + x.personas, 0) + ' brigadistas propios activos';
      const color = pct => pct >= 80 ? 'e-si' : pct >= 40 ? 'e-pend' : 'e-no';
      const corta = f => f ? f.slice(0, 5) : '';
      $('mat-tabla').innerHTML = `<table class="matriz"><thead><tr><th class="col-persona" scope="col">Planta</th><th scope="col" title="Brigadistas propios activos">Brig.</th>` +
        D.unidades.map(u => `<th scope="col" title="${esc(u.clave + ': ' + u.titulo)}">${esc(u.clave)}</th>`).join('') + '<th scope="col">Avance</th></tr></thead><tbody>' +
        filas.map(x => `<tr><th scope="row" class="col-persona fw-semibold">${esc(x.p)}<div class="small text-muted fw-normal">${esc(x.sede)}</div></th><td class="text-center">${x.personas}</td>` +
          x.celdas.map(c => {
            const tit = c.u.clave + ' · ' + c.u.titulo + ' — ';
            if (c.pct !== null) return `<td class="celda ${color(c.pct)}" title="${esc(tit + c.n.si + ' de ' + c.debido + ' brigadistas asistieron' + (c.n.pend ? ' · ' + c.n.pend + ' aún no les toca' : '') + '. Clic: abrir la lista')}">
              <a href="#" class="d-block text-reset text-decoration-none" data-accion="ir-asistencia" data-sede="${esc(x.sede)}" data-planta="${esc(x.p)}" data-key="${esc(c.key)}">${c.pct}%<div class="fw-normal" style="font-size:.7rem">${c.n.si}/${c.debido}</div></a></td>`;
            if (c.n.pend) return `<td class="celda e-pend" title="${esc(tit + 'pendiente' + (c.prox ? ': ' + c.prox.f : ': sin fecha en el cronograma'))}">·<div class="fw-normal" style="font-size:.7rem">${esc(corta(c.prox && c.prox.f)) || 's/f'}</div></td>`;
            return `<td class="celda e-na" title="${esc(tit + 'no aplica en esta planta')}">—</td>`;
          }).join('') +
          `<td>${pildoraCump({ c: x.c, t: x.t, pct: x.pct })}</td></tr>`).join('') + '</tbody></table>' + (filas.length ? '' : '<p class="text-muted p-3 mb-0">No hay plantas con ese filtro.</p>');
    }
    function csvMatriz() {
      descargarCsv('avance_por_planta' + sufijoSede() + '.csv', [['Sede', 'Planta', 'Brigadistas propios activos'].concat(D.unidades.map(u => u.clave), ['Avance'])]
        .concat(filasMatriz().map(x => [x.sede, x.p, x.personas].concat(x.celdas.map(c => c.pct !== null ? c.pct + '% (' + c.n.si + '/' + c.debido + ')' : c.n.pend ? 'Pendiente' + (c.prox ? ' ' + c.prox.f : '') : 'No aplica'), [x.pct === null ? '' : x.pct + '% (' + x.c + '/' + x.t + ')']))));
    }

    // ══════════ BRIGADISTAS ══════════
    // Datos del brigadista que se pueden diligenciar (iguales para Holcim y contratistas)
    const CAMPOS_B = {
      cedula: 'Cédula', grupo: 'Grupo sanguíneo', fechaIngreso: 'Fecha de ingreso', empresa: 'Empresa',
      clase1: 'Brigadista Clase I', estado: 'Estado', fechaRetiro: 'Fecha de retiro', certificado: 'Certificado 0256',
      obsRetiro: 'Observaciones del retiro', planta: 'Planta', otrasPlantas: 'Otras plantas',
    };
    function datosDe(p) {
      return p.tipo === 'HOLCIM'
        ? { cedula: p.c, grupo: p.gs || '', fechaIngreso: p.fi || '', empresa: p.em || 'HOLCIM', clase1: p.c1 || '', estado: p.e || '', fechaRetiro: p.fr || '', certificado: p.ce || '', obsRetiro: p.or || '' }
        : { cedula: p.c, grupo: p.gs || '', fechaIngreso: p.fi || '', empresa: p.k || '', clase1: p.c1 || '', estado: p.e || '', fechaRetiro: p.fr || '', certificado: p.ce || '', obsRetiro: p.or || '' };
    }
    /** Qué le falta a la persona (claves de CAMPOS_B). */
    function faltantes(p) {
      const d = datosDe(p), f = [];
      if (!/^\d{5,12}$/.test(String(d.cedula).replace(/\D/g, ''))) f.push('cedula');
      ['grupo', 'fechaIngreso', 'empresa', 'clase1'].forEach(k => { if (!String(d[k]).trim()) f.push(k); });
      if (p.tipo === 'HOLCIM' && !d.estado) f.push('estado');
      if (!p.activo && !d.fechaRetiro) f.push('fechaRetiro');
      return f;
    }
    /** Pasa lo guardado a los datos en memoria (sin volver a leer todo). */
    function aplicarDatos(p, cambios) {
      const iso2txt = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? v.split('-').reverse().join('/') : v;
      const mapa = p.tipo === 'HOLCIM' ? { cedula: 'c', grupo: 'gs', fechaIngreso: 'fi', empresa: 'em', clase1: 'c1', estado: 'e', fechaRetiro: 'fr', certificado: 'ce', obsRetiro: 'or', otrasPlantas: 'op' }
        : { cedula: 'c', grupo: 'gs', fechaIngreso: 'fi', empresa: 'k', clase1: 'c1', estado: 'e', fechaRetiro: 'fr', certificado: 'ce', obsRetiro: 'or', otrasPlantas: 'op' };
      Object.keys(cambios).forEach(k => { if (mapa[k]) p[mapa[k]] = k === 'empresa' && p.tipo === 'INHOUSE' ? String(cambios[k]).toUpperCase() : iso2txt(String(cambios[k])); });
      p.activo = !/desvinculado/i.test(p.e);
      ponerOtrasPlantas(p);
      if (p.tipo === 'INHOUSE') p.emp = p.k || 'Contratista';
      else p.cump = cumplimiento(p); // la fecha de ingreso cambia qué sesiones le aplican
      REV = null;
    }
    function todosBrigadistas() { return P.concat(I); }
    /** HOLCIM, GEOCYCLE, TRANSCEM o FUNDACION (personal propio, según su empresa) o INHOUSE (contratistas). */
    function grupoDe(p) {
      if (p.tipo === 'INHOUSE') return 'INHOUSE';
      const n = norm(p.em);
      return ['GEOCYCLE', 'TRANSCEM', 'FUNDACION'].find(k => n.indexOf(k) !== -1) || 'HOLCIM';
    }
    const NOMBRE_GRUPO = { HOLCIM: 'Holcim', GEOCYCLE: 'Geocycle', TRANSCEM: 'Transcem', FUNDACION: 'Fundación', INHOUSE: 'contratistas' };
    /**
     * Lista desplegable con casillas para elegir varias opciones a la vez (como el selector de sedes). sel es el arreglo
     * de elegidas: vacío = todas. "solo" deja únicamente esa opción.
     */
    function pintarMultiSel(id, opciones, sel, todas, plural) {
      const vigentes = sel.filter(x => opciones.indexOf(x) !== -1); sel.length = 0; vigentes.forEach(x => sel.push(x));
      $(id).dataset.opciones = JSON.stringify(opciones);
      textoMultiSel(id, sel, todas, plural);
      $(id + '-menu').innerHTML = `<div class="d-flex gap-2 px-2 pb-2 mb-1 border-bottom small"><button type="button" class="btn btn-sm btn-link p-0" data-multi-todas>Todas</button><span class="text-muted">·</span><span class="text-muted">marca una o varias</span></div>` +
        opciones.map((o, k) => `<div class="sede-op d-flex align-items-center gap-2 px-2"><input class="form-check-input mt-0" type="checkbox" id="${id}-${k}" data-v="${esc(o)}" ${sel.indexOf(o) !== -1 ? 'checked' : ''}>
          <label class="form-check-label flex-grow-1 py-1" for="${id}-${k}">${esc(o)}</label><button type="button" class="btn btn-sm btn-link p-0 solo" data-solo="${esc(o)}">solo</button></div>`).join('') +
        (opciones.length ? '' : '<div class="px-2 small text-muted">No hay opciones.</div>');
    }
    function textoMultiSel(id, sel, todas, plural) {
      $(id).textContent = !sel.length ? todas : sel.length === 1 ? sel[0] : sel.length + ' ' + plural;
      $(id).title = sel.join(', ');
      $(id).classList.toggle('sede-filtrada', sel.length > 0);
    }
    function escucharMultiSel(id, sel, todas, plural, alCambiar) {
      const menu = $(id + '-menu');
      const poner = lista => { sel.length = 0; lista.forEach(x => sel.push(x)); textoMultiSel(id, sel, todas, plural); alCambiar(); };
      menu.addEventListener('change', ev => {
        const c = ev.target.closest('input[data-v]'); if (!c) return;
        poner([...menu.querySelectorAll('input[data-v]:checked')].map(x => x.dataset.v));
      });
      menu.addEventListener('click', ev => {
        if (ev.target.closest('[data-multi-todas]')) { menu.querySelectorAll('input[data-v]').forEach(x => { x.checked = false; }); poner([]); return; }
        const solo = ev.target.closest('[data-solo]');
        if (solo) { menu.querySelectorAll('input[data-v]').forEach(x => { x.checked = x.dataset.v === solo.dataset.solo; }); poner([solo.dataset.solo]); bootstrap.Dropdown.getOrCreateInstance($(id)).hide(); }
      });
    }
    function prepararBrigadistas() {
      const base = todosBrigadistas().filter(enSedeAlguna);
      pintarMultiSel('brig-planta', unicos(base.map(p => p.p).concat(...base.map(p => p.otras || []))), brig.plantas, 'Todas las plantas', 'plantas');
      pintarMultiSel('brig-empresa', unicos(base.map(p => datosDe(p).empresa)), brig.empresas, 'Todas las empresas', 'empresas');
      pintarBrigadistas();
    }
    function listaBrigadistas() {
      const q = norm($('brig-buscar').value), est = $('brig-estado').value, dat = $('brig-datos').value;
      const pls = brig.plantas, ems = brig.empresas; // vacío = todas
      const lista = todosBrigadistas().filter(p => enSedeAlguna(p) && (!brig.tipo || grupoDe(p) === brig.tipo) && dePlantas(p, pls) &&
        (est === '' || (est === 'act') === p.activo) && (!ems.length || ems.indexOf(datosDe(p).empresa) !== -1) &&
        (!dat || (dat === 'incompletos') === (faltantes(p).length > 0)) &&
        (!q || norm([p.n, p.c, p.p, datosDe(p).empresa].join(' ')).includes(q)));
      const k = brig.orden, d = brig.dir;
      const val = p => { const x = datosDe(p); return { p: p.p, n: p.n, c: String(p.c), grupo: x.grupo, fechaIngreso: isoDe(x.fechaIngreso) || x.fechaIngreso, empresa: x.empresa, clase1: x.clase1, estado: x.estado || 'Activo', fechaRetiro: isoDe(x.fechaRetiro) }[k] || ''; };
      return lista.sort((a, b) => val(a).localeCompare(val(b), 'es') * d || a.n.localeCompare(b.n, 'es'));
    }
    function pintarBrigadistas() {
      const lista = listaBrigadistas();
      brig.visibles = lista;
      document.querySelectorAll('#brig-cab th.ordenable').forEach(th => th.setAttribute('aria-sort', th.dataset.orden === brig.orden ? (brig.dir > 0 ? 'ascending' : 'descending') : 'none'));
      const inc = lista.filter(p => faltantes(p).length).length, por = {};
      lista.forEach(p => { const g = grupoDe(p); por[g] = (por[g] || 0) + 1; });
      $('brig-conteo').innerHTML = `${lista.length} brigadista(s) · ${Object.keys(NOMBRE_GRUPO).filter(g => por[g]).map(g => por[g] + ' ' + NOMBRE_GRUPO[g]).join(' · ')}${inc ? ` · <a href="#" data-accion="brig-incompletos">${inc} con datos por completar</a>` : ''}`;
      // Cuántos hay de cada grupo con los demás filtros (sin el de grupo)
      const tipo = brig.tipo; brig.tipo = ''; const todos = listaBrigadistas(); brig.tipo = tipo;
      const n = {}; todos.forEach(p => { const g = grupoDe(p); n[g] = (n[g] || 0) + 1; });
      document.querySelectorAll('#brig-tipo [data-n]').forEach(x => { x.textContent = x.dataset.n ? n[x.dataset.n] || 0 : todos.length; });
      const editar = brig.editar && E.usuario;
      $('brig-modo').innerHTML = editar ? '<i class="fa-solid fa-xmark me-1"></i>Salir de edición' : '<i class="fa-solid fa-pen-to-square me-1"></i>Editar en la tabla';
      $('brig-modo').className = 'btn btn-sm no-proveedor ' + (editar ? 'btn-warning' : 'btn-outline-primary');
      const max = 400;
      $('brig-tabla').innerHTML = lista.slice(0, max).map(p => {
        const x = datosDe(p), falta = faltantes(p), clave = p.tipo + ':' + p.j, cam = brig.cambios[clave] || {};
        const valor = k => k in cam ? cam[k] : x[k];
        const completar = k => !E.usuario || esProveedor() ? '<span class="badge bg-warning-subtle text-warning-emphasis fw-normal">Falta</span>' : `<button class="btn btn-sm btn-completar" data-accion="completar" data-tipo="${p.tipo}" data-j="${p.j}" data-campo="${k}"><i class="fa-solid fa-plus me-1"></i>Completar</button>`;
        const ver = (k, txt) => falta.indexOf(k) !== -1 ? completar(k) : esc(txt === undefined ? x[k] : txt);
        const ctl = (k, html) => `<td class="${k in cam ? 'celda-cambiada' : ''}">${html}</td>`;
        const op = (lista, v) => (v && lista.indexOf(v) === -1 ? [v].concat(lista) : lista).map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('');
        const inactivo = /desvinculado/i.test(valor('estado'));
        if (editar) {
          const base = `data-tipo="${p.tipo}" data-j="${p.j}"`;
          return `<tr class="${p.activo ? '' : 'text-muted'}"><td class="small">${esc(p.p)}</td><td class="fw-semibold"><a href="#" data-accion="ficha" ${base}>${esc(p.n)}</a></td>
            ${ctl('cedula', falta.indexOf('cedula') !== -1 ? `<input class="form-control form-control-sm ed" ${base} data-campo="cedula" inputmode="numeric" value="${esc(valor('cedula'))}" placeholder="Cédula" style="width:110px">` : esc(x.cedula))}
            ${ctl('grupo', `<select class="form-select form-select-sm ed" ${base} data-campo="grupo" style="width:80px"><option value="">—</option>${op(catalogos.grupos, valor('grupo'))}</select>`)}
            ${ctl('fechaIngreso', `<input type="date" class="form-control form-control-sm ed" ${base} data-campo="fechaIngreso" value="${esc(isoDe(valor('fechaIngreso')) || valor('fechaIngreso'))}" style="width:135px">`)}

    /** Aplica en la memoria lo guardado en varias sesiones. */

    async function guardarAsistenciaFicha() {

        fichaPend = {}; fichaCambio = true;
        if (ficha === f) pintarFicha(false);
        if (r.conflictos.length) avisar('No se guardó: ' + esc(r.conflictos.join('; ')), 'warning', 12000);

    function revisarEdicion() {
      const f = ficha, x = datosDe(f), cambios = {}, anteriores = {};
      // Desvincular pide la fecha de retiro; las observaciones son opcionales
      if ($('ed-estado') && /desvinculado/i.test($('ed-estado').value) && !$('ed-fechaRetiro').value && !(x.fechaRetiro && !isoDe(x.fechaRetiro))) {

      }
      ['cedula', 'grupo', 'fechaIngreso', 'empresa', 'clase1', 'estado', 'fechaRetiro', 'obsRetiro', 'certificado'].forEach(k => {
        const el = $('ed-' + k);
        if (!el || ((k === 'fechaRetiro' || k === 'obsRetiro') && $('ed-retiro-box').style.display === 'none')) return;
        let v = el.value.trim();
        if (k === 'empresa' && f.tipo === 'INHOUSE') v = v.toUpperCase();
        const esFecha = k === 'fechaIngreso' || k === 'fechaRetiro';
        if (esFecha && !v && x[k] && !isoDe(x[k])) return; // "2023" u otro formato que el calendario no muestra: no se borra si no se tocó
        const actual = esFecha ? isoDe(x[k]) || x[k] : x[k];
        if (v !== String(actual || '')) { cambios[k] = v; anteriores[k] = x[k] || ''; }
      });
      // Planta (traslado) y otras plantas
      let plantaNueva = false;
      if ($('ed-planta')) {
        let pl = $('ed-planta').value;
        if (pl === '__nueva') {
          pl = $('ed-planta-nueva').value.trim().replace(/\s+/g, ' ').toUpperCase();
          if (pl.length < 2) { $('ed-planta-nueva').focus(); return avisar('Escribe el nombre de la planta nueva.', 'warning'); }
          const ya = [...$('ed-planta').options].map(o => o.value).find(x => x !== '__nueva' && norm(x) === norm(pl));
          if (ya) pl = ya; else plantaNueva = true;
        }
        if (pl && pl !== f.p) { cambios.planta = pl; anteriores.planta = f.p; }
        const principal = cambios.planta || f.p;
        const otras = [...document.querySelectorAll('#ed-otras input[data-otra]:checked')].map(x => x.dataset.otra).filter(x => x !== principal);
        if (otras.slice().sort().join(', ') !== (f.otras || []).filter(x => x !== principal).sort().join(', ')) { cambios.otrasPlantas = otras.join(', '); anteriores.otrasPlantas = f.op || ''; }
      }
      if (!Object.keys(cambios).length) return avisar('No cambiaste nada.', 'info');
      const fmt = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? v.split('-').reverse().join('/') : v;
      $('conf-titulo').textContent = 'Confirmar cambios de ' + f.n;
      $('conf-cuerpo').innerHTML = '<table class="table table-sm mb-2"><thead><tr><th>Dato</th><th>Antes</th><th>Después</th></tr></thead><tbody>' +
        Object.keys(cambios).map(k => `<tr><td>${CAMPOS_B[k]}</td><td class="text-muted">${esc(anteriores[k] || '—')}</td><td class="fw-semibold">${esc(fmt(cambios[k]) || '—')}</td></tr>`).join('') + '</tbody></table>';
      $('conf-ok').innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i>Guardar cambios';
      if (cambios.planta) $('conf-cuerpo').innerHTML += `<p class="small mb-0"><i class="fa-solid fa-right-left me-1 text-primary"></i>Traslado: ${esc(f.n)} pasa a <b>${esc(cambios.planta)}</b>${plantaNueva ? ' (planta nueva)' : ''} y conserva su asistencia. Las sesiones que le aplican pasan a ser las de esa planta.</p>`;
      $('conf-ok').onclick = () => guardarEdicion(cambios, anteriores, plantaNueva);
      modal('modal-ficha').hide(); modal('modal-confirmar').show();
    }
    async function guardarEdicion(cambios, anteriores, plantaNueva) {
      modal('modal-confirmar').hide(); ocupado(true);
      try {
        const datos = { tipo: ficha.tipo, cedula: ficha.c, nombre: ficha.n, fila: ficha.r, cambios: cambios, anteriores: anteriores, plantaNueva: !!plantaNueva };
        // El traslado mueve la fila en la hoja: se guarda y se vuelven a leer los datos en la misma llamada
        const r = await (cambios.planta ? api('guardarYLeer', E.token, 'actualizarBrigadista', [datos]) : api('actualizarBrigadista', E.token, datos));
        ocupado(false);
        if (revisarSesion(r)) return;

        if (!r.exito) { modal('modal-ficha').show(); return; }
        const fallidos = (r.rechazos || []).map(t => Object.keys(CAMPOS_B).find(c => t.indexOf(CAMPOS_B[c] + ':') === 0)).filter(Boolean);
        const ok = {}; Object.keys(cambios).forEach(c => { if (fallidos.indexOf(c) === -1) ok[c] = cambios[c]; });
        if (ok.planta) { await datosNuevos(r); cargarVista(); return; }
        aplicarDatos(ficha, ok);

              <div class="small text-muted"><i class="fa-solid fa-location-dot me-1"></i>${esc(c.pl)} · ${esc(c.ses)}${c.amb && c.amb !== c.f ? ' · Ambipar: ' + esc(c.amb) : ''}${c.br ? ' · ' + esc(c.br) + ' brigadistas' : ''}${c.obs ? ' · ' + esc(c.obs) : ''}</div></div>

      const c = cronoEd, fmt = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? v.split('-').reverse().join('/') : v;
      const final = { fecha: $('cr-na').checked ? '-' : $('cr-fecha').value, ambipar: $('cr-ambipar').value, estado: $('cr-estado').value, brig: $('cr-brig').value.trim(), obs: $('cr-obs').value.trim() };
      const actuales = x => ({ fecha: x.na ? '-' : x.i || '', ambipar: isoDe(x.amb) || x.amb || '', estado: x.e || '', brig: x.br || '', obs: x.obs || '' });
      const textoAnt = (x, k) => k === 'fecha' ? (x.na ? '-' : x.f || '') : k === 'ambipar' ? x.amb || '' : actuales(x)[k];
      const lote = [];
      const agregar = (x, campos) => {
        const a = actuales(x), cambios = {}, anteriores = {};
        campos.forEach(k => { if (String(final[k]) !== String(a[k]) && !(k === 'ambipar' && !final[k] && !isoDe(x.amb) && x.amb)) { cambios[k] = final[k]; anteriores[k] = textoAnt(x, k); } });
        if (Object.keys(cambios).length) lote.push({ x: x, item: { fila: x.fila, b: x.b, ent: x.ent, pl: x.pl, ses: x.ses, cambios: cambios, anteriores: anteriores } });
      };
      agregar(c, ['fecha', 'ambipar', 'estado', 'brig', 'obs']);
      // A las otras plantas solo pasa lo que se cambió aquí (fecha, fecha Ambipar o estado), no lo que ya estaba
      const cambiados = lote.length ? ['fecha', 'ambipar', 'estado'].filter(k => k in lote[0].item.cambios && !(k === 'fecha' && esProveedor())) : [];
      const marcadas = document.querySelectorAll('#cr-otras input:checked');
      if (marcadas.length && !cambiados.length) return avisar('Para pasarlo a otras plantas, primero cambia aquí la fecha, la fecha Ambipar o el estado.', 'info', 8000);
      marcadas.forEach(el => agregar(D.cronoTodo[+el.dataset.k], cambiados));
      if (!lote.length) return avisar('No cambiaste nada.', 'info');
      const etiqueta = { fecha: 'Fecha', ambipar: 'Fecha Ambipar', estado: 'Estado', brig: '# Brigadistas', obs: 'Observaciones' };
      const ver = v => v === '-' ? 'No aplica' : esc(fmt(v)) || '—';
      $('conf-titulo').textContent = 'Guardar cambios del cronograma (' + lote.length + ' sesión(es))';
      $('conf-cuerpo').innerHTML = `<p class="small mb-2"><b>${esc(c.ent)}</b></p><table class="table table-sm small mb-2"><thead><tr><th>Planta y sesión</th><th>Dato</th><th>Antes</th><th>Después</th></tr></thead><tbody>` +
        lote.map(l => Object.keys(l.item.cambios).map((k, i) => `<tr><td>${i ? '' : esc(l.x.pl + ' · ' + l.x.ses)}</td><td>${etiqueta[k]}</td><td class="text-muted">${ver(l.item.anteriores[k])}</td><td class="fw-semibold">${ver(l.item.cambios[k])}</td></tr>`).join('')).join('') +
        '</tbody></table><p class="small text-muted mb-0">Queda en el historial con tu usuario. La lista de asistencia toma las fechas nuevas sola.</p>';
      $('conf-ok').innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i>Guardar';
      $('conf-ok').onclick = () => guardarCrono(lote.map(l => l.item));
      modal('modal-crono').hide(); modal('modal-confirmar').show();
    }
    async function guardarCrono(lote) {
      modal('modal-confirmar').hide(); ocupado(true);
      try {
        const r = await api('guardarYLeer', E.token, 'guardarCronograma', [lote]);
        ocupado(false);
        if (revisarSesion(r)) return;
        if (!r.exito) return avisar(esc(r.mensaje), 'danger', 12000);
        const malos = r.resultados.filter(x => !x.exito || (x.rechazos && x.rechazos.length));
        avisar('<b>' + esc(r.mensaje) + '</b>' + (malos.length ? '<ul class="small mb-0 mt-1">' + malos.map(x => '<li>' + esc(x.mensaje) + '</li>').join('') + '</ul>' : ''), malos.length ? 'warning' : 'success', 12000);
        await datosNuevos(r); cargarVista();
      } catch (e) { error(e); }
    }

    // Otra sesión de un módulo en una planta: habilita una que estaba en "-" o crea la Sesión N+1

      $('ses-fila').innerHTML = modulos.map(f => `<option value="${f.fila}" ${f.fila === fila ? 'selected' : ''}>${esc(f.cl)} · ${esc(f.nombre)}${f.pre && f.pre !== 'TODOS' ? ' (' + esc(f.pre) + ')' : ''}</option>`).join('');
      const plantas = unicos(D.cronoTodo.filter(enSede).map(c => c.pl));

      $('ses-estado').innerHTML = '<option value="">—</option>' + catalogos.estadosCrono.map(x => `<option ${x === 'Programada' ? 'selected' : ''}>${esc(x)}</option>`).join('');

    }
    function ajustarSesion() {

        ? `Se <b>habilita la ${esc(libre.ses)}</b>: la planta ya tiene esa sesión para otros temas y en este tenía "-".`
        : `Se <b>crea la Sesión ${n}</b> de ${esc(pl)} en el cronograma (un bloque de columnas nuevo, con "-" en los demás temas)` +
          (tieneCols(n) ? '.' : ` y las columnas <b>${esc(f.cl)} Sesión ${n}</b> en la lista de asistencia.`) +
          (D.cronoTodo.some(c => c.pl === pl && c.ses === 'Sesión ' + n) ? '' : ` Las plantas de la lista que usan las fechas de ${esc(pl)} tendrán esa sesión en este tema.`));
      $('ses-ok').textContent = libre ? 'Revisar y habilitar' : 'Revisar y crear';
    }
    function revisarSesion2(ev) {

      $('conf-cuerpo').innerHTML = `<p class="mb-2"><b>${esc(x.f.cl)} · ${esc(x.f.nombre)}</b><br>${esc(x.pl)} · ${x.libre ? esc(x.libre.ses) : 'Sesión ' + x.n}${d.fecha ? ' · ' + esc(d.fecha.split('-').reverse().join('/')) : ' · sin fecha'}${d.estado ? ' · ' + esc(d.estado) : ''}</p>` +
        `<p class="small text-muted mb-0">${x.libre ? 'Se pone la fecha en la sesión que tenía "-".' : 'Cambia la estructura del cronograma' + ($('ses-resumen').innerHTML.indexOf('lista de asistencia') !== -1 ? ' y de la lista de asistencia' : '') + ' (antes se guarda un respaldo del día).'} Queda en el historial.</p>`;
      $('conf-ok').innerHTML = '<i class="fa-solid fa-calendar-plus me-1"></i>' + (x.libre ? 'Habilitar' : 'Crear sesión');
      $('conf-ok').onclick = () => crearSesionApp(x, d);
      modal('modal-sesion').hide(); modal('modal-confirmar').show();
    }
    async function crearSesionApp(x, d) {
      if (x.libre) {
        const c = x.libre, cambios = { fecha: d.fecha || '' };
        if (d.ambipar) cambios.ambipar = d.ambipar; if (d.estado) cambios.estado = d.estado; if (d.obs) cambios.obs = d.obs;
        return guardarCrono([{ fila: c.fila, b: c.b, ent: c.ent, pl: c.pl, ses: c.ses, cambios: cambios, anteriores: { fecha: '-' } }]);
      }
      modal('modal-confirmar').hide(); ocupado(true);
      try {
        const r = await api('guardarYLeer', E.token, 'agregarSesion', [Object.assign({ fila: x.f.fila, ent: x.f.nombre, pl: x.pl }, d)]);
        ocupado(false);
        if (revisarSesion(r)) return;
        avisar(esc(r.mensaje), r.exito ? (r.avisos && r.avisos.length ? 'warning' : 'success') : 'danger', 12000);

      } catch (e) { error(e); }
    }

    // Módulo nuevo (columnas en la lista + fila en el cronograma)
    function siguienteModulo() {
      const n = D.sesiones.map(s => +s.modulo.slice(1)).concat(D.cronoFilas.map(f => /^M(\d+)$/.test(f.cl) ? +f.cl.slice(1) : 0), [11]);
      return 'M' + (Math.max.apply(null, n) + 1);
    }
    async function abrirModulo() {
      if (!E.usuario) return pedirSesion(abrirModulo);

      const sinModulo = D.cronoFilas.filter(f => !f.cl);
      $('mod-fila').innerHTML = sinModulo.map(f => `<option value="${f.fila}">${esc(f.nombre)}${f.pre && f.pre !== 'TODOS' ? ' (' + esc(f.pre) + ')' : ''} · ${esc(f.mes)}</option>`).join('');
      $('mod-tipo-crono').disabled = !sinModulo.length;
      $('mod-tipo-crono-l').title = sinModulo.length ? '' : 'Todos los entrenamientos del cronograma ya tienen módulo';

      $('mod-lineas').innerHTML = catalogos.lineas.map(l => `<div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="mod-l-${l}" value="${l}"><label class="form-check-label" for="mod-l-${l}">${l}</label></div>`).join('');

    }

      document.querySelectorAll('.mod-nuevo').forEach(e => e.style.display = crono ? 'none' : '');
      document.querySelectorAll('.mod-crono').forEach(e => e.style.display = crono ? '' : 'none');
      $('mod-nombre').required = !crono;
      const lineas = [...document.querySelectorAll('#mod-lineas input:checked')].map(x => x.value);
      const nombre = crono ? ($('mod-fila').selectedOptions[0] || {}).textContent || '' : $('mod-nombre').value.trim().toUpperCase();
      $('mod-resumen').innerHTML = `Quedará como <b>${siguienteModulo()}</b>${nombre ? ': ' + esc(nombre) : ''}${!crono ? ' · ' + (lineas.length ? 'solo ' + esc(lineas.join(', ')) : 'todas las líneas') : ''}.<br>
        Se agregan 4 columnas a la lista de asistencia (Sesión 1 y 2 con su casilla)${crono ? ' y se marca esa fila del cronograma' : ' y una fila en el cronograma'}. Después le pones las fechas por planta en el Cronograma.`;
    }
    function revisarModulo(ev) {
      ev.preventDefault();
      const crono = $('mod-tipo-crono').checked;

    async function crearModuloApp(d) {

        ocupado(false);

    // ══════════ COBERTURA ══════════
    /**
     * Cobertura por planta: el total de cada planta es el encabezado de su tarjeta (no una fila más);
     * el detalle por empresa queda plegado. Metas y faltantes en personas enteras (no 0,6 personas).
     */
    /** Brigadistas activos en las listas de la app, por sede (propios + contratistas). */
    function brigadistasEnListas(sede) {
      const propios = P.filter(p => p.activo && (!sede || p.sede === sede) && enSede(p)), c = I.filter(p => p.activo && (!sede || p.sede === sede) && enSede(p)).length;
      const por = {}; propios.forEach(p => { const g = grupoDe(p); por[g] = (por[g] || 0) + 1; });
      const grupos = Object.keys(por).length > 1 ? ['HOLCIM', 'GEOCYCLE', 'TRANSCEM', 'FUNDACION'].filter(g => por[g]).map(g => por[g] + ' ' + NOMBRE_GRUPO[g]).join(', ') : '';
      return { h: propios.length, c: c, t: propios.length + c, grupos: grupos };
    }
    /** Cada tarjeta es una planta del Indicador; todo con números y % explícitos. */
    function pintarCobertura(pre) {
      pre = typeof pre === 'string' ? pre : 'cob';
      const enDash = pre !== 'cob';
      const plantas = plantasCobertura();
      const per = plantas.reduce((n, x) => n + x.per, 0), bri = plantas.reduce((n, x) => n + x.bri, 0), meta = plantas.reduce((n, x) => n + x.metaN, 0);
      const cumplen = plantas.filter(x => !x.faltan).length, L = brigadistasEnListas();
      const kpi = (eti, num, sub, color, detalle) => `<div class="col-6 col-lg-3"><div class="kpi"><div class="eti">${eti}</div><div class="num" style="color:${color || 'inherit'}">${num}</div>${detalle ? '<div class="small fw-semibold">' + detalle + '</div>' : ''}<div class="small text-muted">${sub}</div></div></div>`;
      const propios = plantas.reduce((n, x) => n + x.perPropio, 0), inhouse = plantas.reduce((n, x) => n + x.perInhouse, 0);
      $(pre + '-kpis').innerHTML = kpi('Personal', per, 'trabajadores según la pestaña Indicador', '', `${propios} propios + ${inhouse} inhouse`) +
        kpi('Brigadistas', L.t, `activos en las listas de la app · ${per ? Math.round(L.t / per * 1000) / 10 : 0} % del personal${L.grupos ? ' · ' + L.grupos : ''}`, '', `${L.h} propios + ${L.c} inhouse`) +
        kpi('Meta (20 %)', meta, meta > bri ? `faltan ${meta - bri} brigadistas · vas en ${meta ? Math.round(bri / meta * 100) : 0} % de la meta` : `meta cumplida (${meta ? Math.round(bri / meta * 100) : 0} %)`, meta > bri ? 'var(--s-mal)' : 'var(--s-ok)') +
        kpi('Plantas que cumplen', cumplen + ' de ' + plantas.length, `${plantas.length ? Math.round(cumplen / plantas.length * 100) : 0} % de las plantas${plantas.length - cumplen ? ' · ' + (plantas.length - cumplen) + ' por debajo de la meta' : ''}`, cumplen === plantas.length ? 'var(--s-ok)' : '#e8590c');
      const sin = (D.indicadorSinFila || []).filter(x => sedeOk(x.sede));
      $(pre + '-diferencia').innerHTML = sin.length ? `<details class="alert alert-light border small py-2"><summary><i class="fa-solid fa-circle-info me-1 text-primary"></i><b>${sin.length}</b> brigadista(s) de las listas no tienen fila en el Indicador (su empresa o planta no aparece allí), así que no cuentan para la meta de ninguna planta. Ver cuáles</summary>
        <div class="mt-2">${unicos(sin.map(x => x.sede + ' · ' + x.empresa)).map(k => `<div><b>${esc(k)}</b>: ${sin.filter(x => x.sede + ' · ' + x.empresa === k).map(x => esc(x.nombre)).join(', ')}</div>`).join('')}
        <div class="text-muted mt-1">Para que cuenten, agrega la fila de esa empresa (con su personal) en la pestaña Indicador. o corrige la empresa del brigadista.</div></div></details>` : '';
      const orden = enDash ? {} : (document.querySelector('#cob-orden [aria-pressed="true"]') || {}).dataset || {};
      const lista = plantas.filter(x => enDash || !$('cob-faltan').checked || x.faltan)
        .sort((a, b) => orden.orden === 'nombre' ? a.p.localeCompare(b.p, 'es') : a.pct - b.pct || b.faltan - a.faltan);
      const color = pct => pct >= 100 ? 'var(--s-ok)' : pct >= 60 ? '#f59f00' : 'var(--s-mal)';
      const estado = x => x.faltan ? `<span class="estado-cob bg-danger-subtle text-danger-emphasis">Faltan ${x.faltan}</span>` : '<span class="estado-cob bg-success-subtle text-success-emphasis"><i class="fa-solid fa-check me-1"></i>Cumple</span>';
      $(pre + '-plantas').innerHTML = lista.map(x => {
        const emp = x.empresas.slice().sort((a, b) => b.faltan - a.faltan || a.pct - b.pct);
        return `<details class="planta-cob">
          <summary>
            <i class="fa-solid fa-chevron-right flecha" aria-hidden="true"></i>
            <span class="nombre">${esc(x.p)}<span class="d-block small text-muted fw-normal">${esc(x.sede)}</span></span>
            <span class="avance">${pctBarra(Math.min(x.pct, 100), color(x.pct))}
              <span class="small text-muted"><b class="text-body fs-6">${x.pct} %</b> de la meta · <b class="text-body">${x.bri}</b> brigadistas de <b class="text-body">${x.metaN}</b> requeridos (20 % de ${x.per} personas; hoy son el ${x.pctPer} % del personal)</span></span>
            ${estado(x)}
            <span class="small text-muted">${emp.length} empresa(s)</span>
          </summary>
          <div class="p-2 table-responsive">
            <table class="table table-sm align-middle mb-1 tabla-compacta">
              <thead><tr><th scope="col">Empresa</th><th scope="col" class="text-end">Personal</th><th scope="col" class="text-end">Brigadistas</th><th scope="col" class="text-end">Requeridos</th><th scope="col" style="min-width:160px">% de la meta</th><th scope="col" class="text-end"></th></tr></thead>
              <tbody>${emp.map(f => `<tr><td>${esc(f.emp)}</td><td class="text-end">${f.per}</td><td class="text-end" title="${esc((f.nom || []).join(', '))}">${f.bri}</td><td class="text-end" title="20 % exacto: ${f.meta}">${f.metaN}</td>
                <td><div class="d-flex align-items-center gap-2"><div class="flex-grow-1">${pctBarra(Math.min(f.pct, 100), color(f.pct))}</div><span class="small fw-semibold" style="width:46px">${f.pct} %</span></div></td>
                <td class="text-end">${f.faltan ? `<span class="badge bg-danger-subtle text-danger-emphasis">Faltan ${f.faltan}</span>` : '<i class="fa-solid fa-check text-success" aria-label="Cumple"></i>'}</td></tr>`).join('') || '<tr><td colspan="6" class="text-muted">Sin detalle por empresa en el Indicador.</td></tr>'}</tbody>
            </table>
          </div></details>`;
      }).join('') || '<p class="text-muted">Sin datos para esta sede o filtro.</p>';
    }

    // Brigadistas que faltan en las listas (están en otras pestañas del 1.0 / 2.0 / libro nuevo)
    const falt = { datos: null, fuentes: {}, marcados: {}, ajustes: {} };
    async function abrirFaltantes() {
      if (soloHolcim()) return;
      if (!E.usuario) return pedirSesion(abrirFaltantes);
      ocupado(true);
      try { falt.datos = await api('getBrigadistasFaltantes', E.token); ocupado(false); } catch (e) { return error(e); }
      const d = falt.datos;
      falt.fuentes = {}; falt.marcados = {}; falt.ajustes = {};
      d.fuentes.forEach(f => { falt.fuentes[f.fuente] = !f.evacuadores && !f.contacto; });

    // ══════════ RESTRICCIONES MÉDICAS ══════════
    // Aparte de los datos del brigadista (dato de salud). Las registra Ambipar (o un gestor); todos las ven.
    function fechaCorta(iso) { return /^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? iso.split('-').reverse().join('/') : iso || ''; }
    function puedeRestr() { return !!E.perfil && (E.perfil.rol === 'gestor' || E.perfil.rol === 'proveedor'); }
    function ponerRestricciones() {
      D.restr = D.restr || {};
      P.concat(I).forEach(p => {
        const r = D.restr[String(p.c).replace(/\D/g, '')];
        p.restr = r ? Object.assign({ vigente: !r.h || r.h >= D.hoy }, r) : null;
      });
    }
    function avisoRestr(p) {
      if (!p.restr || !p.restr.vigente) return '';
      return `<div class="text-danger mt-1"><i class="fa-solid fa-notes-medical me-1" aria-hidden="true"></i><b>Restricción médica:</b> ${esc(p.restr.r)}${p.restr.h ? ' <span class="text-muted">(hasta el ' + esc(fechaCorta(p.restr.h)) + ')</span>' : ''}</div>`;
    }
    function pintarRestricciones() {
      if (!D) return;
      $('restr-nueva-btn').style.display = puedeRestr() ? '' : 'none';
      const q = norm($('restr-buscar').value), ver = $('restr-ver').value;
      const lista = todosBrigadistas().filter(p => p.restr && enSedeAlguna(p) && (ver === 'todas' || (ver === 'vencidas') === !p.restr.vigente) &&
        (!q || norm([p.n, p.c, p.p, p.restr.r].join(' ')).includes(q))).sort((a, b) => a.n.localeCompare(b.n, 'es'));
      $('restr-conteo').textContent = lista.length + ' brigadista(s)';
      $('restr-lista').innerHTML = lista.length ? '<div class="tarjeta">' + lista.map(p => `<div class="d-flex flex-wrap align-items-start gap-3 p-3 border-bottom ${p.restr.vigente ? '' : 'opacity-75'}">
          <i class="fa-solid fa-notes-medical fa-lg mt-1 ${p.restr.vigente ? 'text-danger' : 'text-secondary'}" aria-hidden="true"></i>
          <div class="flex-grow-1" style="min-width:220px"><div class="fw-semibold">${esc(p.n)} <span class="small text-muted fw-normal">· C.C. ${esc(p.c)} · ${esc(p.p)}</span></div>
            <div>${esc(p.restr.r)}</div>
            <div class="small text-muted">${p.restr.h ? (p.restr.vigente ? 'Vigente hasta el ' : 'Venció el ') + esc(fechaCorta(p.restr.h)) : 'Sin fecha de fin'} · registró ${esc(p.restr.u || '—')}${p.restr.f ? ' el ' + esc(fechaCorta(p.restr.f)) : ''}</div></div>
          ${puedeRestr() ? `<button class="btn btn-sm btn-outline-secondary" data-accion="restr-editar" data-c="${esc(String(p.c))}"><i class="fa-solid fa-pen me-1"></i>Editar</button>` : ''}
        </div>`).join('') + '</div>'
        : `<div class="tarjeta p-4 text-center text-muted"><i class="fa-solid fa-notes-medical fa-2x mb-2 d-block" aria-hidden="true"></i>${ver === 'vencidas' ? 'No hay restricciones vencidas.' : 'No hay restricciones médicas registradas' + (E.sedes.length ? ' en estas sedes' : '') + '.'}${puedeRestr() && ver !== 'vencidas' ? '<div class="mt-2"><button class="btn btn-sm btn-danger" data-accion="restr-nueva"><i class="fa-solid fa-plus me-1"></i>Registrar restricción</button></div>' : ''}</div>`;
    }
    let restrCedula = '';
    function abrirRestriccion(cedula) {
      if (!puedeRestr()) return avisar('Las restricciones médicas las registra Ambipar.', 'info');
      restrCedula = cedula || '';
      const p = cedula ? todosBrigadistas().find(x => String(x.c) === String(cedula)) : null;
      $('restr-personas').innerHTML = todosBrigadistas().filter(x => x.activo && enSedeAlguna(x)).sort((a, b) => a.n.localeCompare(b.n, 'es'))
        .map(x => `<option value="${esc(x.n + ' · C.C. ' + x.c + ' · ' + x.p)}">`).join('');
      $('restr-persona').value = p ? p.n + ' · C.C. ' + p.c + ' · ' + p.p : '';
      $('restr-persona').disabled = !!p;
      $('restr-texto').value = p && p.restr ? p.restr.r : '';
      $('restr-hasta').value = p && p.restr ? p.restr.h || '' : '';
      $('restr-levantar').style.display = p && p.restr ? '' : 'none';
      mostrarPersonaRestr();
      $('modal-restr').addEventListener('shown.bs.modal', () => (p ? $('restr-texto') : $('restr-persona')).focus(), { once: true });
      modal('modal-restr').show();
    }
    /** La persona elegida (por la cédula que trae la opción, o por nombre o cédula escritos). */
    function personaRestr() {
      if (restrCedula) return todosBrigadistas().find(x => String(x.c) === String(restrCedula)) || null;
      const v = $('restr-persona').value, ced = (v.match(/C\.C\. (\d+)/) || [])[1] || (/^\d{5,12}$/.test(v.trim()) ? v.trim() : '');
      if (ced) return todosBrigadistas().find(x => String(x.c).replace(/\D/g, '') === ced) || null;
      const n = norm(v); return n ? todosBrigadistas().find(x => norm(x.n) === n) || null : null;
    }
    function mostrarPersonaRestr() {
      const p = personaRestr();
      $('restr-persona-txt').innerHTML = p ? (p.restr && !restrCedula ? `<span class="text-danger">Ya tiene una restricción: ${esc(p.restr.r)}. Al guardar se reemplaza.</span>` : '')
        : ($('restr-persona').value ? '<span class="text-warning-emphasis">Elige a la persona de la lista.</span>' : '');
    }
    async function guardarRestriccionApp(ev) {
      if (ev) ev.preventDefault();
      const p = personaRestr();
      if (!p) return avisar('Elige al brigadista de la lista.', 'warning');
      await enviarRestriccion(p, $('restr-texto').value.trim(), $('restr-hasta').value);
    }
    async function levantarRestriccion() {
      const p = personaRestr();
      if (!p || !confirm('¿Levantar la restricción médica de ' + p.n + '? Quedará en el historial.')) return;
      await enviarRestriccion(p, '', '');
    }
    async function enviarRestriccion(p, texto, hasta) {
      ocupado(true);
      try {
        const r = await api('guardarRestriccion', E.token, { cedula: String(p.c), restriccion: texto, hasta: hasta });
        ocupado(false);
        if (revisarSesion(r)) return;
        avisar(esc(r.mensaje), r.exito ? 'success' : 'danger', 8000);
        if (!r.exito) return;
        modal('modal-restr').hide();
        D.restr = r.restr || D.restr; ponerRestricciones();
        cargarVista();
      } catch (e) { error(e); }
    }

    // Registro de ingresos (administradores)
    const ingr = { tipo: '', lista: null, visibles: [] };
    async function cargarIngresos() {
      if (!E.usuario || esProveedor()) { $('ing-sin-sesion').style.display = 'block'; $('ing-contenido').style.display = 'none'; return; }
      $('ing-sin-sesion').style.display = 'none'; $('ing-contenido').style.display = 'block';

      pintarIngresos();
    }
    function pintarIngresos() {
      if (!ingr.lista) return;
      const q = norm($('ing-buscar').value);
      const raro = x => /^Intento/.test(x.tipo);
      const lista = ingr.visibles = ingr.lista.filter(x => (!ingr.tipo || x.tipo.indexOf(ingr.tipo) === 0) && (!q || norm([x.cedula, x.nombre, x.listas, x.tipo].join(' ')).includes(q)));
      const hoy = D ? D.hoy : '', semana = ingr.lista.filter(x => x.iso && hoy && x.iso >= new Date(Date.parse(hoy) - 6 * 864e5).toISOString().slice(0, 10));
      const kpi = (t, v, s, c) => `<div class="col-6 col-lg-3"><div class="kpi"><div class="eti">${t}</div><div class="num" style="color:${c}">${v}</div><div class="small text-muted">${s}</div></div></div>`;
      const ok = x => !/^Intento/.test(x.tipo);
      $('ing-kpis').innerHTML = kpi('Ingresos hoy', ingr.lista.filter(x => x.iso === hoy && ok(x)).length, unicos(ingr.lista.filter(x => x.iso === hoy && ok(x)).map(x => x.nombre)).length + ' usuario(s) distinto(s)', '#0d6efd') +
        kpi('Últimos 7 días', semana.filter(ok).length, unicos(semana.filter(ok).map(x => x.nombre)).length + ' usuario(s) distinto(s)', '#0f5132') +

      const max = 500;
      $('ing-tabla').innerHTML = lista.slice(0, max).map(x => `<tr class="${raro(x) ? 'table-danger' : ''}"><td class="text-nowrap small">${esc(x.fecha)}</td>

        (lista.length > max ? `<tr><td colspan="6" class="text-muted small">Se muestran ${max} de ${lista.length}; descarga el CSV para verlos todos.</td></tr>` : '') || '<tr><td colspan="6" class="text-muted text-center py-4">Sin ingresos con ese filtro</td></tr>';
    }

    // ══════════ CONFIGURACIÓN INICIAL ══════════
    function pintarSetup(st) {
      const faltan = [];

      else if (!st.destinoAccesible) faltan.push('<b>Archivos</b>: ' + esc(st.destinoError));
      if (!st.credenciales) faltan.push('<b>Usuario y clave</b>: no están configurados (SIGBE_USUARIO y SIGBE_CLAVE_INICIAL).');
      $('setup-faltantes').innerHTML = faltan.map(f => `<div class="alert alert-warning py-2 mb-2 small">${f}</div>`).join('');
      $('setup-cuenta').textContent = st.ejecutaComo || '';
      const puede = st.esPropietario && !st.credenciales;
      $('setup-no-propietario').style.display = puede ? 'none' : 'block';
      $('form-setup').style.display = puede ? 'block' : 'none';
    }
    async function enviarSetup(ev) {

      try {
        const r = await api('configuracionInicial', { idDestino: $('setup-destino').value, idOrigen: $('setup-origen').value, usuario: $('setup-usuario').value, clave: $('setup-clave').value });
        ocupado(false);
        avisar(esc(r.mensaje), r.exito ? 'success' : 'danger', 9000);
        if (r.exito) await arrancar();
      } catch (e) { error(e); }
    }
