// SIGBE · código de las pantallas. NO lleva etiquetas <script>: el servidor (doGet en SIGBE.gs) lo manda
// codificado dentro de Index.html para que nada en el camino lo altere, y el navegador lo decodifica y lo ejecuta.
    // ══════════ ESTADO ══════════
    const VERSION_HTML = '4.0.2'; // debe coincidir con SIGBE_VERSION en SIGBE.gs
    const E = { vista: 'inicio', token: leer('sessionStorage', 'sigbe_token'), usuario: null, sede: leer('localStorage', 'sigbe_sede') || '', listo: false, lecturaPublica: false, setup: null };
    let D = null, P = [], I = [], REV = null, CAMBIOS = null, catalogos = null, temarios = null, hojas = null, conf = null;
    const asis = { paso: 'sesiones', key: null, cambios: {}, buscar: '', planta: '', inactivos: false, filtro: '' };
    const brig = { tipo: '', orden: 'n', dir: 1, visibles: [] };
    const crono = { cuando: 'proximas' };
    const rev = { g: '', tipo: '' };
    const cam = { o: '', limite: 200, visibles: [] };
    const hoja = { datos: null, visibles: [] };
    const $ = id => document.getElementById(id);
    const modal = id => bootstrap.Modal.getOrCreateInstance($(id));
    const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const MESES_L = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    // ══════════ UTILIDADES ══════════
    function leer(t, k) { try { return window[t].getItem(k); } catch (e) { return null; } }
    function guardar(t, k, v) { try { v ? window[t].setItem(k, v) : window[t].removeItem(k); } catch (e) {} }
    function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase(); }
    function unicos(a) { return a.filter((x, i) => x && a.indexOf(x) === i).sort((x, y) => String(x).localeCompare(String(y), 'es')); }
    function isoDe(t) { const m = String(t || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
    function diasEntre(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
    function api(nombre, ...args) { return new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[nombre](...args)); }
    function ocupado(si) { $('cubierta').style.display = si ? 'flex' : 'none'; }
    let lecturas = 0;
    function leyendo(si) { lecturas += si ? 1 : -1; $('barra-lectura').classList.toggle('activa', lecturas > 0); if (lecturas <= 0) { lecturas = 0; $('barra-lectura').style.width = '100%'; setTimeout(() => { $('barra-lectura').style.width = ''; }, 300); } }
    function avisar(html, tipo, ms, accion) {
      const el = document.createElement('div');
      el.className = 'alert alert-' + (tipo || 'success') + ' shadow d-flex align-items-start gap-2';
      el.setAttribute('role', tipo === 'danger' ? 'alert' : 'status');
      el.innerHTML = '<div class="flex-grow-1">' + html + '</div>' + (accion ? '<button class="btn btn-sm btn-dark">' + esc(accion.texto) + '</button>' : '') + '<button class="btn-close" aria-label="Cerrar aviso"></button>';
      el.querySelector('.btn-close').onclick = () => el.remove();
      if (accion) el.querySelector('.btn-dark').onclick = () => { el.remove(); accion.fn(); };
      $('avisos').appendChild(el);
      setTimeout(() => el.remove(), ms || 6000);
    }
    function error(e) {
      ocupado(false);
      const msg = e && e.message ? e.message : String(e);
      if (/SESION_REQUERIDA/.test(msg)) { olvidarSesion(); bloqueo(true); pedirSesion(async () => { await arrancar(); }); return; }
      avisar('<b>No se pudo completar.</b> ' + esc(msg.replace(/^Error:\s*/, '')), 'danger', 30000);
    }
    function revisarSesion(r) {
      if (r && !r.exito && /sesión no es válida/i.test(r.mensaje || '')) { olvidarSesion(); avisar('Tu sesión expiró. Inicia sesión otra vez.', 'warning'); pedirSesion(); return true; }
      return false;
    }
    function descargarCsv(nombre, filas) {
      const csv = filas.map(f => f.map(v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    }
    function chipFecha(iso, texto) {
      if (!iso) return `<div class="fecha-chip gris"><div class="mes">${esc(texto || 'por definir')}</div></div>`;
      const [a, m, d] = iso.split('-');
      return `<div class="fecha-chip"><div class="dia">${+d}</div><div class="mes">${MESES[+m - 1]} ${a.slice(2)}</div></div>`;
    }
    function badgeEstadoCrono(e) {
      if (!e) return '';
      const n = e.toLowerCase();
      return `<span class="badge ${n.includes('programada') ? 'bg-success-subtle text-success-emphasis' : n.includes('pendiente') ? 'bg-warning-subtle text-warning-emphasis' : n.includes('realiz') || n.includes('ejecut') ? 'bg-primary-subtle text-primary-emphasis' : 'bg-secondary-subtle text-secondary-emphasis'}">${esc(e)}</span>`;
    }
    function opciones(lista, actual, todos) { return (todos ? `<option value="">${esc(todos)}</option>` : '') + lista.map(x => `<option value="${esc(x)}" ${x === actual ? 'selected' : ''}>${esc(x)}</option>`).join(''); }
    function enSede(x) { return !E.sede || x.sede === E.sede; }
    function tieneCert(c) { return /^\d+$/.test(String(c || '')); }
    function pctBarra(pct, color) { return `<div class="barrita" role="img" aria-label="${pct} %"><div style="width:${Math.max(0, Math.min(pct, 100))}%;background:${color}"></div></div>`; }

    // ══════════ ARRANQUE ══════════
    async function iniciar() {
      window.__sigbeArranco = true;
      document.querySelectorAll('#nav .nav-link').forEach(a => a.onclick = ev => { ev.preventDefault(); ir(a.dataset.vista); });
      document.body.addEventListener('click', clicGeneral);
      $('sel-sede').onchange = () => cambiarSede($('sel-sede').value);
      $('btn-sesion').onclick = () => E.usuario ? cerrarSesion() : pedirSesion();
      $('form-login').onsubmit = iniciarSesion;
      $('form-registro').onsubmit = revisarRegistro;
      $('form-setup').onsubmit = enviarSetup;
      $('form-clave').onsubmit = cambiarClaveApp;
      $('reg-cedula').oninput = avisarCedulaRepetida;
      document.querySelectorAll('input[name="reg-tipo"]').forEach(r => r.onchange = ajustarRegistro);
      ['brig-buscar', 'brig-planta', 'brig-estado', 'brig-cert', 'brig-cump'].forEach(id => $(id).oninput = pintarBrigadistas);
      ['mat-buscar', 'mat-planta', 'mat-estado', 'mat-ver'].forEach(id => $(id).oninput = pintarMatriz);
      ['crono-buscar', 'crono-mes', 'crono-modulo', 'crono-estado'].forEach(id => $(id).oninput = pintarCronograma);
      ['rev-buscar'].forEach(id => $(id).oninput = pintarRevision);
      ['cam-buscar', 'cam-hoja', 'cam-desde', 'cam-hasta'].forEach(id => $(id).oninput = () => { cam.limite = 200; pintarCambios(); });
      ['hoja-buscar', 'hoja-val'].forEach(id => $(id).oninput = pintarHoja);
      $('hoja-col').oninput = () => { llenarValoresHoja(); pintarHoja(); };
      $('hoja-sel').oninput = cargarHoja;
      $('tem-hoja').oninput = cargarTemario;
      $('tem-buscar').oninput = filtrarTemario;
      grupoChips('brig-tipo', 'tipo', v => { brig.tipo = v; pintarBrigadistas(); });
      grupoChips('crono-cuando', 'cuando', v => { crono.cuando = v; pintarCronograma(); });
      grupoChips('rev-grav', 'g', v => { rev.g = v; pintarRevision(); });
      grupoChips('cam-origen', 'o', v => { cam.o = v; cam.limite = 200; pintarCambios(); });
      document.querySelectorAll('#brig-cab th.ordenable').forEach(th => { th.tabIndex = 0; th.onclick = th.onkeydown = ev => { if (ev.type === 'keydown' && ev.key !== 'Enter') return; const k = th.dataset.orden; brig.dir = brig.orden === k ? -brig.dir : 1; brig.orden = k; pintarBrigadistas(); }; });
      window.addEventListener('beforeunload', ev => { if (hayCambios()) { ev.preventDefault(); ev.returnValue = ''; } });
      await arrancar();
    }

    function grupoChips(id, attr, fn) {
      $(id).addEventListener('click', ev => {
        const b = ev.target.closest('.chip'); if (!b) return;
        $(id).querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        fn(b.dataset[attr]);
      });
    }

    /** Mensajes del arranque: se quedan en pantalla (no desaparecen como los avisos). */
    let relojArranque = null;
    function pasoArranque(texto) {
      $('arranque').style.display = 'block'; $('arranque').className = 'tarjeta p-4 mb-3';
      $('arranque-spin').style.display = ''; $('arranque-txt').innerHTML = esc(texto);
      clearTimeout(relojArranque);
      relojArranque = setTimeout(() => { $('arranque-txt').innerHTML = esc(texto) + '<div class="small text-muted mt-2">Está tardando más de lo normal. La primera lectura después de un cambio puede tomar hasta un minuto; si pasan más de dos, recarga la página.</div>'; }, 45000);
    }
    function finArranque() { clearTimeout(relojArranque); $('arranque').style.display = 'none'; }
    function errorArranque(msg) {
      clearTimeout(relojArranque);
      $('arranque').style.display = 'block'; $('arranque').className = 'alert alert-danger mb-3';
      $('arranque-spin').style.display = 'none';
      $('arranque-txt').innerHTML = '<b>La app no pudo cargar los datos.</b><div class="mt-1">' + esc(String(msg).replace(/^Error:\s*/, '')) + '</div>' +
        '<div class="small mt-2">Si el mensaje no es claro: en el editor de Apps Script ejecuta <b>probarApp</b> y revisa el registro de ejecución.</div>' +
        '<button class="btn btn-sm btn-outline-danger mt-2" data-accion="reintentar"><i class="fa-solid fa-rotate me-1"></i>Reintentar</button>';
    }
    window.addEventListener('error', ev => { if (!D) errorArranque('Error en la pantalla: ' + ev.message); });
    window.addEventListener('unhandledrejection', ev => { if (!D) errorArranque('Error en la pantalla: ' + (ev.reason && ev.reason.message || ev.reason)); });

    async function arrancar() {
      leyendo(true);
      pasoArranque('Conectando con el servidor…');
      try {
        const ctx = await api('getContexto', E.token);
        E.usuario = ctx.usuario; E.lecturaPublica = !!ctx.lecturaPublica; E.listo = !!(ctx.setup && ctx.setup.listo); E.setup = ctx.setup;
        $('txt-version').textContent = 'SIGBE v' + (ctx.version || '?');
        $('ayuda-version').textContent = 'v' + (ctx.version || '?');
        if (ctx.version && ctx.version !== VERSION_HTML) banner('Los archivos de la app tienen versiones distintas (pantallas ' + esc(VERSION_HTML) + ', servidor ' + esc(ctx.version) + '). Vuelve a pegar <b>SIGBE.gs</b> e <b>Index.html</b> y publica una nueva versión.');
        if (!E.usuario) olvidarSesion(true);
        pintarSesion();
        if (!E.listo) { finArranque(); pintarSetup(ctx.setup); mostrar('setup'); return; }
        if (!E.lecturaPublica && !E.usuario) { finArranque(); bloqueo(true); pedirSesion(async () => { await arrancar(); }); return; }
        bloqueo(false);
        pasoArranque('Leyendo las hojas de cálculo… (la primera vez puede tardar hasta un minuto)');
        D = await api('getDatos', E.token, false);
        preparar();
        window.__sigbeDatos = true;
        finArranque();
        ir(E.vista === 'setup' ? 'inicio' : E.vista);
      } catch (e) {
        if (/SESION_REQUERIDA/.test(e && e.message || '')) { finArranque(); error(e); } else errorArranque(e && e.message ? e.message : e);
      } finally { leyendo(false); }
    }

    async function cargarDatos(forzar) {
      leyendo(true);
      try {
        D = await api('getDatos', E.token, !!forzar);
        preparar();
        if (forzar) avisar('Datos leídos de nuevo de las hojas.', 'info', 3000);
      } catch (e) { error(e); } finally { leyendo(false); }
    }

    /** Prepara los datos para filtrar rápido en el navegador. */
    function preparar() {
      D.sesiones.forEach((s, i) => { s.i = i; });
      D.unidades = [];
      D.sesiones.forEach(s => { let u = D.unidades.find(x => x.clave === s.clave); if (!u) D.unidades.push(u = { clave: s.clave, modulo: s.modulo, parte: s.parte, titulo: s.titulo, ses: [] }); u.ses.push(s.i); });
      P = D.holcim.map((p, j) => { const o = Object.assign({}, p, { j: j, tipo: 'HOLCIM', sede: (D.plantas[p.p] || {}).sede || p.p, activo: !/desvinculado/i.test(p.e), emp: 'Holcim' }); o.cump = cumplimiento(o); return o; });
      I = D.inhouse.map((p, j) => Object.assign({}, p, { j: j, tipo: 'INHOUSE', activo: !/desvinculado/i.test(p.e), emp: p.k || 'Contratista', cump: { c: 0, t: 0, pct: null } }));
      REV = null;
      if (E.sede && D.sedes.indexOf(E.sede) === -1) E.sede = '';
      $('sel-sede').innerHTML = '<option value="">Todas las sedes</option>' + D.sedes.map(s => `<option ${s === E.sede ? 'selected' : ''}>${esc(s)}</option>`).join('');
      const avisos = (D.avisos || []).concat(D.fuentes.soloLectura && (D.fuentes.soloLectura.asistencia || D.fuentes.soloLectura.datos) ? ['Modo solo lectura en parte de los datos (ver Estado del sistema).'] : []);
      if (avisos.length) banner('<i class="fa-solid fa-triangle-exclamation me-1"></i>' + avisos.map(esc).join(' · ')); else if (!/versiones distintas/.test($('banner').innerHTML)) $('banner').style.display = 'none';
      pintarFrescura();
      const rv = revision();
      const n = rv.filter(r => r.g !== 'info').length;
      $('badge-revision').textContent = n || '';
    }
    function banner(html) { $('banner').innerHTML = html; $('banner').style.display = 'block'; }
    function pintarFrescura() {
      if (!D) { $('frescura').innerHTML = ''; return; }
      const fuente = D.fuentes.corte ? 'libro nuevo' : '1.0 y 2.0';
      $('frescura').innerHTML = `<span title="Archivos de origen: ${esc(D.fuentes.asistencia.nombre)} / ${esc(D.fuentes.datos.nombre)}"><i class="fa-regular fa-clock me-1"></i>Datos de las ${esc(D.generado.slice(11))} · ${fuente}</span>
        <button class="btn btn-sm btn-link p-0" data-accion="refrescar" title="Leer de nuevo las hojas" aria-label="Leer de nuevo las hojas"><i class="fa-solid fa-rotate"></i></button>`;
    }

    // ══════════ NAVEGACIÓN ══════════
    function mostrar(vista) {
      document.querySelectorAll('.vista').forEach(v => v.style.display = 'none');
      $('v-' + vista).style.display = 'block';
      document.querySelectorAll('#nav .nav-link').forEach(a => { const s = a.dataset.vista === vista; a.classList.toggle('active', s); s ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
    }
    function ir(vista) {
      if (!E.listo && vista !== 'setup' && vista !== 'ayuda') vista = 'setup';
      if (E.vista === 'asistencia' && vista !== 'asistencia' && hayCambios() && !confirm('Tienes cambios de asistencia sin guardar. ¿Salir y descartarlos?')) return;
      if (vista !== 'asistencia') asis.cambios = {};
      E.vista = vista;
      mostrar(vista);
      const off = bootstrap.Offcanvas.getInstance($('menu')); if (off) off.hide();
      window.scrollTo(0, 0);
      cargarVista();
    }
    function cargarVista() {
      if (!D && ['setup', 'ayuda', 'configuracion', 'estado'].indexOf(E.vista) === -1) return;
      ({ inicio: pintarInicio, asistencia: pintarAsistencia, matriz: prepararMatriz, brigadistas: prepararBrigadistas, cronograma: prepararCronograma,
         cobertura: pintarCobertura, revision: prepararRevision, cambios: cargarCambios, temarios: cargarTemarios, hojas: cargarHojas,
         estado: cargarEstado, configuracion: cargarConfiguracion, setup: () => {}, ayuda: () => {} })[E.vista]();
    }
    function cambiarSede(s) {
      if (hayCambios() && !confirm('Tienes cambios de asistencia sin guardar. ¿Cambiar de sede y descartarlos?')) { $('sel-sede').value = E.sede; return; }
      E.sede = s; guardar('localStorage', 'sigbe_sede', s);
      asis.paso = 'sesiones'; asis.cambios = {}; asis.planta = '';
      cargarVista();
    }

    /** Clics de todos los botones con data-accion / data-ir (sin onclick en el HTML generado). */
    function clicGeneral(ev) {
      const irA = ev.target.closest('[data-ir]');
      if (irA) { ev.preventDefault(); ir(irA.dataset.ir); return; }
      const el = ev.target.closest('[data-accion]');
      if (!el) return;
      const a = el.dataset.accion, d = el.dataset;
      const acciones = {
        refrescar: async () => { await cargarDatos(true); cargarVista(); },
        reintentar: () => arrancar(),
        login: () => pedirSesion(),
        registrar: abrirRegistro,
        'csv-brig': csvBrigadistas, 'csv-matriz': csvMatriz, 'csv-cambios': csvCambios, 'csv-hoja': csvHoja,
        ficha: () => abrirFicha(d.tipo, +d.j),
        'asis-sede': () => { $('sel-sede').value = d.sede; cambiarSede(d.sede); },
        'asis-sesion': () => elegirSesion(d.key),
        'asis-volver': volverASesiones,
        'asis-filtro': () => { asis.filtro = d.f; pintarAsistencia(); },
        'asis-alternar': () => alternar(+d.j),
        'asis-todos': () => marcarTodos(d.v === '1'),
        'asis-descartar': () => { asis.cambios = {}; pintarAsistencia(); },
        'asis-guardar': confirmarAsistencia,
        'asis-imprimir': imprimirLista, 'asis-csv': csvAsistencia,
        'ir-asistencia': () => { if (d.sede) { E.sede = d.sede; guardar('localStorage', 'sigbe_sede', d.sede); $('sel-sede').value = d.sede; } asis.key = null; asis.paso = 'sesiones'; ir('asistencia'); if (d.key) elegirSesion(d.key); },
        'rev-tipo': () => { rev.tipo = rev.tipo === d.t ? '' : d.t; pintarRevision(); },
        'recargar-cambios': () => { CAMBIOS = null; cargarCambios(); },
        'cambios-mas': () => { cam.limite += 300; pintarCambios(); },
        diagnostico: ejecutarDiagnostico, 'actualizar-ahora': actualizarAhora,
        'guardar-archivos': guardarArchivos, 'guardar-lectura': guardarLectura,
        'auto-on': () => cambiarAutomatico(true), 'auto-off': () => cambiarAutomatico(false),
        'ficha-editar': editarFicha, 'ficha-cancelar': () => pintarFicha(false), 'ficha-revisar': revisarEdicion,
        'ficha-asistencia': () => { modal('modal-ficha').hide(); acciones['ir-asistencia'](); },
      };
      if (acciones[a]) { ev.preventDefault(); acciones[a](); }
    }

    // ══════════ SESIÓN ══════════
    function pintarSesion() {
      $('btn-sesion').innerHTML = E.usuario ? '<i class="fa-solid fa-right-from-bracket me-1"></i>Salir' : '<i class="fa-solid fa-lock me-1"></i>Iniciar sesión';
      $('btn-sesion').className = 'btn btn-sm ' + (E.usuario ? 'btn-outline-secondary' : 'btn-primary');
      $('txt-usuario').innerHTML = E.usuario ? '<i class="fa-solid fa-circle-check text-success me-1"></i>' + esc(E.usuario) : 'Solo lectura';
    }
    function olvidarSesion(silencio) { E.token = null; E.usuario = null; guardar('sessionStorage', 'sigbe_token', null); if (!silencio) pintarSesion(); }
    function bloqueo(si) {
      let b = $('bloqueo');
      if (!b) { b = document.createElement('div'); b.id = 'bloqueo'; b.className = 'alert alert-info m-4'; b.innerHTML = '<i class="fa-solid fa-lock me-2"></i>Esta aplicación exige iniciar sesión para ver la información. <a href="#" data-accion="login">Iniciar sesión</a>'; $('contenido').prepend(b); }
      b.style.display = si ? 'block' : 'none';
      if (si) document.querySelectorAll('.vista').forEach(v => v.style.display = 'none');
    }
    let trasLogin = null;
    function pedirSesion(luego) { trasLogin = luego || null; $('login-error').textContent = ''; $('login-clave').value = ''; modal('modal-login').show(); setTimeout(() => $('login-usuario').focus(), 300); }
    async function iniciarSesion(ev) {
      ev.preventDefault();
      ocupado(true);
      try {
        const r = await api('validarLoginAdmin', $('login-usuario').value, $('login-clave').value);
        ocupado(false);
        if (!r.exito) { $('login-error').textContent = r.mensaje; return; }
        E.token = r.token; E.usuario = r.usuario; guardar('sessionStorage', 'sigbe_token', r.token);
        modal('modal-login').hide(); pintarSesion();
        avisar('Sesión iniciada.', 'success', 3000);
        if (trasLogin) { const f = trasLogin; trasLogin = null; await f(); } else if (!D) await arrancar(); else cargarVista();
      } catch (e) { error(e); }
    }
    function cerrarSesion() {
      api('cerrarSesionApp', E.token).catch(() => {});
      olvidarSesion();
      if (!E.lecturaPublica) { D = null; bloqueo(true); return; }
      cargarVista();
    }

    // ══════════ LÓGICA DE SESIONES (igual que el libro nuevo) ══════════
    /** Estado de la sesión i para la persona p: si = asistió, no = ya pasó sin asistir, pend = pendiente, na = no aplica, sina = marcada sin aplicar. */
    function ses(p, i) {
      const pl = D.plantas[p.p], s = pl ? pl.s[i] : { a: 1, f: '', i: '', o: '' };
      const x = p.x && p.x[i];
      let aplica = !!s.a, f = s.f, iso = s.i, nota = '';
      if (x) {
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(x)) { if (s.o !== 'cronograma') { f = x; iso = isoDe(x); } }
        else { nota = x; if (/no hac[ií]a parte|no aplica/i.test(x)) aplica = false; }
      }
      const marcada = p.m.charAt(i) === '1';
      const est = marcada ? (aplica ? 'si' : 'sina') : !aplica ? 'na' : iso && iso <= D.hoy ? 'no' : 'pend';

    /** Módulos asistidos / módulos que aplican y ya pasaron (con 2 sesiones basta una). */
    function cumplimiento(p) {

        u.ses.forEach(i => { const s = ses(p, i); if (s.est === 'si') { hecho = true; debido = true; } else if (s.est === 'no') debido = true; });
        if (hecho) c++; if (debido) t++;

    }
    function estadoUnidad(p, u) {

      if (ss.some(s => s.est === 'si')) return { est: 'si', ss: ss };
      if (ss.some(s => s.est === 'sina')) return { est: 'sina', ss: ss };
      if (ss.every(s => s.est === 'na')) return { est: 'na', ss: ss };

        avisar('<b>' + esc(r.mensaje) + '</b>' + (r.conflictos.length ? '<ul class="small mb-0 mt-1">' + r.conflictos.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : ''),
          r.conflictos.length ? 'warning' : 'success', 15000, (r.aplicados || []).length ? { texto: 'Deshacer', fn: () => deshacer(s, r.aplicados) } : null);
      } catch (e) { error(e); }
    }
    /** Refleja lo guardado sin volver a leer todo. */
    function aplicarLocal(s, aplicados) {
      aplicados.forEach(a => {
        const p = P.find(x => x.c === a.cedula && x.n === a.nombre) || P.find(x => x.c === a.cedula);
        if (!p) return;
        p.m = p.m.slice(0, s.i) + (a.valor ? '1' : '0') + p.m.slice(s.i + 1);
        D.holcim[p.j].m = p.m;
        p.cump = cumplimiento(p);
      });
      REV = null;
      const n = revision().filter(r => r.g !== 'info').length; $('badge-revision').textContent = n || '';
    }
    async function deshacer(s, aplicados) {
      ocupado(true);
      try {
        const r = await api('guardarAsistenciaLote', E.token, s.key, aplicados.map(a => ({ cedula: a.cedula, nombre: a.nombre, valor: a.anterior, anterior: a.valor })));
        ocupado(false);
        if (revisarSesion(r)) return;
        if (r.exito) aplicarLocal(s, r.aplicados || []);
        avisar(r.exito ? 'Cambios deshechos.' : esc(r.mensaje), r.exito ? 'info' : 'danger');
        if (E.vista === 'asistencia' && asis.paso === 'lista') pintarLista();
      } catch (e) { error(e); }
    }
    function imprimirLista() {

      $('print-area').innerHTML = `<h2 style="margin:0 0 4px">Lista de asistencia · ${esc(E.sede)}</h2><div><b>${esc(nombreSesion(s))}</b> — ${esc(s.titulo)}</div>
        <div style="margin-bottom:10px">Fecha programada: ${esc(fechas.join(' / ') || '____/____/______')} &nbsp; Fecha real: ____/____/______ &nbsp; Instructor: ______________________</div>
        <table><thead><tr><th>#</th><th>Nombre y apellido</th><th>Cédula</th><th>Planta</th><th>Asistió</th><th>Firma</th></tr></thead><tbody>` +
        pers.map((p, k) => `<tr><td>${k + 1}</td><td>${esc(p.n)}</td><td>${esc(p.c)}</td><td>${esc(p.p)}</td><td style="text-align:center">${p.m.charAt(s.i) === '1' ? '✔' : '☐'}</td><td class="firma"></td></tr>`).join('') +
        `</tbody></table><div style="margin-top:12px;font-size:9pt">Generado por SIGBE el ${new Date().toLocaleDateString('es-CO')} · ${pers.length} brigadistas</div>`;

    // ══════════ AVANCE POR PERSONA (MATRIZ) ══════════

        .concat(filasMatriz().map(p => [p.p, p.n, p.c, p.e].concat(D.unidades.map(u => txt[estadoUnidad(p, u).est]), [p.cump.pct === null ? '' : p.cump.pct + '%']))));

    // ══════════ BRIGADISTAS ══════════
    function todosBrigadistas() { return P.concat(I); }

        <td>${p.tipo === 'HOLCIM' ? pildoraCump(p.cump) : '<span class="text-muted small">—</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="text-muted text-center py-4">Sin resultados</td></tr>';

        .concat(brig.visibles.map(p => [p.n, p.c, p.p, p.sede, p.tipo, p.emp, p.e, p.ce, p.cump.pct === null ? '' : p.cump.pct + '%', p.cump.c, p.cump.t, p.fi || ''])));

    // ══════════ FICHA ══════════

        html += `<div class="border rounded p-3 bg-light"><h3 class="h6 fw-bold mb-3"><i class="fa-solid fa-pen me-1"></i>Editar datos</h3><div class="row g-3">` +
          (f.tipo === 'HOLCIM'

               <div class="col-md-4"><label class="form-label small" for="ed-fecha">Fecha de ingreso</label><input type="date" id="ed-fecha" class="form-control form-control-sm" value="${esc(isoDe(f.fi))}"></div>`

          (ocultas ? `<tr class="text-muted"><td colspan="5"><i class="fa-solid fa-circle-info me-1"></i>${ocultas} sesión(es) no aplican en ${esc(f.p)} según el cronograma.</td></tr>` : '') + '</tbody></table></div>';

      $('ficha-pie').innerHTML = editando
        ? '<button class="btn btn-outline-secondary" data-accion="ficha-cancelar">Cancelar</button><button class="btn btn-success" data-accion="ficha-revisar"><i class="fa-solid fa-floppy-disk me-1"></i>Revisar y guardar</button>'
        : '<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button><button class="btn btn-primary" data-accion="ficha-editar"><i class="fa-solid fa-pen me-1"></i>Editar</button>';

    async function cargarCatalogos() {

    async function editarFicha() {

      const f = ficha, cambios = {}, anteriores = {};

      if (f.tipo === 'HOLCIM') {
        poner('estado', $('ed-estado').value, f.e);
        const iso = $('ed-fecha').value;
        if (iso !== isoDe(f.fi)) { cambios.fechaIngreso = iso; anteriores.fechaIngreso = f.fi || ''; }
      } else poner('contratista', $('ed-contratista').value.trim().toUpperCase(), f.k);
      if ($('ed-cert')) poner('certificado', $('ed-cert').value, f.ce);
      if (!Object.keys(cambios).length) return avisar('No cambiaste nada.', 'info');
      const eti = { estado: 'Estado', certificado: 'Certificado 0256', fechaIngreso: 'Fecha de ingreso', contratista: 'Contratista' };

        ocupado(false);
        if (revisarSesion(r)) return;
        avisar(esc(r.mensaje), r.exito ? (r.rechazos && r.rechazos.length ? 'warning' : 'success') : 'danger', 10000);

    // ══════════ REGISTRO ══════════

      if (ya) return avisar('La cédula ' + esc(d.cedula) + ' ya está registrada: <b>' + esc(ya.n) + '</b> (' + esc(ya.p) + ').', 'warning', 9000);
      const fila = (k, v) => v ? `<tr><th class="text-muted fw-normal">${k}</th><td class="fw-semibold">${esc(v)}</td></tr>` : '';

    async function guardarRegistro(d) {

    // ══════════ CRONOGRAMA ══════════

      $('crono-modulo').innerHTML = opciones(unicos(base.map(c => c.ent)), modAct, 'Todos los temas');
      $('crono-estado').innerHTML = opciones(unicos(base.map(c => c.e)), estAct, 'Todos los estados');

    }

              <div class="small text-muted"><i class="fa-solid fa-location-dot me-1"></i>${esc(c.pl)} · ${esc(c.ses)}${c.amb && c.amb !== c.f ? ' · Ambipar: ' + esc(c.amb) : ''}${c.br ? ' · ' + esc(c.br) + ' brigadistas' : ''}${c.obs ? ' · ' + esc(c.obs) : ''}</div></div>
            ${badgeEstadoCrono(c.e)}${hay ? `<button class="btn btn-sm btn-outline-primary" data-accion="ir-asistencia" data-sede="${esc(c.sede)}" data-key="${esc(key)}"><i class="fa-solid fa-clipboard-check me-1"></i>Asistencia</button>` : ''}</div>`;

    // ══════════ REVISIÓN DE DATOS ══════════
    const TIPOS_REV = {
      'marca-no-aplica': ['error', 'Asistencia en sesión que no aplica'],
      'cedula-dup': ['error', 'Cédula repetida'],
      'sin-registro': ['aviso', 'Sesión pasada sin asistencia registrada'],
      'marca-futura': ['aviso', 'Asistencia marcada en fecha futura'],
      'marca-antes-ingreso': ['aviso', 'Asistencia antes de entrar a la brigada'],
      'fecha-distinta': ['aviso', 'Fecha de la hoja distinta al cronograma'],
      'cedula-invalida': ['aviso', 'Cédula vacía o con formato raro'],
      'planta-sin-crono': ['aviso', 'Planta sin cronograma'],
      'indicador-difiere': ['aviso', 'Indicador distinto a las listas'],
      'seguimiento-sin-marcas': ['aviso', 'Seguimiento dice que se dictó, la lista no tiene asistentes'],

      'seguimiento-sin-sesion': ['info', 'Sesión del Seguimiento sin pareja en el cronograma'],
      'datos': ['aviso', 'Problema al leer los datos'],
      'nombre-dup': ['info', 'Mismo nombre con cédulas distintas'],
      'sin-asistencias': ['info', 'Activo sin ninguna asistencia'],
      'sin-fecha-ingreso': ['info', 'Sin fecha de ingreso'],
      'sin-cert': ['info', 'Contratista sin certificado 0256'],
      'crono-estado': ['info', 'Sesión pasada que sigue "Programada"'],
      'crono-sin-fecha': ['info', 'Sesión sin fecha en el cronograma'],
    };
    function revision() {
      if (REV) return REV;
      const R = [];
      const add = (tipo, o) => R.push(Object.assign({ tipo: tipo, g: TIPOS_REV[tipo][0], titulo: TIPOS_REV[tipo][1] }, o));
      (D.avisos || []).forEach(a => add('datos', { detalle: a, que: 'Revisa Estado del sistema.' }));
      const hace = n => { const d = new Date(D.hoy); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
      P.forEach(p => {
        D.sesiones.forEach(s => {
          const x = ses(p, s.i);
          if (x.est === 'sina') add('marca-no-aplica', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n}: ${nombreSesion(s)} está marcada pero no aplica (${x.nota || x.mo}).`, que: 'Quita la marca en la lista, o si sí se dictó corrige el cronograma. El libro nuevo no la cuenta.' });
          if (x.marcada && x.aplica && x.iso && x.iso > D.hoy) add('marca-futura', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n}: ${nombreSesion(s)} es el ${x.f} y ya tiene asistencia.`, que: 'Revisa si la marca se puso en la sesión equivocada.' });
          if (x.marcada && x.iso && p.fi && isoDe(p.fi) && x.iso < isoDe(p.fi)) add('marca-antes-ingreso', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n}: asistió a ${nombreSesion(s)} (${x.f}) pero entró a la brigada el ${p.fi}.`, que: 'Corrige la fecha de ingreso o la marca.' });
        });
        if (p.activo && p.cump.t >= 2 && p.cump.c === 0) add('sin-asistencias', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n} tiene ${p.cump.t} módulos vencidos y ninguna asistencia.`, que: 'Revisa si faltan marcas o si la persona sigue en la brigada.' });
        if (p.activo && !p.fi) add('sin-fecha-ingreso', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n} no tiene fecha de ingreso a la brigada.`, que: 'Agrégala en su ficha (Editar).' });
      });
      // Fechas de la hoja distintas al cronograma (por planta y sesión)
      Object.keys(D.plantas).forEach(pl => {
        const info = D.plantas[pl];
        if (!info.enCrono) add('planta-sin-crono', { sede: info.sede, planta: pl, detalle: `${pl}: no tiene bloque en el cronograma (${info.s[0] ? info.s[0].mo : ''}). Se ofrecen todas las sesiones.`, que: 'Agrega la planta al cronograma o a la tabla LN_PLANTAS.' });
        D.sesiones.forEach(s => {
          const c = info.s[s.i];
          if (c.o !== 'cronograma') return;
          const dif = P.filter(p => p.p === pl && p.x[s.i] && /^\d{2}\//.test(p.x[s.i]));
          if (dif.length) add('fecha-distinta', { sede: info.sede, planta: pl, detalle: `${pl} · ${nombreSesion(s)}: el cronograma dice ${c.f} y en la lista dice ${unicos(dif.map(p => p.x[s.i])).join(', ')} (${dif.length} persona(s)).`, que: 'Queda la del cronograma. Si la correcta es la de la lista, corrige el cronograma.' });
        });

      unicos(P.map(p => p.sede)).forEach(sede => sesionesSede(sede).forEach(x => {
        if (x.aplica && x.iso && x.iso < hace(3) && !x.marcadas && x.total) add('sin-registro', { sede: sede, detalle: `${sede} · ${nombreSesion(x.s)} (${x.s.titulo}) fue el ${x.fecha} y no tiene ninguna asistencia.`, que: 'Registra la asistencia o, si no se dictó, actualiza el cronograma.', key: x.s.key });
      }));
      // Cédulas y nombres
      const todos = P.concat(I), porCed = {}, porNom = {};
      todos.forEach(p => {
        const c = String(p.c).replace(/\D/g, '');
        if (!c || c.length < 5 || c.length > 12) add('cedula-invalida', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n} (${p.p}): cédula "${p.c || 'vacía'}".`, que: 'Corrígela en la hoja: la app ubica a las personas por cédula.' });
        else (porCed[c] = porCed[c] || []).push(p);
        (porNom[norm(p.n)] = porNom[norm(p.n)] || []).push(p);
      });
      Object.keys(porCed).forEach(c => { if (porCed[c].length > 1) add('cedula-dup', { sede: porCed[c][0].sede, planta: porCed[c][0].p, persona: porCed[c][0], detalle: `Cédula ${c}: ${porCed[c].map(p => p.n + ' (' + p.p + ', ' + (p.tipo === 'HOLCIM' ? 'Holcim' : 'contratista') + ')').join(' / ')}.`, que: 'Deja una sola fila por persona o corrige la cédula equivocada.' }); });
      Object.keys(porNom).forEach(n => { const l = porNom[n]; if (l.length > 1 && unicos(l.map(p => String(p.c).replace(/\D/g, ''))).length > 1) add('nombre-dup', { sede: l[0].sede, planta: l[0].p, persona: l[0], detalle: `${l[0].n}: ${l.map(p => p.c + ' (' + p.p + ')').join(' / ')}.`, que: 'Si es la misma persona, deja una sola cédula.' }); });
      I.forEach(p => { if (p.activo && !tieneCert(p.ce)) add('sin-cert', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n} (${p.k}): certificado "${p.ce || 'vacío'}".`, que: 'Actualiza el certificado en su ficha cuando lo tenga.' }); });
      // Indicador frente a las listas
      unicos(D.indicador.map(f => f.sede)).forEach(sede => {
        const filas = D.indicador.filter(f => f.sede === sede && !f.tot);
        const hInd = filas.filter(f => /holcim/i.test(f.emp)).reduce((n, f) => n + f.bri, 0);
        const hLista = P.filter(p => p.activo && p.sede === sede).length;
        if (filas.length && hLista && hInd !== hLista) add('indicador-difiere', { sede: sede, detalle: `${sede}: el Indicador dice ${hInd} brigadistas Holcim y en la lista hay ${hLista} activos.`, que: 'Actualiza la pestaña Indicador. o revisa los estados en la lista.' });
      });
      // "2026 Seguimiento" frente a las marcas de la lista: se empareja por tema y fecha (los nombres de planta no coinciden entre pestañas)
      (D.seguimiento || []).forEach(sg => {
        if (!sg.i || !/realiz/i.test(sg.ej) || !sg.cl) return;
        const sesiones = D.sesiones.filter(s => s.clave === sg.cl || s.modulo === sg.cl);
        const pares = [];
        Object.keys(D.plantas).forEach(pl => sesiones.forEach(s => { if (D.plantas[pl].s[s.i].a && D.plantas[pl].s[s.i].i === sg.i) pares.push({ pl: pl, s: s }); }));
        if (!pares.length) { add('seguimiento-sin-sesion', { sede: '', detalle: `${sg.cap} · ${sg.pl} · ${sg.f}: en el Seguimiento figura como realizada (${sg.ah} asistentes Holcim) pero ninguna planta tiene esa sesión con esa fecha en el cronograma.`, que: 'Revisa la fecha en el Seguimiento o en el cronograma.' }); return; }
        const marcas = pares.reduce((n, x) => n + P.filter(p => p.p === x.pl && p.m.charAt(x.s.i) === '1').length, 0);
        const sede = (D.plantas[pares[0].pl] || {}).sede || '';
        const ses = unicos(pares.map(x => nombreSesion(x.s))).join(', ');
        if (sg.ah > 0 && marcas === 0) add('seguimiento-sin-marcas', { sede: sede, planta: pares[0].pl, detalle: `${sede} · ${ses} (${sg.f}): el Seguimiento dice ${sg.ah} asistentes Holcim y en la lista no hay ninguna marca.`, que: 'Marca en la app quiénes asistieron (con la lista firmada de esa sesión).', key: pares[0].s.key });
        else if (sg.ah && marcas !== sg.ah) add('seguimiento-difiere', { sede: sede, planta: pares[0].pl, detalle: `${sede} · ${ses} (${sg.f}): Seguimiento ${sg.ah} asistentes Holcim, lista ${marcas}.`, que: 'Revisa cuál de los dos está bien.', key: pares[0].s.key });
      });
      D.crono.forEach(c => {
        if (c.i && c.i < hace(7) && /programada/i.test(c.e)) add('crono-estado', { sede: c.sede, planta: c.pl, detalle: `${c.pl} · ${c.ses} · ${c.ent}: fue el ${c.f} y su estado sigue "${c.e}".`, que: 'Actualiza el estado en el cronograma.' });
        if (!c.i && P.some(p => p.sede === c.sede)) add('crono-sin-fecha', { sede: c.sede, planta: c.pl, detalle: `${c.pl} · ${c.ses} · ${c.ent}: aún sin fecha.`, que: 'Pon la fecha en el cronograma cuando se programe.' });
      });
      return (REV = R);
    }
    function prepararRevision() { pintarRevision(); }
    function pintarRevision() {

      ['error', 'aviso', 'info'].forEach(g => { $('rev-n-' + g).textContent = todo.filter(r => r.g === g).length; });
      const porTipo = {};
      todo.filter(r => !rev.g || r.g === rev.g).forEach(r => { porTipo[r.tipo] = (porTipo[r.tipo] || 0) + 1; });
      if (rev.tipo && !porTipo[rev.tipo]) rev.tipo = '';
      $('rev-tipos').innerHTML = Object.keys(TIPOS_REV).filter(t => porTipo[t]).map(t => `<button class="chip" data-accion="rev-tipo" data-t="${t}" aria-pressed="${rev.tipo === t}"><span class="punto punto-${TIPOS_REV[t][0]}"></span>${esc(TIPOS_REV[t][1])}<span class="n">${porTipo[t]}</span></button>`).join('');
      const q = norm($('rev-buscar').value);
      const orden = { error: 0, aviso: 1, info: 2 };
      const lista = todo.filter(r => (!rev.g || r.g === rev.g) && (!rev.tipo || r.tipo === rev.tipo) && (!q || norm(r.detalle + ' ' + (r.planta || '') + ' ' + r.titulo).includes(q)))
        .sort((a, b) => orden[a.g] - orden[b.g] || a.tipo.localeCompare(b.tipo));
      $('rev-conteo').textContent = lista.length + ' punto(s)';
      const max = 400;
      $('rev-lista').innerHTML = lista.slice(0, max).map(r => `<div class="rev rev-${r.g}"><div class="d-flex flex-wrap gap-2 align-items-start">
          <div class="flex-grow-1"><div class="small text-muted">${esc(r.titulo)}${r.sede ? ' · ' + esc(r.sede) : ''}</div><div>${esc(r.detalle)}</div><div class="small mt-1"><i class="fa-solid fa-arrow-right me-1 text-primary"></i>${esc(r.que)}</div></div>
          ${r.persona ? `<button class="btn btn-sm btn-outline-secondary" data-accion="ficha" data-tipo="${r.persona.tipo}" data-j="${r.persona.j}">Ver ficha</button>` : ''}
          ${r.key ? `<button class="btn btn-sm btn-outline-primary" data-accion="ir-asistencia" data-sede="${esc(r.sede)}" data-key="${esc(r.key)}">Registrar</button>` : ''}</div></div>`).join('') +
        (lista.length > max ? `<p class="text-muted small">Se muestran ${max} de ${lista.length}; usa los filtros para ver el resto.</p>` : '') +
        (lista.length ? '' : '<p class="text-success"><i class="fa-solid fa-check me-1"></i>Nada que revisar con este filtro.</p>');
    }

    // ══════════ HISTORIAL DE CAMBIOS ══════════
    async function cargarCambios() {
      if (CAMBIOS) return pintarCambios();
      leyendo(true);
      try { CAMBIOS = await api('getCambios', E.token); }
      catch (e) { return error(e); } finally { leyendo(false); }
      const porCed = {}; P.concat(I).forEach(p => { porCed[String(p.c).replace(/\D/g, '')] = p; });
      CAMBIOS.forEach(c => { const p = porCed[String(c.cedula).replace(/\D/g, '')]; c.sede = p ? p.sede : ''; c.persona = p || null; });
      $('cam-hoja').innerHTML = opciones(unicos(CAMBIOS.map(c => c.hoja)), '', 'Todas las hojas');

        (!de || c.iso >= de) && (!a || c.iso <= a) && (!q || norm([c.nombre, c.cedula, c.detalle, c.accion, c.usuario, c.antes, c.despues].join(' ')).includes(q)));

    // ══════════ TEMARIOS ══════════

    }
    async function cargarTemario() {
      leyendo(true);
      try {
        const r = await api('getTemarioCapacitacion', E.token, $('tem-hoja').value);
        $('tem-acordeon').innerHTML = r.grupos.map((g, i) => `<div class="accordion-item" data-texto="${esc(norm(g.titulo + ' ' + g.items.map(it => it.map(x => x.valor).join(' ')).join(' ')))}">
          <h2 class="accordion-header"><button class="accordion-button ${i ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#tem-${i}" aria-expanded="${!i}"><span style="white-space: pre-line;">${esc(g.titulo || r.encabezado)}</span><span class="badge text-bg-secondary ms-2">${g.items.length}</span></button></h2>

    function filtrarTemario() {
      const q = norm($('tem-buscar').value);
      document.querySelectorAll('#tem-acordeon .accordion-item').forEach(el => { el.style.display = !q || el.dataset.texto.includes(q) ? '' : 'none'; });
    }

    // ══════════ OTRAS HOJAS ══════════
    async function cargarHojas() {
      if (hojas) return;
      leyendo(true);
      try {
        hojas = await api('getHojasExtra', E.token);
        $('hoja-sel').innerHTML = hojas.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
        if (hojas.length) cargarHoja(); else $('hoja-tabla').innerHTML = '<p class="text-muted p-3 mb-0">No hay otras pestañas visibles.</p>';
      } catch (e) { error(e); } finally { leyendo(false); }
    }
    async function cargarHoja() {
      leyendo(true);
      try {
        hoja.datos = await api('getHojaExtra', E.token, $('hoja-sel').value);
        $('hoja-titulo').textContent = hoja.datos.titulo || '';
        $('hoja-col').innerHTML = '<option value="">Filtrar por columna…</option>' + hoja.datos.encabezados.map((h, k) => `<option value="${k}">${esc(h)}</option>`).join('');
        const kPlanta = hoja.datos.encabezados.findIndex(h => /^(PLANTA|SEDE)/.test(norm(h)));
        if (kPlanta !== -1) $('hoja-col').value = String(kPlanta);
        llenarValoresHoja();
        $('hoja-buscar').value = '';
        pintarHoja();
      } catch (e) { error(e); } finally { leyendo(false); }
    }
    function llenarValoresHoja() {
      const k = $('hoja-col').value;
      if (k === '') { $('hoja-val').innerHTML = '<option value="">—</option>'; $('hoja-val').disabled = true; return; }
      $('hoja-val').disabled = false;
      const vals = unicos(hoja.datos.filas.map(f => f[+k]));
      const pref = E.sede ? vals.find(v => norm(v).includes(norm(E.sede))) : '';
      $('hoja-val').innerHTML = opciones(vals.slice(0, 300), pref || '', 'Todos los valores');
    }
    function pintarHoja() {
      if (!hoja.datos) return;
      const q = norm($('hoja-buscar').value), k = $('hoja-col').value, v = $('hoja-val').value;
      const lista = hoja.datos.filas.filter(f => (k === '' || !v || f[+k] === v) && (!q || norm(f.join(' ')).includes(q)));
      hoja.visibles = lista;
      $('hoja-conteo').textContent = lista.length + ' de ' + hoja.datos.filas.length + ' fila(s)';
      $('hoja-tabla').innerHTML = `<table class="table table-sm table-striped align-middle mb-0 small"><thead><tr>${hoja.datos.encabezados.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>` +
        lista.slice(0, 1500).map(f => '<tr>' + f.map(x => `<td style="white-space:pre-line;min-width:90px">${esc(x)}</td>`).join('') + '</tr>').join('') + '</tbody></table>' +
        (lista.length > 1500 ? '<p class="small text-muted p-2">Se muestran 1.500 filas; usa el buscador o descarga el CSV.</p>' : '');
    }
    function csvHoja() { if (hoja.datos) descargarCsv(hoja.datos.nombre + '.csv', [hoja.datos.encabezados].concat(hoja.visibles)); }

    // ══════════ ESTADO DEL SISTEMA ══════════
    async function cargarEstado() {
      leyendo(true);
      try {
        const e = await api('getEstadoSistema', E.token);
        const tarjeta = (est, titulo, valor, sub) => `<div class="col-sm-6 col-xl-3"><div class="tarjeta p-3 h-100"><div class="small text-muted text-uppercase"><span class="punto punto-${est}"></span>${titulo}</div><div class="fw-bold mt-1">${valor}</div><div class="small text-muted">${sub || ''}</div></div></div>`;
        $('estado-tarjetas').innerHTML = e.archivos.map(a => tarjeta(!a.configurado ? 'info' : a.ok ? 'ok' : 'error', a.nombre, !a.configurado ? 'Sin configurar' : a.ok ? esc(a.titulo) : 'No se puede abrir', a.ok ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">Abrir</a>` : esc(a.error || ''))).join('') +
          tarjeta(e.automatica.activa ? 'ok' : 'aviso', 'Tarea automática', e.automatica.activa ? 'Activa' : 'Apagada', e.automatica.activa ? 'Cada ' + e.automatica.cadaHoras + ' hora(s)' : 'Actívala en Configuración') +
          `<div class="col-12"><div class="alert ${e.corte ? 'alert-success' : 'alert-secondary'} small mb-0"><i class="fa-solid fa-scissors me-1"></i>${e.corte ? '<b>Corte hecho</b> el ' + esc(e.corte) + ': la app trabaja en el libro nuevo.' : '<b>Antes del corte</b>: la asistencia se guarda en el 2.0 y lo demás en el 1.0; el libro nuevo se actualiza solo.'}${e.pendiente ? ' · <span class="spinner-border spinner-border-sm"></span> actualización rápida en curso' : ''}</div></div>`;
        $('estado-ultima').textContent = e.ultimaActualizacion || 'Todavía no hay registro.';
        $('estado-respaldos').innerHTML = `<div class="mb-2"><b>Revisión de cambios del Excel:</b> ${esc(e.ultimaRevision || 'todavía no ha corrido')}</div>
          <div class="mb-1"><b>Respaldos</b> (${esc(e.respaldos.carpeta)})${e.respaldos.url ? ` · <a href="${esc(e.respaldos.url)}" target="_blank" rel="noopener">abrir carpeta</a>` : ''}:</div>
          <ul class="mb-2">${e.respaldos.ultimos.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.fecha)}</a> · ${esc(r.archivo)}</li>`).join('') || '<li class="text-muted">Ninguno aún (se crean con el primer cambio del día desde la app).</li>'}</ul>
          <div><b>La app se ejecuta como:</b> ${esc(e.ejecutaComo)} · <b>Versión:</b> ${esc(e.version)} (pantallas ${VERSION_HTML})</div>`;
        ejecutarDiagnostico();
      } catch (err) { error(err); } finally { leyendo(false); }
    }
    let diagEnCurso = false;
    async function ejecutarDiagnostico() {
      if (diagEnCurso) return;
      diagEnCurso = true;
      $('diag-lista').innerHTML = '<div class="text-muted small"><span class="spinner-border spinner-border-sm me-2"></span>Revisando archivos, columnas, cronograma, tarea y accesos…</div>';
      try {
        const d = await api('diagnosticoSistema', E.token);
        $('diag-fecha').textContent = 'Revisado: ' + d.fecha;
        $('diag-resumen').innerHTML = `<span class="badge bg-success me-1">${d.resumen.ok} bien</span><span class="badge bg-warning text-dark me-1">${d.resumen.aviso} avisos</span><span class="badge bg-danger">${d.resumen.error} errores</span>`;
        const ico = { ok: 'fa-circle-check text-success', aviso: 'fa-triangle-exclamation text-warning', error: 'fa-circle-xmark text-danger', info: 'fa-circle-info text-secondary' };
        const orden = { error: 0, aviso: 1, ok: 2, info: 3 };
        $('diag-lista').innerHTML = d.revisiones.slice().sort((a, b) => orden[a.estado] - orden[b.estado]).map(r => `<div class="rev rev-${r.estado}"><div class="d-flex gap-2"><i class="fa-solid ${ico[r.estado]} mt-1" aria-hidden="true"></i><div><div class="fw-semibold">${esc(r.titulo)}</div><div class="small">${esc(r.detalle)}</div>${r.solucion && r.estado !== 'ok' ? `<div class="small mt-1"><b>Qué hacer:</b> ${esc(r.solucion)}</div>` : ''}</div></div></div>`).join('');
      } catch (e) { $('diag-lista').innerHTML = ''; error(e); } finally { diagEnCurso = false; }
    }
    async function actualizarAhora() {
      if (!E.usuario) return pedirSesion(actualizarAhora);
      const pr = $('estado-progreso');
      pr.style.display = 'block'; pr.querySelector('span:last-child').textContent = 'Actualizando el libro nuevo y revisando cambios del Excel… puede tardar 1 a 3 minutos. No cierres la página.';
      try {
        const r = await api('actualizarAhora', E.token);
        pr.style.display = 'none';
        if (revisarSesion(r)) return;
        avisar(esc(r.mensaje), r.exito ? 'success' : 'warning', 9000);
        CAMBIOS = null; await cargarDatos(false); cargarEstado();
      } catch (e) { pr.style.display = 'none'; error(e); }
    }

    // ══════════ CONFIGURACIÓN ══════════
    async function cargarConfiguracion() {
      if (!E.usuario) { $('conf-sin-sesion').style.display = 'block'; $('conf-contenido').style.display = 'none'; return; }
      leyendo(true);
      try {
        conf = await api('getConfiguracion', E.token);
        $('conf-sin-sesion').style.display = 'none'; $('conf-contenido').style.display = 'block';
        const url = id => id ? 'https://docs.google.com/spreadsheets/d/' + id + '/edit' : '';
        const nombre = a => a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.nombre)}</a>` : `<span class="text-danger">${esc(a.error || 'Sin configurar')}</span>`;
        $('conf-origen').value = conf.origen.modo === 'ninguno' ? 'NINGUNO' : url(conf.origen.id); $('conf-origen-nombre').innerHTML = conf.origen.modo === 'ninguno' ? 'Sin 1.0' : nombre(conf.origen);
        $('conf-destino').value = url(conf.destino.id); $('conf-destino-nombre').innerHTML = nombre(conf.destino);
        $('conf-libro').value = url(conf.libro.id); $('conf-libro-nombre').innerHTML = conf.libro.id ? nombre(conf.libro) : 'Se crea desde el editor con libroNuevoCrear.';
        $('conf-corte').innerHTML = conf.corte ? '<i class="fa-solid fa-scissors me-1"></i>Corte hecho el ' + esc(conf.corte) + '. El 1.0 y el 2.0 ya no se usan.' : '<i class="fa-solid fa-scissors me-1"></i>Sin corte todavía. El corte se hace desde el editor con libroNuevoCorte.';
        $('conf-lectura').checked = !!conf.lecturaPublica;
        $('conf-horas').value = String(conf.automatica.cadaHoras || 1);
        $('conf-auto-estado').innerHTML = conf.automatica.activa ? `<span class="punto punto-ok"></span>Activa cada ${conf.automatica.cadaHoras} hora(s).` : '<span class="punto punto-aviso"></span>Apagada.';
        $('clave-usuario').value = conf.usuario;
        $('conf-carpeta').textContent = conf.carpetaRespaldos;
        $('conf-respaldos').innerHTML = conf.respaldos.length ? conf.respaldos.map(r => `<tr><td>${esc(r.fecha)}</td><td>${esc(r.archivo)}</td><td class="text-end"><a href="${esc(r.url)}" target="_blank" rel="noopener">Abrir</a></td></tr>`).join('') : '<tr><td colspan="3" class="text-muted">Todavía no hay respaldos.</td></tr>';
      } catch (e) { error(e); } finally { leyendo(false); }
    }
    async function guardarConf(datos, luego) {
      ocupado(true);
      try { const r = await api('guardarConfiguracion', E.token, datos); ocupado(false); if (revisarSesion(r)) return; avisar(esc(r.mensaje), r.exito ? 'success' : 'danger', 9000); if (r.exito && luego) await luego(); }
      catch (e) { error(e); }
    }
    function guardarArchivos() { guardarConf({ idOrigen: $('conf-origen').value, idDestino: $('conf-destino').value, idLibro: $('conf-libro').value }, async () => { temarios = null; hojas = null; CAMBIOS = null; await cargarDatos(true); cargarConfiguracion(); }); }
    function guardarLectura() { guardarConf({ lecturaPublica: $('conf-lectura').checked }, async () => { E.lecturaPublica = $('conf-lectura').checked; }); }
    async function cambiarAutomatico(activar) {
      ocupado(true);
      try { const r = await api('configurarAutomatico', E.token, activar, Number($('conf-horas').value)); ocupado(false); if (revisarSesion(r)) return; avisar(esc(r.mensaje), r.exito ? 'success' : 'danger', 9000); cargarConfiguracion(); }
      catch (e) { error(e); }
    }
    async function cambiarClaveApp(ev) {
      ev.preventDefault();
      if ($('clave-nueva').value !== $('clave-nueva2').value) return avisar('Las claves nuevas no coinciden.', 'warning');
      ocupado(true);
      try {
        const r = await api('cambiarClave', E.token, $('clave-actual').value, $('clave-usuario').value.trim(), $('clave-nueva').value);
        ocupado(false); if (revisarSesion(r)) return;
        avisar(esc(r.mensaje), r.exito ? 'success' : 'danger', 9000);
        if (r.exito) { $('form-clave').reset(); olvidarSesion(); pedirSesion(cargarConfiguracion); }
      } catch (e) { error(e); }
    }

    // ══════════ CONFIGURACIÓN INICIAL ══════════
    function pintarSetup(st) {
      const faltan = [];
      if (!st.destinoConfigurado) faltan.push('<b>Archivos</b>: falta la URL del 2.0 (SIGBE_ID_DESTINO).');
      else if (!st.destinoAccesible) faltan.push('<b>Archivos</b>: ' + esc(st.destinoError));
      if (!st.credenciales) faltan.push('<b>Usuario y clave</b>: no están configurados (SIGBE_USUARIO y SIGBE_CLAVE_INICIAL).');
      $('setup-faltantes').innerHTML = faltan.map(f => `<div class="alert alert-warning py-2 mb-2 small">${f}</div>`).join('');
      $('setup-cuenta').textContent = st.ejecutaComo || '';
      const puede = st.esPropietario && !st.credenciales;
      $('setup-no-propietario').style.display = puede ? 'none' : 'block';
      $('form-setup').style.display = puede ? 'block' : 'none';
    }
    async function enviarSetup(ev) {
      ev.preventDefault();
      if ($('setup-clave').value !== $('setup-clave2').value) return avisar('Las claves no coinciden.', 'warning');
      ocupado(true);
      try {
        const r = await api('configuracionInicial', { idDestino: $('setup-destino').value, idOrigen: $('setup-origen').value, usuario: $('setup-usuario').value, clave: $('setup-clave').value });
        ocupado(false);
        avisar(esc(r.mensaje), r.exito ? 'success' : 'danger', 9000);
        if (r.exito) await arrancar();
      } catch (e) { error(e); }
    }
    // Arranque (al final, cuando ya existe todo lo de arriba)
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
