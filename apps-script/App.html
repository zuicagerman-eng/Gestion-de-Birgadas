// SIGBE · código de las pantallas. NO lleva etiquetas <script>: el servidor (doGet en SIGBE.gs) lo manda
// codificado dentro de Index.html para que nada en el camino lo altere, y el navegador lo decodifica y lo ejecuta.
    // ══════════ ESTADO ══════════
    const VERSION_HTML = '4.6.0'; // debe coincidir con SIGBE_VERSION en SIGBE.gs
    const E = { vista: 'inicio', token: leer('sessionStorage', 'sigbe_token'), usuario: null, sedes: sedesGuardadas(), listo: false, lecturaPublica: false, setup: null };
    // Varias sedes a la vez: E.sedes vacío = todas. E.sede es la sede única (o '' si hay 0 o varias), para tomar asistencia.
    Object.defineProperty(E, 'sede', { get: () => E.sedes.length === 1 ? E.sedes[0] : '' });
    function sedesGuardadas() {
      const t = leer('localStorage', 'sigbe_sede') || '';
      try { const a = JSON.parse(t); if (Array.isArray(a)) return a.map(String); } catch (e) { /* formato viejo: una sola sede */ }
      return t ? [t] : [];
    }
    function sedeOk(s) { return !E.sedes.length || E.sedes.indexOf(s) !== -1; }
    function sufijoSede() { return E.sedes.length ? '_' + E.sedes.join('_') : ''; }
    function textoSedes() { return !E.sedes.length ? 'Todas las sedes' : E.sedes.length <= 2 ? E.sedes.join(', ') : E.sedes.length + ' sedes'; }
    /** Ambipar (proveedor): toma asistencia y diligencia la Fecha Ambipar; no hace cambios de estructura ni de brigadistas. */
    /** Al entrar, la app muestra las sedes del usuario (si tiene); luego se puede cambiar el filtro. */
    function sedesDelUsuario() {
      const s = E.perfil && E.perfil.sedes;
      if (s && s.length) { E.sedes = s.slice(); guardar('localStorage', 'sigbe_sede', JSON.stringify(E.sedes)); }
    }
    function esProveedor() { return !!(E.perfil && E.perfil.rol === 'proveedor'); }
    /** true (y avisa) si el usuario es Ambipar y la acción es solo de Holcim. */
    function soloHolcim() { if (!esProveedor()) return false; avisar('Esto lo hace un usuario de Holcim. Con tu usuario de Ambipar puedes tomar asistencia y diligenciar la Fecha Ambipar en el Cronograma.', 'info', 8000); return true; }
    let D = null, P = [], I = [], REV = null, CAMBIOS = null, catalogos = null, temarios = null, hojas = null, conf = null;
    const asis = { paso: 'sesiones', key: null, cambios: {}, buscar: '', planta: '', inactivos: false, filtro: '' };
    const brig = { tipo: '', orden: 'p', dir: 1, visibles: [], editar: false, cambios: {} };
    const crono = { cuando: 'proximas' };
    const rev = { g: '', tipo: '' };
    const cam = { o: '', limite: 200, visibles: [] };
    const hoja = { datos: null, visibles: [] };
    const $ = id => document.getElementById(id);
    const modal = id => bootstrap.Modal.getOrCreateInstance($(id));
    const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const MESES_L = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    // ══════════ UTILIDADES ══════════
    function leer(t, k) { try { return window[t].getItem(k); } catch (e) { return null; } }
    function guardar(t, k, v) { try { v ? window[t].setItem(k, v) : window[t].removeItem(k); } catch (e) {} }
    function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase(); }
    function unicos(a) { return a.filter((x, i) => x && a.indexOf(x) === i).sort((x, y) => String(x).localeCompare(String(y), 'es')); }
    function isoDe(t) { const m = String(t || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
    function diasEntre(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
    function api(nombre, ...args) { return new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[nombre](...args)); }
    function ocupado(si) { $('cubierta').style.display = si ? 'flex' : 'none'; }
    let lecturas = 0;
    function leyendo(si) { lecturas += si ? 1 : -1; $('barra-lectura').classList.toggle('activa', lecturas > 0); if (lecturas <= 0) { lecturas = 0; $('barra-lectura').style.width = '100%'; setTimeout(() => { $('barra-lectura').style.width = ''; }, 300); } }
    function avisar(html, tipo, ms, accion) {
      const el = document.createElement('div');
      el.className = 'alert alert-' + (tipo || 'success') + ' shadow d-flex align-items-start gap-2';
      el.setAttribute('role', tipo === 'danger' ? 'alert' : 'status');
      el.innerHTML = '<div class="flex-grow-1">' + html + '</div>' + (accion ? '<button class="btn btn-sm btn-dark">' + esc(accion.texto) + '</button>' : '') + '<button class="btn-close" aria-label="Cerrar aviso"></button>';
      el.querySelector('.btn-close').onclick = () => el.remove();
      if (accion) el.querySelector('.btn-dark').onclick = () => { el.remove(); accion.fn(); };
      $('avisos').appendChild(el);
      setTimeout(() => el.remove(), ms || 6000);
    }
    function error(e) {
      ocupado(false);
      const msg = e && e.message ? e.message : String(e);
      if (/SESION_REQUERIDA/.test(msg)) { olvidarSesion(); D = null; mostrarIngreso(); return; }
      avisar('<b>No se pudo completar.</b> ' + esc(msg.replace(/^Error:\s*/, '')), 'danger', 30000);
    }
    function revisarSesion(r) {
      if (r && !r.exito && /sesión no es válida/i.test(r.mensaje || '')) { olvidarSesion(); avisar('Tu sesión expiró. Inicia sesión otra vez.', 'warning'); pedirSesion(); return true; }
      return false;
    }
    function descargarCsv(nombre, filas) {
      const csv = filas.map(f => f.map(v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    }
    function chipFecha(iso, texto) {
      if (!iso) return `<div class="fecha-chip gris"><div class="mes">${esc(texto || 'por definir')}</div></div>`;
      const [a, m, d] = iso.split('-');
      return `<div class="fecha-chip"><div class="dia">${+d}</div><div class="mes">${MESES[+m - 1]} ${a.slice(2)}</div></div>`;
    }
    function badgeEstadoCrono(e) {
      if (!e) return '';
      const n = e.toLowerCase();
      return `<span class="badge ${n.includes('programada') ? 'bg-success-subtle text-success-emphasis' : n.includes('pendiente') ? 'bg-warning-subtle text-warning-emphasis' : n.includes('realiz') || n.includes('ejecut') ? 'bg-primary-subtle text-primary-emphasis' : 'bg-secondary-subtle text-secondary-emphasis'}">${esc(e)}</span>`;
    }
    function opciones(lista, actual, todos) { return (todos ? `<option value="">${esc(todos)}</option>` : '') + lista.map(x => `<option value="${esc(x)}" ${x === actual ? 'selected' : ''}>${esc(x)}</option>`).join(''); }
    function enSede(x) { return sedeOk(x.sede); }
    function tieneCert(c) { return /^\d+$/.test(String(c || '')); }
    function pctBarra(pct, color) { return `<div class="barrita" role="img" aria-label="${pct} %"><div style="width:${Math.max(0, Math.min(pct, 100))}%;background:${color}"></div></div>`; }

    // ══════════ ARRANQUE ══════════
    async function iniciar() {
      window.__sigbeArranco = true;
      document.querySelectorAll('#nav .nav-link').forEach(a => a.onclick = ev => { ev.preventDefault(); ir(a.dataset.vista); });
      document.body.addEventListener('click', clicGeneral);
      $('sede-menu').addEventListener('change', ev => {
        const marcadas = [...document.querySelectorAll('#sede-menu input[data-sede]:checked')].map(x => x.dataset.sede);
        if (marcadas.length) cambiarSede(marcadas.length === D.sedes.length ? [] : marcadas);
      });
      $('sel-sede').addEventListener('hidden.bs.dropdown', () => pintarSelectorSede()); // si quedó todo desmarcado, vuelve a lo aplicado
      $('btn-sesion').onclick = () => E.usuario ? cerrarSesion() : pedirSesion();
      $('form-login').onsubmit = iniciarSesion;
      $('form-registro').onsubmit = revisarRegistro;
      $('form-setup').onsubmit = enviarSetup;
      $('form-clave').onsubmit = cambiarClaveApp;
      $('form-crono').onsubmit = revisarCrono;
      grupoChips('cob-orden', 'orden', () => pintarCobertura());
      $('inicio-tabs').addEventListener('click', ev => { const b = ev.target.closest('.pestana'); if (b) elegirPestana(b.dataset.tab); });
      $('inicio-tabs').addEventListener('keydown', ev => {
        const ts = [...document.querySelectorAll('#inicio-tabs .pestana')], i = ts.indexOf(document.activeElement);
        if (i === -1 || ['ArrowRight', 'ArrowLeft', 'Home', 'End'].indexOf(ev.key) === -1) return;
        ev.preventDefault();
        const n = ev.key === 'Home' ? 0 : ev.key === 'End' ? ts.length - 1 : (i + (ev.key === 'ArrowRight' ? 1 : -1) + ts.length) % ts.length;
        elegirPestana(ts[n].dataset.tab, true);
      });
      elegirPestana(leer('localStorage', 'sigbe_tab_inicio') || 'asistencia');
      $('cob-faltan').onchange = pintarCobertura;
      $('modal-faltantes').addEventListener('change', cambioFaltantes);
      $('falt-buscar').oninput = pintarFaltantes; $('falt-sede').onchange = pintarFaltantes; $('falt-desv').onchange = pintarFaltantes;
      $('form-ingreso').onsubmit = enviarIngreso;
      $('ing-buscar').oninput = pintarIngresos;
      grupoChips('ing-tipo', 'tipo', v => { ingr.tipo = v; pintarIngresos(); });
      $('cr-na').onchange = () => { $('cr-fecha').disabled = $('cr-na').checked; };
      $('form-modulo').onsubmit = revisarModulo;
      $('form-sesion').onsubmit = revisarSesion2;
      $('ses-fila').onchange = ajustarSesion; $('ses-pl').onchange = ajustarSesion;
      $('form-modulo').addEventListener('input', ajustarModulo);
      $('form-modulo').addEventListener('change', ajustarModulo);
      $('form-usuario').onsubmit = nuevoUsuario;
      $('reg-cedula').oninput = avisarCedulaRepetida;
      document.querySelectorAll('input[name="reg-tipo"]').forEach(r => r.onchange = ajustarRegistro);
      ['brig-buscar', 'brig-planta', 'brig-estado', 'brig-empresa', 'brig-datos'].forEach(id => $(id).oninput = pintarBrigadistas);
      $('brig-tabla').addEventListener('change', cambioEnTabla);
      $('brig-tabla').addEventListener('input', cambioEnTabla);
      ['mat-buscar', 'mat-planta', 'mat-estado', 'mat-ver'].forEach(id => $(id).oninput = pintarMatriz);
      ['crono-buscar', 'crono-mes', 'crono-modulo', 'crono-estado'].forEach(id => $(id).oninput = pintarCronograma);
      ['rev-buscar'].forEach(id => $(id).oninput = pintarRevision);
      ['cam-buscar', 'cam-hoja', 'cam-desde', 'cam-hasta'].forEach(id => $(id).oninput = () => { cam.limite = 200; pintarCambios(); });
      ['hoja-buscar', 'hoja-val'].forEach(id => $(id).oninput = pintarHoja);
      $('hoja-col').oninput = () => { llenarValoresHoja(); pintarHoja(); };
      $('hoja-sel').oninput = cargarHoja;
      $('tem-hoja').oninput = cargarTemario;
      $('tem-buscar').oninput = filtrarTemario;
      grupoChips('brig-tipo', 'tipo', v => { brig.tipo = v; pintarBrigadistas(); });
      grupoChips('crono-cuando', 'cuando', v => { crono.cuando = v; pintarCronograma(); });
      grupoChips('rev-grav', 'g', v => { rev.g = v; pintarRevision(); });
      grupoChips('cam-origen', 'o', v => { cam.o = v; cam.limite = 200; pintarCambios(); });
      document.querySelectorAll('#brig-cab th.ordenable').forEach(th => { th.tabIndex = 0; th.onclick = th.onkeydown = ev => { if (ev.type === 'keydown' && ev.key !== 'Enter') return; const k = th.dataset.orden; brig.dir = brig.orden === k ? -brig.dir : 1; brig.orden = k; pintarBrigadistas(); }; });
      window.addEventListener('beforeunload', ev => { if (hayCambios()) { ev.preventDefault(); ev.returnValue = ''; } });
      await arrancar();
    }

    /** Pestañas del Dashboard (se recuerda la última abierta en este equipo). */
    function elegirPestana(tab, foco) {
      if (!$('tab-' + tab)) tab = 'asistencia';
      document.querySelectorAll('#inicio-tabs .pestana').forEach(b => { const si = b.dataset.tab === tab; b.setAttribute('aria-selected', String(si)); b.tabIndex = si ? 0 : -1; if (si && foco) b.focus(); });
      document.querySelectorAll('.panel-inicio').forEach(p => { p.hidden = p.id !== 'tab-' + tab; });
      guardar('localStorage', 'sigbe_tab_inicio', tab);
    }
    function grupoChips(id, attr, fn) {
      $(id).addEventListener('click', ev => {
        const b = ev.target.closest('.chip'); if (!b) return;
        $(id).querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        fn(b.dataset[attr]);
      });
    }

    /** Mensajes del arranque: se quedan en pantalla (no desaparecen como los avisos). */
    let relojArranque = null;
    function pasoArranque(texto) {
      $('arranque').style.display = 'block'; $('arranque').className = 'tarjeta p-4 mb-3';
      $('arranque-spin').style.display = ''; $('arranque-txt').innerHTML = esc(texto);
      clearTimeout(relojArranque);
      relojArranque = setTimeout(() => { $('arranque-txt').innerHTML = esc(texto) + '<div class="small text-muted mt-2">Está tardando más de lo normal. La primera lectura después de un cambio puede tomar hasta un minuto; si pasan más de dos, recarga la página.</div>'; }, 45000);
    }
    function finArranque() { clearTimeout(relojArranque); $('arranque').style.display = 'none'; }
    function errorArranque(msg) {
      clearTimeout(relojArranque);
      $('arranque').style.display = 'block'; $('arranque').className = 'alert alert-danger mb-3';
      $('arranque-spin').style.display = 'none';
      $('arranque-txt').innerHTML = '<b>La app no pudo cargar los datos.</b><div class="mt-1">' + esc(String(msg).replace(/^Error:\s*/, '')) + '</div>' +
        '<div class="small mt-2">Si el mensaje no es claro: en el editor de Apps Script ejecuta <b>probarApp</b> y revisa el registro de ejecución.</div>' +
        '<button class="btn btn-sm btn-outline-danger mt-2" data-accion="reintentar"><i class="fa-solid fa-rotate me-1"></i>Reintentar</button>';
    }
    window.addEventListener('error', ev => { if (!D) errorArranque('Error en la pantalla: ' + ev.message); });
    window.addEventListener('unhandledrejection', ev => { if (!D) errorArranque('Error en la pantalla: ' + (ev.reason && ev.reason.message || ev.reason)); });

    async function arrancar() {
      leyendo(true);
      pasoArranque('Conectando con el servidor…');
      try {
        const ctx = await api('getContexto', E.token);
        E.usuario = ctx.usuario; E.perfil = ctx.perfil || null; E.lecturaPublica = !!ctx.lecturaPublica; E.listo = !!(ctx.setup && ctx.setup.listo); E.setup = ctx.setup;
        $('txt-version').textContent = 'SIGBE v' + (ctx.version || '?');
        $('ayuda-version').textContent = 'v' + (ctx.version || '?');
        if (ctx.version && ctx.version !== VERSION_HTML) banner('Los archivos de la app tienen versiones distintas (pantallas ' + esc(VERSION_HTML) + ', servidor ' + esc(ctx.version) + '). Vuelve a pegar <b>SIGBE.gs</b>, <b>Index.html</b> y <b>App.html</b> y publica una nueva versión.');
        if (!E.usuario) olvidarSesion(true);
        pintarSesion();
        if (!E.listo) { finArranque(); pintarSetup(ctx.setup); mostrar('setup'); return; }
        if (!E.usuario) { finArranque(); bloqueo(false); mostrarIngreso(); return; }
        bloqueo(false); document.body.classList.remove('modo-ingreso');
        if (E.vista === 'ingreso') E.vista = 'inicio';
        pasoArranque('Leyendo las hojas de cálculo… (la primera vez puede tardar hasta un minuto)');
        D = await api('getDatos', E.token, false);
        preparar();
        window.__sigbeDatos = true;
        finArranque();
        ir(E.vista === 'setup' ? 'inicio' : E.vista);
      } catch (e) {
        if (/SESION_REQUERIDA/.test(e && e.message || '')) { finArranque(); olvidarSesion(true); mostrarIngreso(); } else errorArranque(e && e.message ? e.message : e);
      } finally { leyendo(false); }
    }

    async function cargarDatos(forzar) {
      leyendo(true);
      try {
        D = await api('getDatos', E.token, !!forzar);
        preparar();
        if (forzar) avisar('Datos leídos de nuevo de las hojas.', 'info', 3000);
      } catch (e) { error(e); } finally { leyendo(false); }
    }

    /** Prepara los datos para filtrar rápido en el navegador. */
    function preparar() {
      D.sesiones.forEach((s, i) => { s.i = i; });
      // Las sesiones "no aplica" solo se ven (y se habilitan) en el Cronograma; el resto de pantallas usa D.crono
      D.cronoTodo = D.cronoTodo || D.crono;
      D.cronoTodo.forEach((c, k) => { c.k = k; });
      D.crono = D.cronoTodo.filter(c => !c.na);
      D.cronoFilas = D.cronoFilas || [];
      D.unidades = [];
      D.sesiones.forEach(s => { let u = D.unidades.find(x => x.clave === s.clave); if (!u) D.unidades.push(u = { clave: s.clave, modulo: s.modulo, parte: s.parte, titulo: s.titulo, ses: [] }); u.ses.push(s.i); });
      P = D.holcim.map((p, j) => { const o = Object.assign({}, p, { j: j, tipo: 'HOLCIM', sede: (D.plantas[p.p] || {}).sede || p.p, activo: !/desvinculado/i.test(p.e), emp: 'Holcim' }); o.cump = cumplimiento(o); return o; });
      I = D.inhouse.map((p, j) => Object.assign({}, p, { j: j, tipo: 'INHOUSE', activo: !/desvinculado/i.test(p.e), emp: p.k || 'Contratista', cump: { c: 0, t: 0, pct: null } }));
      REV = null;
      E.sedes = E.sedes.filter(s => D.sedes.indexOf(s) !== -1);
      pintarSelectorSede();
      const avisos = (D.avisos || []).concat(D.fuentes.soloLectura && (D.fuentes.soloLectura.asistencia || D.fuentes.soloLectura.datos) ? ['Modo solo lectura en parte de los datos (ver Estado del sistema).'] : []);
      if (avisos.length) banner('<i class="fa-solid fa-triangle-exclamation me-1"></i>' + avisos.map(esc).join(' · ')); else if (!/versiones distintas/.test($('banner').innerHTML)) $('banner').style.display = 'none';
      pintarFrescura();
      const rv = revision();
      const n = rv.filter(r => r.g !== 'info').length;
      $('badge-revision').textContent = n || '';
    }
    function banner(html) { $('banner').innerHTML = html; $('banner').style.display = 'block'; }
    function pintarFrescura() {
      if (!D) { $('frescura').innerHTML = ''; return; }
      const fuente = D.fuentes.corte ? 'libro nuevo' : '1.0 y 2.0';
      $('lateral-datos').innerHTML = `<i class="fa-solid fa-rotate me-1"></i>Datos leídos: ${esc(D.generado.slice(8, 10) + '/' + D.generado.slice(5, 7) + ' ' + D.generado.slice(11))}<br>${D.fuentes.corte ? 'Libro nuevo' : 'Asistencia: 2.0 · Resto: 1.0'}`;
      $('frescura').innerHTML = `<span title="Archivos de origen: ${esc(D.fuentes.asistencia.nombre)} / ${esc(D.fuentes.datos.nombre)}"><i class="fa-regular fa-clock me-1"></i>Datos de las ${esc(D.generado.slice(11))} · ${fuente}</span>
        <button class="btn btn-sm btn-link p-0" data-accion="refrescar" title="Leer de nuevo las hojas" aria-label="Leer de nuevo las hojas"><i class="fa-solid fa-rotate"></i></button>`;
    }

    // ══════════ NAVEGACIÓN ══════════
    function mostrar(vista) {
      document.querySelectorAll('.vista').forEach(v => v.style.display = 'none');
      $('v-' + vista).style.display = 'block';
      document.querySelectorAll('#nav .nav-link').forEach(a => { const s = a.dataset.vista === vista; a.classList.toggle('active', s); s ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
    }
    function ir(vista) {
      if (!E.listo && vista !== 'setup' && vista !== 'ayuda') vista = 'setup';
      if (E.vista === 'asistencia' && vista !== 'asistencia' && hayCambios() && !confirm('Tienes cambios de asistencia sin guardar. ¿Salir y descartarlos?')) return;
      if (vista !== 'asistencia') asis.cambios = {};
      if (E.vista === 'brigadistas' && vista !== 'brigadistas' && Object.keys(brig.cambios).length && !confirm('Tienes cambios sin guardar en la tabla de brigadistas. ¿Salir y descartarlos?')) return;
      if (vista !== 'brigadistas') { brig.cambios = {}; brig.editar = false; }
      E.vista = vista;
      mostrar(vista);
      const off = bootstrap.Offcanvas.getInstance($('menu')); if (off) off.hide();
      window.scrollTo(0, 0);
      cargarVista();
    }
    function cargarVista() {
      if (!D && ['setup', 'ayuda', 'configuracion', 'estado', 'ingresos'].indexOf(E.vista) === -1) return;
      ({ inicio: pintarInicio, asistencia: pintarAsistencia, matriz: prepararMatriz, brigadistas: prepararBrigadistas, cronograma: prepararCronograma,
         cobertura: pintarCobertura, revision: prepararRevision, cambios: cargarCambios, temarios: cargarTemarios, hojas: cargarHojas,
         estado: cargarEstado, configuracion: cargarConfiguracion, ingresos: cargarIngresos, ingreso: () => {}, setup: () => {}, ayuda: () => {} })[E.vista]();
    }
    /** Selector de sedes (varias a la vez) arriba. */
    function pintarSelectorSede() {
      const foco = document.activeElement && document.activeElement.closest('#sede-menu') ? document.activeElement.dataset.sede : null;
      $('sel-sede').textContent = textoSedes();
      $('sel-sede').classList.toggle('sede-filtrada', E.sedes.length > 0);
      $('sede-menu').innerHTML = `<div class="d-flex gap-2 px-2 pb-2 mb-1 border-bottom"><button type="button" class="btn btn-sm btn-link p-0" data-accion="sedes-todas">Todas</button><span class="text-muted">·</span><button type="button" class="btn btn-sm btn-link p-0" data-accion="sedes-ninguna">Ninguna</button></div>` +

    // ══════════ LÓGICA DE SESIONES (igual que el libro nuevo) ══════════
    /** Estado de la sesión i para la persona p: si = asistió, no = ya pasó sin asistir, pend = pendiente, na = no aplica, sina = marcada sin aplicar. */
    function ses(p, i) {
      const pl = D.plantas[p.p], s = pl ? pl.s[i] : { a: 1, f: '', i: '', o: '' };
      const x = p.x && p.x[i];
      let aplica = !!s.a, f = s.f, iso = s.i, nota = '';
      if (x) {
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(x)) { if (s.o !== 'cronograma') { f = x; iso = isoDe(x); } }
        else { nota = x; if (/no hac[ií]a parte|no aplica/i.test(x)) aplica = false; }
      }
      const marcada = p.m.charAt(i) === '1';
      const est = marcada ? (aplica ? 'si' : 'sina') : !aplica ? 'na' : iso && iso <= D.hoy ? 'no' : 'pend';
      return { aplica: aplica, f: f, iso: iso, marcada: marcada, est: est, nota: nota, mo: s.mo, e: s.e, o: s.o, xFecha: x && /^\d{2}\//.test(x) ? x : '' };
    }
    /** Módulos asistidos / módulos que aplican y ya pasaron (con 2 sesiones basta una). */
    function cumplimiento(p) {
      let c = 0, t = 0;
      D.unidades.forEach(u => {
        let hecho = false, debido = false;
        u.ses.forEach(i => { const s = ses(p, i); if (s.est === 'si') { hecho = true; debido = true; } else if (s.est === 'no') debido = true; });
        if (hecho) c++; if (debido) t++;
      });
      return { c: c, t: t, pct: t ? Math.round(c / t * 100) : null };
    }
    function estadoUnidad(p, u) {
      const ss = u.ses.map(i => Object.assign({ i: i }, ses(p, i)));
      if (ss.some(s => s.est === 'si')) return { est: 'si', ss: ss };
      if (ss.some(s => s.est === 'sina')) return { est: 'sina', ss: ss };
      if (ss.every(s => s.est === 'na')) return { est: 'na', ss: ss };
      return { est: ss.some(s => s.est === 'no') ? 'no' : 'pend', ss: ss }; // igual que el % de cumplimiento
    }
    function nombreSesion(s) { return s.clave + ' · Sesión ' + s.n; }
    function pildoraCump(c) {
      if (c.pct === null) return '<span class="text-muted small">—</span>';
      const color = c.pct >= 100 ? 'var(--s-ok)' : c.pct >= 50 ? '#f59f00' : 'var(--s-mal)';
      return `<div style="min-width:110px"><div class="small fw-semibold">${c.pct} % <span class="text-muted fw-normal">(${c.c}/${c.t})</span></div>${pctBarra(c.pct, color)}</div>`;
    }

    // ══════════ INICIO ══════════
    /** Barra de una sede (verde ≥ 80 %, ámbar ≥ 40 %, roja debajo). accion: qué hace el clic. */
    function barraSede(sede, pct, txt, accion) {
      const color = pct >= 80 ? 'var(--s-ok)' : pct >= 40 ? '#f59f00' : 'var(--s-mal)';
      return `<div class="fila-sede d-flex align-items-center gap-2" ${accion ? `data-accion="${accion}" data-sede="${esc(sede)}" title="Ver solo ${esc(sede)}"` : ''}><div style="width:120px" class="fw-semibold text-truncate">${esc(sede)}</div><div class="flex-grow-1">${pctBarra(Math.min(pct, 100), color)}</div><div style="width:190px" class="text-end text-muted">${txt}</div></div>`;
    }
    /** Plantas de la pestaña Indicador. con su cobertura (la misma cuenta en el Dashboard y en Cobertura). */
    function plantasCobertura() {
      const enteros = x => Math.ceil(Math.round(x * 10) / 10);
      const plantas = [];
      D.indicador.filter(enSede).forEach(f => { let pl = plantas.find(x => x.p === f.p); if (!pl) plantas.push(pl = { p: f.p, sede: f.sede, tot: null, emp: [] }); if (f.tot) pl.tot = f; else pl.emp.push(f); });
      plantas.forEach(pl => {
        const sum = k => pl.emp.reduce((n, f) => n + (f[k] || 0), 0);
        pl.per = pl.tot ? pl.tot.per : sum('per'); pl.bri = sum('lis'); // brigadistas: los de las listas de la app
        pl.metaN = enteros(pl.tot ? pl.tot.meta : sum('meta')); // 20 % de la planta, hacia arriba
        pl.faltan = Math.max(0, pl.metaN - pl.bri);
        pl.pct = pl.metaN ? Math.round(pl.bri / pl.metaN * 100) : 100;
        pl.pctPer = pl.per ? Math.round(pl.bri / pl.per * 1000) / 10 : 0;
        pl.empresas = pl.emp.filter(f => f.per > 0 || f.lis > 0).map(f => { const m = enteros(f.meta); return Object.assign({}, f, { bri: f.lis || 0, metaN: m, faltan: Math.max(0, m - (f.lis || 0)), pct: m ? Math.round((f.lis || 0) / m * 100) : 100 }); });
      });
      return plantas;
    }
    /** Las mismas plantas sumadas por sede. */
    function coberturaSedes() {
      const out = {};
      plantasCobertura().forEach(pl => { const x = out[pl.sede] = out[pl.sede] || { sd: pl.sede, per: 0, bri: 0, metaN: 0 }; x.per += pl.per; x.bri += pl.bri; x.metaN += pl.metaN; });
      return Object.keys(out).map(k => Object.assign(out[k], { pct: out[k].metaN ? Math.round(out[k].bri / out[k].metaN * 100) : 100 })).sort((a, b) => a.pct - b.pct);
    }
    function resumenCobertura(lista) {
      const per = lista.reduce((n, x) => n + x.per, 0), bri = lista.reduce((n, x) => n + x.bri, 0), meta = lista.reduce((n, x) => n + x.metaN, 0);
      const cumplen = lista.filter(x => x.bri >= x.metaN).length;
      return `En total: <b class="text-body">${bri}</b> brigadistas de <b class="text-body">${meta}</b> requeridos (${meta ? Math.round(bri / meta * 100) : 0} %) · ${per} personas · <b class="text-body">${cumplen} de ${lista.length}</b> sedes cumplen la meta.`;
    }

    function pintarInicio() {
      $('inicio-sub').textContent = E.sedes.length ? (E.sedes.length === 1 ? 'Sede ' : 'Sedes ') + E.sedes.join(', ') : 'Todas las sedes · haz clic en una sede de las barras o elige una o varias arriba';
      // 1) Asistencia a las capacitaciones (personal Holcim; solo módulos que aplican y cuya fecha ya pasó)
      const h = P.filter(p => enSede(p) && p.activo), ih = I.filter(p => enSede(p) && p.activo);
      const conCert = ih.filter(p => tieneCert(p.ce)).length;

      const alDia = cumps.filter(x => x.c >= x.t).length, ninguna = cumps.filter(x => x.c === 0).length;
      const kpi = (ico, color, eti, num, sub, barra) => `<div class="col-sm-6"><div class="kpi"><i class="fa-solid ${ico} ico" style="color:${color}"></i><div class="eti">${eti}</div><div class="num" style="color:${color}">${num}</div><div class="small text-muted">${sub}</div>${barra === undefined ? '' : pctBarra(barra, color)}</div></div>`;
      const colorPct = x => x >= 80 ? 'var(--s-ok)' : x >= 40 ? '#e8590c' : 'var(--s-mal)';
      $('inicio-kpis').innerHTML =
        kpi('fa-list-check', colorPct(pct), 'Asistencia a módulos ya dictados', t ? pct + ' %' : '—',
          t ? `<b>${c}</b> de <b>${t}</b> asistencias esperadas: cada brigadista Holcim activo por cada módulo que ya se dictó en su planta.` : 'Todavía no hay módulos con fecha pasada.', t ? pct : undefined) +
        kpi('fa-user-check', colorPct(cumps.length ? alDia / cumps.length * 100 : 0), 'Brigadistas Holcim al día', `${alDia} de ${cumps.length}`,
          `asistieron a todos los módulos ya dictados${ninguna ? ` · <b>${ninguna}</b> no tienen ninguna asistencia` : ''}.`) +
        kpi('fa-users', 'var(--s-azul)', 'Brigadistas Holcim activos', h.length, `son los que toman asistencia por módulo en la lista${h.length - cumps.length ? ` (${h.length - cumps.length} aún sin módulos dictados)` : ''}.`) +
        kpi('fa-certificate', '#7b2cbf', 'Contratistas con certificado 0256', ih.length ? Math.round(conCert / ih.length * 100) + ' %' : '—', `<b>${conCert}</b> de <b>${ih.length}</b> contratistas activos tienen el certificado.`, ih.length ? conCert / ih.length * 100 : undefined);
      const sedes = unicos(P.map(p => p.sede)).filter(sedeOk);
      $('inicio-por-sede').innerHTML = sedes.map(sd => {
        const cs = P.filter(p => p.sede === sd && p.activo).map(p => p.cump).filter(x => x.t);
        const a = cs.reduce((n, x) => n + x.c, 0), b = cs.reduce((n, x) => n + x.t, 0);
        return { sd, pct: b ? Math.round(a / b * 100) : 0, txt: b ? `${Math.round(a / b * 100)} % · ${a} de ${b} asistencias` : 'sin módulos dictados' };
      }).sort((x, y) => x.pct - y.pct).map(x => barraSede(x.sd, x.pct, x.txt, 'elegir-sede')).join('') || '<p class="text-muted mb-0">Sin datos.</p>';
      // 2) Cobertura de brigadistas: la misma vista de la pantalla Cobertura
      pintarCobertura('inicio-cob');
      const nivel = x => x >= 80 ? 'bien' : x >= 40 ? 'medio' : 'mal';
      const pc = plantasCobertura(), briT = pc.reduce((n, x) => n + x.bri, 0), metaT = pc.reduce((n, x) => n + x.metaN, 0), pctCob = metaT ? Math.round(briT / metaT * 100) : 0;
      $('tv-asistencia').textContent = t ? pct + ' %' : ''; $('tv-asistencia').className = 'valor ' + (t ? nivel(pct) : '');
      $('tv-cobertura').textContent = metaT ? pctCob + ' %' : ''; $('tv-cobertura').className = 'valor ' + (metaT ? nivel(pctCob) : '');
      // 3) Próximas capacitaciones y revisión de datos
      const proxTodas = D.crono.filter(c => enSede(c) && c.i && c.i >= D.hoy), prox = proxTodas.slice().sort((a, b) => a.i < b.i ? -1 : 1).slice(0, 10);

        : '<p class="text-muted small mb-0">No hay capacitaciones programadas próximamente.</p>';
      const rv = revision().filter(r => enSede(r) || !r.sede);
      const grupos = {};
      rv.forEach(r => { if (r.g === 'info') return; grupos[r.tipo] = grupos[r.tipo] || { n: 0, g: r.g, t: r.titulo }; grupos[r.tipo].n++; });
      const lista = Object.keys(grupos).sort((a, b) => (grupos[a].g === 'error' ? 0 : 1) - (grupos[b].g === 'error' ? 0 : 1) || grupos[b].n - grupos[a].n);
      const nRev = lista.reduce((n, k) => n + grupos[k].n, 0), hayErr = lista.some(k => grupos[k].g === 'error');

      $('inicio-revision').innerHTML = lista.length ? lista.map(k => `<div class="d-flex justify-content-between py-1 border-bottom"><span><span class="punto punto-${grupos[k].g}"></span>${esc(grupos[k].t)}</span><b>${grupos[k].n}</b></div>`).join('')
        : '<p class="text-success mb-0"><i class="fa-solid fa-check me-1"></i>Sin errores ni avisos.</p>';
    }

    /** Sesiones de la sede (por planta) que ya pasaron, aplican y no tienen ninguna asistencia. */
    function sesionesSinRegistro() {
      const out = [];
      const sedes = unicos(P.map(p => p.sede)).filter(sedeOk);
      sedes.forEach(sede => sesionesSede(sede).forEach(x => { if (x.aplica && x.iso && x.iso < D.hoy && !x.marcadas && x.total) out.push(Object.assign({ sede: sede }, x)); }));
      return out.sort((a, b) => a.iso < b.iso ? 1 : -1);

    // ══════════ TOMAR ASISTENCIA ══════════
    function hayCambios() { return Object.keys(asis.cambios).length > 0; }
    function personasSede(sede) { return P.filter(p => p.sede === sede); }
    function sesionesSede(sede) {
      const pers = personasSede(sede).filter(p => p.activo);
      return D.sesiones.map(s => {
        const con = pers.filter(p => ses(p, s.i).aplica);
        const plantas = unicos(pers.map(p => p.p));
        const info = plantas.map(pl => ({ pl: pl, x: D.plantas[pl].s[s.i] }));
        const fechas = unicos(con.map(p => ses(p, s.i).f).filter(Boolean));
        const isos = con.map(p => ses(p, s.i).iso).filter(Boolean).sort();

    // ══════════ CRONOGRAMA ══════════
    function prepararCronograma() {
      const base = D.cronoTodo.filter(c => enSede(c) && !c.na);
      const meses = unicos(base.map(c => c.i ? c.i.slice(0, 7) : '')).sort();
      const mesAct = $('crono-mes').value, modAct = $('crono-modulo').value, estAct = $('crono-estado').value;
      $('crono-mes').innerHTML = '<option value="">Todos los meses</option>' + meses.map(m => `<option value="${m}" ${m === mesAct ? 'selected' : ''}>${MESES_L[+m.slice(5) - 1]} ${m.slice(0, 4)}</option>`).join('');
      $('crono-modulo').innerHTML = opciones(unicos(D.cronoTodo.filter(enSede).map(c => c.ent)), modAct, 'Todos los temas');
      $('crono-estado').innerHTML = opciones(unicos(base.map(c => c.e)), estAct, 'Todos los estados');
      pintarCronograma();
    }
    function pintarCronograma() {
      const q = norm($('crono-buscar').value), mes = $('crono-mes').value, mod = $('crono-modulo').value, est = $('crono-estado').value;
      const na = crono.cuando === 'noaplica';
      const lista = D.cronoTodo.filter(c => enSede(c) && (na ? c.na : !c.na) && (!mes || (c.i || '').startsWith(mes)) && (!mod || c.ent === mod) && (!est || c.e === est) &&
        (!crono.cuando || na || (crono.cuando === 'proximas' && c.i && c.i >= D.hoy) || (crono.cuando === 'pasadas' && c.i && c.i < D.hoy) || (crono.cuando === 'sinfecha' && !c.i)) &&
        (!q || norm([c.ent, c.pl, c.obs, c.e, c.pre, c.cl].join(' ')).includes(q)))
        .sort((a, b) => crono.cuando === 'pasadas' ? ((a.i || '') < (b.i || '') ? 1 : -1) : ((a.i || '9') < (b.i || '9') ? -1 : (a.i || '9') > (b.i || '9') ? 1 : a.fila - b.fila || a.b - b.b));
      $('crono-conteo').textContent = lista.length + ' sesión(es)';
      const grupos = {};
      lista.forEach(c => { const k = na ? 'na' : c.i ? c.i.slice(0, 7) : 'sin'; (grupos[k] = grupos[k] || []).push(c); });
      const nombreMes = k => k === 'na' ? 'No aplican (con "-" o en gris)' : k === 'sin' ? 'Por definir' : MESES_L[+k.slice(5) - 1] + ' ' + k.slice(0, 4);
      $('crono-lista').innerHTML = Object.keys(grupos).map(k => `<div class="mes-titulo mt-3 mb-2">${nombreMes(k)} <span class="text-muted fw-normal">(${grupos[k].length})</span></div><div class="tarjeta">` +
        grupos[k].map(c => {
          const key = c.cl ? c.cl + '|' + c.n : '';
          const hay = !c.na && key && D.sesiones.some(s => s.key === key) && Object.keys(D.plantas).some(pl => D.plantas[pl].bloques.indexOf(c.pl + ' · ' + c.ses) !== -1);
          return `<div class="d-flex flex-wrap align-items-center gap-3 p-3 border-bottom ${c.na || (c.i && c.i < D.hoy) ? 'opacity-75' : ''}">${c.na ? '<div class="fecha-chip gris"><div class="mes">no aplica</div></div>' : chipFecha(c.i, c.f)}
            <div class="flex-grow-1" style="min-width:220px"><div class="fw-semibold small">${c.cl ? '<span class="badge text-bg-dark me-1">' + esc(c.cl) + '</span>' : ''}${esc(c.ent)}${c.pre && c.pre !== 'TODOS' ? ' <span class="badge bg-secondary-subtle text-secondary-emphasis">' + esc(c.pre) + '</span>' : ''}</div>
              <div class="small text-muted"><i class="fa-solid fa-location-dot me-1"></i>${esc(c.pl)} · ${esc(c.ses)}${c.amb && c.amb !== c.f ? ' · Ambipar: ' + esc(c.amb) : ''}${c.br ? ' · ' + esc(c.br) + ' brigadistas' : ''}${c.obs ? ' · ' + esc(c.obs) : ''}</div></div>
            ${badgeEstadoCrono(c.e)}${hay ? `<button class="btn btn-sm btn-outline-primary" data-accion="ir-asistencia" data-sede="${esc(c.sede)}" data-key="${esc(key)}"><i class="fa-solid fa-clipboard-check me-1"></i>Asistencia</button>` : ''}
            <button class="btn btn-sm btn-outline-secondary" data-accion="crono-editar" data-k="${c.k}" title="Cambiar fecha, estado u observaciones"><i class="fa-solid fa-pen"></i><span class="ms-1">${c.na ? 'Habilitar' : c.i ? 'Editar' : 'Programar'}</span></button></div>`;
        }).join('') + '</div>').join('') || '<p class="text-muted mt-3">No hay sesiones con ese filtro.</p>';

      modal('modal-crono').show();
    }
    function revisarCrono(ev) {
      ev.preventDefault();
      const c = cronoEd, fmt = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? v.split('-').reverse().join('/') : v;
      const final = { fecha: $('cr-na').checked ? '-' : $('cr-fecha').value, ambipar: $('cr-ambipar').value, estado: $('cr-estado').value, brig: $('cr-brig').value.trim(), obs: $('cr-obs').value.trim() };
      const actuales = x => ({ fecha: x.na ? '-' : x.i || '', ambipar: isoDe(x.amb) || x.amb || '', estado: x.e || '', brig: x.br || '', obs: x.obs || '' });
      const textoAnt = (x, k) => k === 'fecha' ? (x.na ? '-' : x.f || '') : k === 'ambipar' ? x.amb || '' : actuales(x)[k];
      const lote = [];
      const agregar = (x, campos) => {
        const a = actuales(x), cambios = {}, anteriores = {};
        campos.forEach(k => { if (String(final[k]) !== String(a[k]) && !(k === 'ambipar' && !final[k] && !isoDe(x.amb) && x.amb)) { cambios[k] = final[k]; anteriores[k] = textoAnt(x, k); } });
        if (Object.keys(cambios).length) lote.push({ x: x, item: { fila: x.fila, b: x.b, ent: x.ent, pl: x.pl, ses: x.ses, cambios: cambios, anteriores: anteriores } });
      };
      agregar(c, ['fecha', 'ambipar', 'estado', 'brig', 'obs']);
      // A las otras plantas solo pasa lo que se cambió aquí (fecha, fecha Ambipar o estado), no lo que ya estaba
      const cambiados = lote.length ? ['fecha', 'ambipar', 'estado'].filter(k => k in lote[0].item.cambios && !(k === 'fecha' && esProveedor())) : [];
      const marcadas = document.querySelectorAll('#cr-otras input:checked');
      if (marcadas.length && !cambiados.length) return avisar('Para pasarlo a otras plantas, primero cambia aquí la fecha, la fecha Ambipar o el estado.', 'info', 8000);
      marcadas.forEach(el => agregar(D.cronoTodo[+el.dataset.k], cambiados));
      if (!lote.length) return avisar('No cambiaste nada.', 'info');
      const etiqueta = { fecha: 'Fecha', ambipar: 'Fecha Ambipar', estado: 'Estado', brig: '# Brigadistas', obs: 'Observaciones' };
      const ver = v => v === '-' ? 'No aplica' : esc(fmt(v)) || '—';

      $('conf-cuerpo').innerHTML = `<p class="small mb-2"><b>${esc(c.ent)}</b></p><table class="table table-sm small mb-2"><thead><tr><th>Planta y sesión</th><th>Dato</th><th>Antes</th><th>Después</th></tr></thead><tbody>` +
        lote.map(l => Object.keys(l.item.cambios).map((k, i) => `<tr><td>${i ? '' : esc(l.x.pl + ' · ' + l.x.ses)}</td><td>${etiqueta[k]}</td><td class="text-muted">${ver(l.item.anteriores[k])}</td><td class="fw-semibold">${ver(l.item.cambios[k])}</td></tr>`).join('')).join('') +
        '</tbody></table><p class="small text-muted mb-0">Queda en el historial con tu usuario. La lista de asistencia toma las fechas nuevas sola.</p>';
      $('conf-ok').innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i>Guardar';
      $('conf-ok').onclick = () => guardarCrono(lote.map(l => l.item));
      modal('modal-crono').hide(); modal('modal-confirmar').show();
    }

          (D.cronoTodo.some(c => c.pl === pl && c.ses === 'Sesión ' + n) ? '' : ` Las plantas de la lista que usan las fechas de ${esc(pl)} tendrán esa sesión en este tema.`));

    function revisarSesion2(ev) {

      const d = { fecha: $('ses-fecha').value, ambipar: $('ses-ambipar').value, estado: $('ses-estado').value, obs: $('ses-obs').value.trim() };
      $('conf-titulo').textContent = x.libre ? 'Habilitar sesión' : 'Crear sesión';

        `<p class="small text-muted mb-0">${x.libre ? 'Se pone la fecha en la sesión que tenía "-".' : 'Cambia la estructura del cronograma' + ($('ses-resumen').innerHTML.indexOf('lista de asistencia') !== -1 ? ' y de la lista de asistencia' : '') + ' (antes se guarda un respaldo del día).'} Queda en el historial.</p>`;
      $('conf-ok').innerHTML = '<i class="fa-solid fa-calendar-plus me-1"></i>' + (x.libre ? 'Habilitar' : 'Crear sesión');
      $('conf-ok').onclick = () => crearSesionApp(x, d);
      modal('modal-sesion').hide(); modal('modal-confirmar').show();
    }
    async function crearSesionApp(x, d) {
      if (x.libre) {
        const c = x.libre, cambios = { fecha: d.fecha || '' };
        if (d.ambipar) cambios.ambipar = d.ambipar; if (d.estado) cambios.estado = d.estado; if (d.obs) cambios.obs = d.obs;
        return guardarCrono([{ fila: c.fila, b: c.b, ent: c.ent, pl: c.pl, ses: c.ses, cambios: cambios, anteriores: { fecha: '-' } }]);
      }
      modal('modal-confirmar').hide(); ocupado(true);
      try {
        const r = await api('agregarSesion', E.token, Object.assign({ fila: x.f.fila, ent: x.f.nombre, pl: x.pl }, d));
        ocupado(false);
        if (revisarSesion(r)) return;

        if (!r.exito) return;
        await cargarDatos(false);
        if (E.vista === 'cronograma') { $('crono-modulo').value = x.f.nombre; crono.cuando = ''; document.querySelectorAll('#crono-cuando .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cuando === ''))); }
        cargarVista();
        if (E.vista === 'cronograma' && $('crono-modulo').value !== x.f.nombre) { $('crono-modulo').value = x.f.nombre; pintarCronograma(); }
      } catch (e) { error(e); }
    }

    // Módulo nuevo (columnas en la lista + fila en el cronograma)
    function siguienteModulo() {
      const n = D.sesiones.map(s => +s.modulo.slice(1)).concat(D.cronoFilas.map(f => /^M(\d+)$/.test(f.cl) ? +f.cl.slice(1) : 0), [11]);
      return 'M' + (Math.max.apply(null, n) + 1);
    }
    async function abrirModulo() {
      if (soloHolcim()) return;
      if (!E.usuario) return pedirSesion(abrirModulo);
      if (!(await cargarCatalogos())) return;
      $('form-modulo').reset();
      const sinModulo = D.cronoFilas.filter(f => !f.cl);
      $('mod-fila').innerHTML = sinModulo.map(f => `<option value="${f.fila}">${esc(f.nombre)}${f.pre && f.pre !== 'TODOS' ? ' (' + esc(f.pre) + ')' : ''} · ${esc(f.mes)}</option>`).join('');
      $('mod-tipo-crono').disabled = !sinModulo.length;
      $('mod-tipo-crono-l').title = sinModulo.length ? '' : 'Todos los entrenamientos del cronograma ya tienen módulo';
      $('mod-mes').innerHTML = MESES_L.map((m, i) => `<option ${i === new Date().getMonth() ? 'selected' : ''}>${m}</option>`).join('');
      $('mod-lineas').innerHTML = catalogos.lineas.map(l => `<div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="mod-l-${l}" value="${l}"><label class="form-check-label" for="mod-l-${l}">${l}</label></div>`).join('');
      ajustarModulo();
      modal('modal-modulo').show();
    }
    function ajustarModulo() {
      const crono = $('mod-tipo-crono').checked;
      document.querySelectorAll('.mod-nuevo').forEach(e => e.style.display = crono ? 'none' : '');
      document.querySelectorAll('.mod-crono').forEach(e => e.style.display = crono ? '' : 'none');
      $('mod-nombre').required = !crono;
      const lineas = [...document.querySelectorAll('#mod-lineas input:checked')].map(x => x.value);
      const nombre = crono ? ($('mod-fila').selectedOptions[0] || {}).textContent || '' : $('mod-nombre').value.trim().toUpperCase();
      $('mod-resumen').innerHTML = `Quedará como <b>${siguienteModulo()}</b>${nombre ? ': ' + esc(nombre) : ''}${!crono ? ' · ' + (lineas.length ? 'solo ' + esc(lineas.join(', ')) : 'todas las líneas') : ''}.<br>
        Se agregan 4 columnas a la lista de asistencia (Sesión 1 y 2 con su casilla)${crono ? ' y se marca esa fila del cronograma' : ' y una fila en el cronograma'}. Después le pones las fechas por planta en el Cronograma.`;
    }
    function revisarModulo(ev) {
      ev.preventDefault();

      if (!crono && d.nombre.length < 4) return avisar('Escribe el nombre del entrenamiento.', 'warning');
      $('conf-titulo').textContent = 'Crear módulo';
      $('conf-cuerpo').innerHTML = '<p class="mb-2">' + $('mod-resumen').innerHTML + '</p><p class="small text-muted mb-0">Cambia la estructura de la lista de asistencia y del cronograma (antes se guarda un respaldo del día). Queda en el historial.</p>';
      $('conf-ok').innerHTML = '<i class="fa-solid fa-plus me-1"></i>Crear módulo';
      $('conf-ok').onclick = () => crearModuloApp(d);
      modal('modal-modulo').hide(); modal('modal-confirmar').show();
    }
    async function crearModuloApp(d) {
      modal('modal-confirmar').hide(); ocupado(true);
      try {
        const r = await api('crearModulo', E.token, d);
        ocupado(false);
        if (revisarSesion(r)) return;
        avisar(esc(r.mensaje), r.exito ? (r.avisos && r.avisos.length ? 'warning' : 'success') : 'danger', 15000);
        if (!r.exito) return;
        await cargarDatos(false);
        crono.cuando = ''; document.querySelectorAll('#crono-cuando .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cuando === '')));
        ir('cronograma');
        const tema = D.cronoTodo.find(c => c.cl === r.clave);
        if (tema) { $('crono-modulo').value = tema.ent; pintarCronograma(); }
      } catch (e) { error(e); }
    }

    // ══════════ COBERTURA ══════════
    /**
     * Cobertura por planta: el total de cada planta es el encabezado de su tarjeta (no una fila más);
     * el detalle por empresa queda plegado. Metas y faltantes en personas enteras (no 0,6 personas).
     */
    /** Brigadistas activos en las listas de la app, por sede (Holcim + contratistas). */
    function brigadistasEnListas(sede) {
      const h = P.filter(p => p.activo && (!sede || p.sede === sede) && enSede(p)).length, c = I.filter(p => p.activo && (!sede || p.sede === sede) && enSede(p)).length;
      return { h: h, c: c, t: h + c };
    }
    /** Cada tarjeta es una planta del Indicador; todo con números y % explícitos. */
    function pintarCobertura(pre) {
      pre = typeof pre === 'string' ? pre : 'cob';
      const enDash = pre !== 'cob';
      const plantas = plantasCobertura();
      const per = plantas.reduce((n, x) => n + x.per, 0), bri = plantas.reduce((n, x) => n + x.bri, 0), meta = plantas.reduce((n, x) => n + x.metaN, 0);
      const cumplen = plantas.filter(x => !x.faltan).length, L = brigadistasEnListas();
      const kpi = (eti, num, sub, color) => `<div class="col-6 col-lg-3"><div class="kpi"><div class="eti">${eti}</div><div class="num" style="color:${color || 'inherit'}">${num}</div><div class="small text-muted">${sub}</div></div></div>`;
      $(pre + '-kpis').innerHTML = kpi('Personal', per, 'trabajadores según la pestaña Indicador.') +
        kpi('Brigadistas', L.t, `activos en las listas de la app (${L.h} Holcim · ${L.c} contratistas) · ${per ? Math.round(L.t / per * 1000) / 10 : 0} % del personal`) +
        kpi('Meta (20 %)', meta, meta > bri ? `faltan ${meta - bri} brigadistas · vas en ${meta ? Math.round(bri / meta * 100) : 0} % de la meta` : `meta cumplida (${meta ? Math.round(bri / meta * 100) : 0} %)`, meta > bri ? 'var(--s-mal)' : 'var(--s-ok)') +
        kpi('Plantas que cumplen', cumplen + ' de ' + plantas.length, `${plantas.length ? Math.round(cumplen / plantas.length * 100) : 0} % de las plantas${plantas.length - cumplen ? ' · ' + (plantas.length - cumplen) + ' por debajo de la meta' : ''}`, cumplen === plantas.length ? 'var(--s-ok)' : '#e8590c');
      const sin = (D.indicadorSinFila || []).filter(x => sedeOk(x.sede));
      $(pre + '-diferencia').innerHTML = sin.length ? `<details class="alert alert-light border small py-2"><summary><i class="fa-solid fa-circle-info me-1 text-primary"></i><b>${sin.length}</b> brigadista(s) de las listas no tienen fila en el Indicador (su empresa o planta no aparece allí), así que no cuentan para la meta de ninguna planta. Ver cuáles</summary>
        <div class="mt-2">${unicos(sin.map(x => x.sede + ' · ' + x.empresa)).map(k => `<div><b>${esc(k)}</b>: ${sin.filter(x => x.sede + ' · ' + x.empresa === k).map(x => esc(x.nombre)).join(', ')}</div>`).join('')}
        <div class="text-muted mt-1">Para que cuenten, agrega la fila de esa empresa (con su personal) en la pestaña Indicador. o corrige la empresa del brigadista.</div></div></details>` : '';
      const orden = enDash ? {} : (document.querySelector('#cob-orden [aria-pressed="true"]') || {}).dataset || {};
      const lista = plantas.filter(x => enDash || !$('cob-faltan').checked || x.faltan)
        .sort((a, b) => orden.orden === 'nombre' ? a.p.localeCompare(b.p, 'es') : a.pct - b.pct || b.faltan - a.faltan);
      const color = pct => pct >= 100 ? 'var(--s-ok)' : pct >= 60 ? '#f59f00' : 'var(--s-mal)';
      const estado = x => x.faltan ? `<span class="estado-cob bg-danger-subtle text-danger-emphasis">Faltan ${x.faltan}</span>` : '<span class="estado-cob bg-success-subtle text-success-emphasis"><i class="fa-solid fa-check me-1"></i>Cumple</span>';
      $(pre + '-plantas').innerHTML = lista.map(x => {
        const emp = x.empresas.slice().sort((a, b) => b.faltan - a.faltan || a.pct - b.pct);
        return `<details class="planta-cob">
          <summary>
            <i class="fa-solid fa-chevron-right flecha" aria-hidden="true"></i>
            <span class="nombre">${esc(x.p)}<span class="d-block small text-muted fw-normal">${esc(x.sede)}</span></span>
            <span class="avance">${pctBarra(Math.min(x.pct, 100), color(x.pct))}
              <span class="small text-muted"><b class="text-body fs-6">${x.pct} %</b> de la meta · <b class="text-body">${x.bri}</b> brigadistas de <b class="text-body">${x.metaN}</b> requeridos (20 % de ${x.per} personas; hoy son el ${x.pctPer} % del personal)</span></span>
            ${estado(x)}
            <span class="small text-muted">${emp.length} empresa(s)</span>
          </summary>
          <div class="p-2">
            <table class="table table-sm align-middle mb-1 tabla-compacta">
              <thead><tr><th scope="col">Empresa</th><th scope="col" class="text-end">Personal</th><th scope="col" class="text-end">Brigadistas</th><th scope="col" class="text-end">Requeridos</th><th scope="col" style="min-width:160px">% de la meta</th><th scope="col" class="text-end"></th></tr></thead>
              <tbody>${emp.map(f => `<tr><td>${esc(f.emp)}</td><td class="text-end">${f.per}</td><td class="text-end" title="${esc((f.nom || []).join(', '))}">${f.bri}</td><td class="text-end" title="20 % exacto: ${f.meta}">${f.metaN}</td>
                <td><div class="d-flex align-items-center gap-2"><div class="flex-grow-1">${pctBarra(Math.min(f.pct, 100), color(f.pct))}</div><span class="small fw-semibold" style="width:46px">${f.pct} %</span></div></td>
                <td class="text-end">${f.faltan ? `<span class="badge bg-danger-subtle text-danger-emphasis">Faltan ${f.faltan}</span>` : '<i class="fa-solid fa-check text-success" aria-label="Cumple"></i>'}</td></tr>`).join('') || '<tr><td colspan="6" class="text-muted">Sin detalle por empresa en el Indicador.</td></tr>'}</tbody>
            </table>
          </div></details>`;
      }).join('') || '<p class="text-muted">Sin datos para esta sede o filtro.</p>';
    }

    // Brigadistas que faltan en las listas (están en otras pestañas del 1.0 / 2.0 / libro nuevo)
    const falt = { datos: null, fuentes: {}, marcados: {}, ajustes: {} };
    async function abrirFaltantes() {
      if (soloHolcim()) return;
      if (!E.usuario) return pedirSesion(abrirFaltantes);
      ocupado(true);
      try { falt.datos = await api('getBrigadistasFaltantes', E.token); ocupado(false); } catch (e) { return error(e); }
      const d = falt.datos;
      falt.fuentes = {}; falt.marcados = {}; falt.ajustes = {};
      d.fuentes.forEach(f => { falt.fuentes[f.fuente] = !f.evacuadores && !f.contacto; });
      $('falt-fuentes').innerHTML = d.fuentes.map((f, k) => `<div class="form-check"><input class="form-check-input" type="checkbox" id="falt-f-${k}" data-fuente="${esc(f.fuente)}" ${falt.fuentes[f.fuente] ? 'checked' : ''}>
        <label class="form-check-label" for="falt-f-${k}">${esc(f.fuente)} <span class="text-muted">(${f.n})</span>${f.evacuadores ? ' <span class="badge bg-secondary-subtle text-secondary-emphasis">evacuadores, no brigadistas</span>' : f.contacto ? ' <span class="badge bg-secondary-subtle text-secondary-emphasis">contactos</span>' : ''}</label></div>`).join('') || '<span class="text-muted">No se encontraron personas fuera de las listas.</span>';
      $('falt-sede').innerHTML = opciones(unicos(d.candidatos.map(c => c.sede || '(sin planta)')), '', 'Todas las sedes');
      const todasPlantas = unicos(d.plantasHolcim.concat(d.plantasInhouse));
      $('falt-plantas').innerHTML = todasPlantas.map(x => `<option value="${esc(x)}">`).join('');
      d.candidatos.forEach(c => {
        const igual = todasPlantas.find(x => norm(x) === norm(c.planta)), deSede = todasPlantas.find(x => c.sede && norm(x).includes(norm(c.sede)));
        const contratista = c.empresa && !/HOLCIM/.test(c.empresa);
        falt.ajustes[c.cedula] = { planta: igual || deSede || c.planta, tipo: contratista ? 'INHOUSE' : 'HOLCIM', empresa: c.empresa };
      });
      pintarFaltantes();
      modal('modal-faltantes').show();
    }
    function visiblesFaltantes() {
      const q = norm($('falt-buscar').value), sede = $('falt-sede').value, desv = $('falt-desv').checked;
      return falt.datos.candidatos.filter(c => c.fuentes.some(f => falt.fuentes[f]) && (desv || !c.desvinculado) && (!sede || (c.sede || '(sin planta)') === sede) &&
        (!q || norm([c.nombre, c.cedula, c.planta, c.empresa].join(' ')).includes(q)));
    }
    function pintarFaltantes() {
      const lista = visiblesFaltantes();
      const n = Object.keys(falt.marcados).filter(k => falt.marcados[k]).length;
      $('falt-conteo').textContent = lista.length + ' persona(s) · ' + n + ' seleccionada(s)';
      $('falt-traer').textContent = n ? 'Traer ' + n + ' seleccionado(s)' : 'Traer seleccionados';
      $('falt-traer').disabled = !n;
      $('falt-tabla').innerHTML = lista.map(c => { const a = falt.ajustes[c.cedula]; return `<tr class="${c.desvinculado ? 'text-muted' : ''}">
        <td><input class="form-check-input falt-sel" type="checkbox" data-c="${esc(c.cedula)}" ${falt.marcados[c.cedula] ? 'checked' : ''} aria-label="Traer a ${esc(c.nombre)}"></td>
        <td class="fw-semibold">${esc(c.nombre)}${c.estado ? `<div class="small text-muted fw-normal">${esc(c.estado)}</div>` : ''}</td><td>${esc(c.cedula)}</td>
        <td><input class="form-control form-control-sm falt-aj" data-c="${esc(c.cedula)}" data-k="planta" list="falt-plantas" value="${esc(a.planta)}" style="min-width:150px">${c.planta && c.planta !== a.planta ? `<div class="small text-muted">en la pestaña: ${esc(c.planta)}</div>` : ''}</td>
        <td><select class="form-select form-select-sm falt-aj" data-c="${esc(c.cedula)}" data-k="tipo"><option value="HOLCIM" ${a.tipo === 'HOLCIM' ? 'selected' : ''}>Holcim</option><option value="INHOUSE" ${a.tipo === 'INHOUSE' ? 'selected' : ''}>Contratista</option></select></td>
        <td><input class="form-control form-control-sm falt-aj" data-c="${esc(c.cedula)}" data-k="empresa" value="${esc(a.empresa)}" style="min-width:110px"></td>
        <td class="small text-muted">${c.fuentes.map(esc).join('<br>')}</td></tr>`; }).join('') || '<tr><td colspan="7" class="text-muted text-center py-3">Nadie con ese filtro.</td></tr>';
    }
    function cambioFaltantes(ev) {
      const el = ev.target;
      if (el.dataset.fuente) { falt.fuentes[el.dataset.fuente] = el.checked; return pintarFaltantes(); }
      if (el.id === 'falt-todos') { visiblesFaltantes().forEach(c => { falt.marcados[c.cedula] = el.checked; }); return pintarFaltantes(); }
      if (el.classList.contains('falt-sel')) { falt.marcados[el.dataset.c] = el.checked; const n = Object.keys(falt.marcados).filter(k => falt.marcados[k]).length; $('falt-traer').textContent = n ? 'Traer ' + n + ' seleccionado(s)' : 'Traer seleccionados'; $('falt-traer').disabled = !n; $('falt-conteo').textContent = visiblesFaltantes().length + ' persona(s) · ' + n + ' seleccionada(s)'; return; }
      if (el.classList.contains('falt-aj')) { falt.ajustes[el.dataset.c][el.dataset.k] = el.value.trim(); }
    }
    function revisarFaltantes() {
      const lista = falt.datos.candidatos.filter(c => falt.marcados[c.cedula]).map(c => Object.assign({ cedula: c.cedula, nombre: c.nombre }, falt.ajustes[c.cedula]));
      const sinPlanta = lista.filter(x => !x.planta);
      if (sinPlanta.length) return avisar('Ponle planta a: ' + sinPlanta.map(x => esc(x.nombre)).join(', '), 'warning', 9000);
      const sinEmpresa = lista.filter(x => x.tipo === 'INHOUSE' && !x.empresa);
      if (sinEmpresa.length) return avisar('Los contratistas necesitan empresa: ' + sinEmpresa.map(x => esc(x.nombre)).join(', '), 'warning', 9000);
      $('conf-titulo').textContent = 'Traer ' + lista.length + ' brigadista(s) a las listas';
      $('conf-cuerpo').innerHTML = '<table class="table table-sm small mb-2"><thead><tr><th>Nombre</th><th>Cédula</th><th>Planta</th><th>Tipo</th><th>Empresa</th></tr></thead><tbody>' +
        lista.map(x => `<tr><td>${esc(x.nombre)}</td><td>${esc(x.cedula)}</td><td>${esc(x.planta)}</td><td>${x.tipo === 'HOLCIM' ? 'Holcim' : 'Contratista'}</td><td>${esc(x.empresa || '')}</td></tr>`).join('') + '</tbody></table><p class="small text-muted mb-0">Quedan como "Activo"; luego completa sus datos (grupo sanguíneo, fecha de ingreso…) en Brigadistas.</p>';
      $('conf-ok').innerHTML = '<i class="fa-solid fa-user-plus me-1"></i>Traer';
      $('conf-ok').onclick = () => traerFaltantes(lista);
      modal('modal-faltantes').hide(); modal('modal-confirmar').show();
    }
    async function traerFaltantes(lista) {
      modal('modal-confirmar').hide(); ocupado(true);
      try {
        const r = await api('importarBrigadistas', E.token, lista);
        ocupado(false); if (revisarSesion(r)) return;
        const malos = (r.resultados || []).filter(x => !x.exito);
        avisar('<b>' + esc(r.mensaje) + '</b>' + (malos.length ? '<ul class="small mb-0 mt-1">' + malos.map(x => '<li>' + esc(x.nombre + ': ' + x.mensaje) + '</li>').join('') + '</ul>' : ''), malos.length ? 'warning' : 'success', 15000);
        await cargarDatos(false); cargarVista();
      } catch (e) { error(e); }
    }

    // ══════════ REVISIÓN DE DATOS ══════════
    const TIPOS_REV = {
      'marca-no-aplica': ['error', 'Asistencia en sesión que no aplica'],
      'cedula-dup': ['error', 'Cédula repetida'],
      'sin-registro': ['aviso', 'Sesión pasada sin asistencia registrada'],
      'marca-futura': ['aviso', 'Asistencia marcada en fecha futura'],
      'marca-antes-ingreso': ['aviso', 'Asistencia antes de entrar a la brigada'],
      'fecha-distinta': ['aviso', 'Fecha de la hoja distinta al cronograma'],
      'cedula-invalida': ['aviso', 'Cédula vacía o con formato raro'],
      'planta-sin-crono': ['aviso', 'Planta sin cronograma'],
      'seguimiento-sin-marcas': ['aviso', 'Seguimiento dice que se dictó, la lista no tiene asistentes'],
      'seguimiento-difiere': ['info', 'Seguimiento y lista con distinta cantidad de asistentes'],
      'seguimiento-sin-sesion': ['info', 'Sesión del Seguimiento sin pareja en el cronograma'],
      'datos': ['aviso', 'Problema al leer los datos'],
      'nombre-dup': ['info', 'Mismo nombre con cédulas distintas'],
      'sin-asistencias': ['info', 'Activo sin ninguna asistencia'],
      'datos-incompletos': ['aviso', 'Datos incompletos del brigadista'],
      'sin-cert': ['info', 'Contratista sin certificado 0256'],
      'crono-estado': ['info', 'Sesión pasada que sigue "Programada"'],
      'crono-sin-fecha': ['info', 'Sesión sin fecha en el cronograma'],
    };
    function revision() {
      if (REV) return REV;
      const R = [];
      const add = (tipo, o) => R.push(Object.assign({ tipo: tipo, g: TIPOS_REV[tipo][0], titulo: TIPOS_REV[tipo][1] }, o));
      (D.avisos || []).forEach(a => add('datos', { detalle: a, que: 'Revisa Estado del sistema.' }));
      const hace = n => { const d = new Date(D.hoy); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
      P.forEach(p => {
        D.sesiones.forEach(s => {
          const x = ses(p, s.i);
          if (x.est === 'sina') add('marca-no-aplica', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n}: ${nombreSesion(s)} está marcada pero no aplica (${x.nota || x.mo}).`, que: 'Quita la marca en la lista, o si sí se dictó corrige el cronograma. El libro nuevo no la cuenta.' });
          if (x.marcada && x.aplica && x.iso && x.iso > D.hoy) add('marca-futura', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n}: ${nombreSesion(s)} es el ${x.f} y ya tiene asistencia.`, que: 'Revisa si la marca se puso en la sesión equivocada.' });
          if (x.marcada && x.iso && p.fi && isoDe(p.fi) && x.iso < isoDe(p.fi)) add('marca-antes-ingreso', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n}: asistió a ${nombreSesion(s)} (${x.f}) pero entró a la brigada el ${p.fi}.`, que: 'Corrige la fecha de ingreso o la marca.' });
        });
        if (p.activo && p.cump.t >= 2 && p.cump.c === 0) add('sin-asistencias', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n} tiene ${p.cump.t} módulos vencidos y ninguna asistencia.`, que: 'Revisa si faltan marcas o si la persona sigue en la brigada.' });

      });
      // Fechas de la hoja distintas al cronograma (por planta y sesión)
      Object.keys(D.plantas).forEach(pl => {
        const info = D.plantas[pl];
        if (!info.enCrono) add('planta-sin-crono', { sede: info.sede, planta: pl, detalle: `${pl}: no tiene bloque en el cronograma (${info.s[0] ? info.s[0].mo : ''}). Se ofrecen todas las sesiones.`, que: 'Agrega la planta al cronograma o a la tabla LN_PLANTAS.' });
        D.sesiones.forEach(s => {
          const c = info.s[s.i];
          if (c.o !== 'cronograma') return;
          const dif = P.filter(p => p.p === pl && p.x[s.i] && /^\d{2}\//.test(p.x[s.i]));
          if (dif.length) add('fecha-distinta', { sede: info.sede, planta: pl, detalle: `${pl} · ${nombreSesion(s)}: el cronograma dice ${c.f} y en la lista dice ${unicos(dif.map(p => p.x[s.i])).join(', ')} (${dif.length} persona(s)).`, que: 'Queda la del cronograma. Si la correcta es la de la lista, corrige el cronograma.' });
        });
      });
      unicos(P.map(p => p.sede)).forEach(sede => sesionesSede(sede).forEach(x => {
        if (x.aplica && x.iso && x.iso < hace(3) && !x.marcadas && x.total) add('sin-registro', { sede: sede, detalle: `${sede} · ${nombreSesion(x.s)} (${x.s.titulo}) fue el ${x.fecha} y no tiene ninguna asistencia.`, que: 'Registra la asistencia o, si no se dictó, actualiza el cronograma.', key: x.s.key });
      }));
      // Datos del brigadista por completar (activos, y desvinculados sin fecha de retiro)
      P.concat(I).forEach(p => {
        const f = faltantes(p).filter(k => k !== 'cedula'); // la cédula tiene su propio aviso
        if (f.length && (p.activo || f.indexOf('fechaRetiro') !== -1)) add('datos-incompletos', { sede: p.sede, planta: p.p, persona: p, completar: f[0],
          detalle: `${p.n} (${p.p}): falta ${f.map(k => CAMPOS_B[k].charAt(0).toLowerCase() + CAMPOS_B[k].slice(1)).join(', ')}.`, que: 'Pulsa Completar, o en Brigadistas usa "Editar en la tabla" para completar varios a la vez.' });
      });
      // Cédulas y nombres
      const todos = P.concat(I), porCed = {}, porNom = {};
      todos.forEach(p => {
        const c = String(p.c).replace(/\D/g, '');
        if (!c || c.length < 5 || c.length > 12) add('cedula-invalida', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n} (${p.p}): cédula "${p.c || 'vacía'}".`, que: 'Corrígela en la hoja: la app ubica a las personas por cédula.' });
        else (porCed[c] = porCed[c] || []).push(p);
        (porNom[norm(p.n)] = porNom[norm(p.n)] || []).push(p);
      });
      Object.keys(porCed).forEach(c => { if (porCed[c].length > 1) add('cedula-dup', { sede: porCed[c][0].sede, planta: porCed[c][0].p, persona: porCed[c][0], detalle: `Cédula ${c}: ${porCed[c].map(p => p.n + ' (' + p.p + ', ' + (p.tipo === 'HOLCIM' ? 'Holcim' : 'contratista') + ')').join(' / ')}.`, que: 'Deja una sola fila por persona o corrige la cédula equivocada.' }); });
      Object.keys(porNom).forEach(n => { const l = porNom[n]; if (l.length > 1 && unicos(l.map(p => String(p.c).replace(/\D/g, ''))).length > 1) add('nombre-dup', { sede: l[0].sede, planta: l[0].p, persona: l[0], detalle: `${l[0].n}: ${l.map(p => p.c + ' (' + p.p + ')').join(' / ')}.`, que: 'Si es la misma persona, deja una sola cédula.' }); });
      I.forEach(p => { if (p.activo && !tieneCert(p.ce)) add('sin-cert', { sede: p.sede, planta: p.p, persona: p, detalle: `${p.n} (${p.k}): certificado "${p.ce || 'vacío'}".`, que: 'Actualiza el certificado en su ficha cuando lo tenga.' }); });
      // "2026 Seguimiento" frente a las marcas de la lista: se empareja por tema y fecha (los nombres de planta no coinciden entre pestañas)
      (D.seguimiento || []).forEach(sg => {
        if (!sg.i || !/realiz/i.test(sg.ej) || !sg.cl) return;
        const sesiones = D.sesiones.filter(s => s.clave === sg.cl || s.modulo === sg.cl);
        const pares = [];
        Object.keys(D.plantas).forEach(pl => sesiones.forEach(s => { if (D.plantas[pl].s[s.i].a && D.plantas[pl].s[s.i].i === sg.i) pares.push({ pl: pl, s: s }); }));
        if (!pares.length) { add('seguimiento-sin-sesion', { sede: '', detalle: `${sg.cap} · ${sg.pl} · ${sg.f}: en el Seguimiento figura como realizada (${sg.ah} asistentes Holcim) pero ninguna planta tiene esa sesión con esa fecha en el cronograma.`, que: 'Revisa la fecha en el Seguimiento o en el cronograma.' }); return; }
        const marcas = pares.reduce((n, x) => n + P.filter(p => p.p === x.pl && p.m.charAt(x.s.i) === '1').length, 0);
        const sede = (D.plantas[pares[0].pl] || {}).sede || '';
        const ses = unicos(pares.map(x => nombreSesion(x.s))).join(', ');
        if (sg.ah > 0 && marcas === 0) add('seguimiento-sin-marcas', { sede: sede, planta: pares[0].pl, detalle: `${sede} · ${ses} (${sg.f}): el Seguimiento dice ${sg.ah} asistentes Holcim y en la lista no hay ninguna marca.`, que: 'Marca en la app quiénes asistieron (con la lista firmada de esa sesión).', key: pares[0].s.key });
        else if (sg.ah && marcas !== sg.ah) add('seguimiento-difiere', { sede: sede, planta: pares[0].pl, detalle: `${sede} · ${ses} (${sg.f}): Seguimiento ${sg.ah} asistentes Holcim, lista ${marcas}.`, que: 'Revisa cuál de los dos está bien.', key: pares[0].s.key });
      });
      D.crono.forEach(c => {
        if (c.i && c.i < hace(7) && /programada/i.test(c.e)) add('crono-estado', { sede: c.sede, planta: c.pl, detalle: `${c.pl} · ${c.ses} · ${c.ent}: fue el ${c.f} y su estado sigue "${c.e}".`, que: 'Actualiza el estado en el cronograma.' });
        if (!c.i && P.some(p => p.sede === c.sede)) add('crono-sin-fecha', { sede: c.sede, planta: c.pl, detalle: `${c.pl} · ${c.ses} · ${c.ent}: aún sin fecha.`, que: 'Pon la fecha en el cronograma cuando se programe.' });
      });
      return (REV = R);
    }
    function prepararRevision() { pintarRevision(); }
    function pintarRevision() {
      const todo = revision().filter(r => E.sedes.length ? sedeOk(r.sede) : true);
      ['error', 'aviso', 'info'].forEach(g => { $('rev-n-' + g).textContent = todo.filter(r => r.g === g).length; });
      const porTipo = {};
      todo.filter(r => !rev.g || r.g === rev.g).forEach(r => { porTipo[r.tipo] = (porTipo[r.tipo] || 0) + 1; });
      if (rev.tipo && !porTipo[rev.tipo]) rev.tipo = '';
      $('rev-tipos').innerHTML = Object.keys(TIPOS_REV).filter(t => porTipo[t]).map(t => `<button class="chip" data-accion="rev-tipo" data-t="${t}" aria-pressed="${rev.tipo === t}"><span class="punto punto-${TIPOS_REV[t][0]}"></span>${esc(TIPOS_REV[t][1])}<span class="n">${porTipo[t]}</span></button>`).join('');
      const q = norm($('rev-buscar').value);
      const orden = { error: 0, aviso: 1, info: 2 };
      const lista = todo.filter(r => (!rev.g || r.g === rev.g) && (!rev.tipo || r.tipo === rev.tipo) && (!q || norm(r.detalle + ' ' + (r.planta || '') + ' ' + r.titulo).includes(q)))
        .sort((a, b) => orden[a.g] - orden[b.g] || a.tipo.localeCompare(b.tipo));
      $('rev-conteo').textContent = lista.length + ' punto(s)';
      const max = 400;
      $('rev-lista').innerHTML = lista.slice(0, max).map(r => `<div class="rev rev-${r.g}"><div class="d-flex flex-wrap gap-2 align-items-start">
          <div class="flex-grow-1"><div class="small text-muted">${esc(r.titulo)}${r.sede ? ' · ' + esc(r.sede) : ''}</div><div>${esc(r.detalle)}</div><div class="small mt-1"><i class="fa-solid fa-arrow-right me-1 text-primary"></i>${esc(r.que)}</div></div>
          ${r.completar ? `<button class="btn btn-sm btn-warning" data-accion="completar" data-tipo="${r.persona.tipo}" data-j="${r.persona.j}" data-campo="${r.completar}"><i class="fa-solid fa-pen me-1"></i>Completar</button>` : r.persona ? `<button class="btn btn-sm btn-outline-secondary" data-accion="ficha" data-tipo="${r.persona.tipo}" data-j="${r.persona.j}">Ver ficha</button>` : ''}
          ${r.key ? `<button class="btn btn-sm btn-outline-primary" data-accion="ir-asistencia" data-sede="${esc(r.sede)}" data-key="${esc(r.key)}">Registrar</button>` : ''}</div></div>`).join('') +
        (lista.length > max ? `<p class="text-muted small">Se muestran ${max} de ${lista.length}; usa los filtros para ver el resto.</p>` : '') +
        (lista.length ? '' : '<p class="text-success"><i class="fa-solid fa-check me-1"></i>Nada que revisar con este filtro.</p>');
    }
